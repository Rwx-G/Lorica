// Cluster-plane protocol between a Lorica control-plane node and its
// followers (Epic 9, Story 9.2). This file documents the wire format.
// The actual Rust types are defined using prost derive macros in
// src/messages.rs (no protoc compilation needed), mirroring the
// lorica-command pattern.
//
// DISJOINT FROM `lorica.command` BY CONSTRUCTION (Story 9.2 AC #6).
// This package shares no message with the worker plane, and
// ClusterFrame's top-level oneof deliberately uses tags 101/102 while
// the worker Envelope uses 1/2: bytes of one frame type decode to an
// EMPTY frame (kind = None) on the other plane, never to a valid
// message. A cluster peer therefore cannot smuggle a worker Command
// (SHUTDOWN, BAN_IP, ...) through the framing; the bridge into
// lorica-command is additionally an explicit whitelist translation
// with no pass-through of any peer-supplied command type.
//
// Framing on the wire is the RpcEndpoint format:
// [8 bytes LE length][prost-encoded ClusterFrame], carried inside the
// mutual-TLS stream. Request/response matching uses per-direction
// monotonic sequences exactly as on the worker plane.

syntax = "proto3";
package lorica.cluster.v1;

// Top-level frame. Tags 101/102 (NOT 1/2) - see the disjointness note
// above.
message ClusterFrame {
  oneof kind {
    ClusterRequest request = 101;
    ClusterResponse response = 102;
  }
}

// A request from either side (the dialing follower or the control
// plane). Body tags:
//   10-19  session control (Story 9.2) and lifecycle (Story 9.3:
//          enroll on the enrollment listener, renew and leave on an
//          established session)
//   20-39  configuration replication (Story 9.4: 20-23 in use, the
//          rest reserved). 20-22 are CONTROL-PLANE-INITIATED and are
//          the only frames a follower accepts on its incoming half;
//          23 is the follower's convergence pull.
//   40-59  RESERVED for telemetry fan-in (Story 9.6)
//   60-79  RESERVED for certificate distribution (Story 9.5)
//
// `body_kind` duplicates the body's oneof tag as a scalar. A receiver
// that does not know the body (an older build talking to a newer
// peer) decodes the unknown tag as an unknown field and sees no body;
// the scalar lets it answer UNSUPPORTED_METHOD and keep the connection
// instead of treating the peer as hostile. `body_kind = 0` with no
// body is a protocol violation.
message ClusterRequest {
  uint64 sequence = 1;    // Monotonic per direction, RpcEndpoint-managed
  uint32 body_kind = 3;   // The body's oneof tag, set by the sender
  oneof body {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    Enroll enroll = 12;
    Renew renew = 13;
    Leave leave = 14;
    ConfigPrepare config_prepare = 20;
    ConfigCommit config_commit = 21;
    ConfigAbort config_abort = 22;
    ConfigPull config_pull = 23;
  }
}

// A response matched to a request by `sequence`. `status` is a
// ClusterStatus; `retry_after_s` is only meaningful with RETRY_LATER
// (Story 9.2 AC #10 admission control).
message ClusterResponse {
  uint64 sequence = 1;
  int32 status = 2;
  uint32 retry_after_s = 3;
  oneof body {
    HelloAck hello_ack = 10;
    HeartbeatAck heartbeat_ack = 11;
    EnrollAck enroll_ack = 12;
    RenewAck renew_ack = 13;
    LeaveAck leave_ack = 14;
    ConfigPrepareAck config_prepare_ack = 20;
    ConfigCommitAck config_commit_ack = 21;
    ConfigAbortAck config_abort_ack = 22;
    ConfigPullAck config_pull_ack = 23;
  }
}

// First request on every operational connection, sent AFTER the mutual
// TLS handshake has verified the client certificate (AC #4: the
// version exchange is post-authentication on the operational path).
message Hello {
  // Protocol range the sender speaks (AC #4: minimum-compatible-version
  // range, not exact equality, so rolling upgrades have a valid order).
  uint32 protocol_min = 1;
  uint32 protocol_max = 2;
  // The sender's database schema version (AC #5). A follower below the
  // control plane's schema must not apply configuration.
  uint32 schema_version = 3;
  // Display name only. Node IDENTITY is always the peer-certificate
  // fingerprint recorded at enrollment (Story 9.3 AC #8); this field
  // must never be used for authorization or as a metric label.
  string node_name = 4;
  // The sender's build version, display only (Story 9.3 AC #9's
  // `version` column). Bounded like node_name.
  string build_version = 5;
  // Story 9.4 AC #7: what the follower runs, so a reconnect converges
  // at the handshake. `applied_hash` is at most 64 lowercase hex
  // characters; anything else is a PROTOCOL_VIOLATION.
  uint64 applied_generation = 6;
  string applied_hash = 7;
  // Story 9.4 AC #11: the follower is in a break-glass window and is
  // excluded from commit sets until it ends.
  bool break_glass = 8;
}

// Token redemption (Story 9.3 AC #1/#3), the ONLY frame the
// enrollment listener accepts, sent inside a TLS session pinned to
// the control-plane leaf SPKI carried by the token. No CSR: the node
// sends its bare public key and the control plane assigns every
// certificate parameter itself.
message Enroll {
  string public_id = 1;        // Token lookup half
  bytes secret = 2;            // Token secret half (32 bytes)
  bytes public_key_der = 3;    // The node's SubjectPublicKeyInfo, DER
  string node_name = 4;        // Requested display name (bounded)
  string build_version = 5;    // Display only (bounded)
  uint32 schema_version = 6;   // The node's database schema version
}

// A granted enrollment. Any refusal is the opaque status with no
// body (Story 9.2 AC #4).
message EnrollAck {
  string node_id = 1;          // Server-assigned identity
  string cert_pem = 2;         // The node's clientAuth leaf
  string ca_pem = 3;           // The cluster CA bundle
  string status = 4;           // "pending" or "active" (AC #5)
  string cert_not_after = 5;   // RFC 3339
}

// Certificate renewal over an established session (AC #12): the node
// sends a NEW bare public key; the previous certificate stays valid
// until the node's first session on the new one.
message Renew {
  bytes public_key_der = 1;
}

message RenewAck {
  string cert_pem = 1;
  string cert_not_after = 2;   // RFC 3339
}

// The node is leaving the fleet (AC #13): the control plane revokes
// it, audits and alerts; the session ends with the acknowledgement.
message Leave {}

message LeaveAck {}

// ---- Configuration replication (Story 9.4), tags 20-23 ----
//
// Prepare/Commit/Abort are CONTROL-PLANE-INITIATED and travel on the
// follower's incoming half; a follower sending one to the control
// plane is a PROTOCOL_VIOLATION (a follower never pushes
// configuration). ConfigPull is the reverse: follower to control
// plane, and a control plane sending one is equally a violation.
//
// The payload is the Story 9.1 canonical blob: byte-stable, strictly
// decoded on the follower (`deny_unknown_fields`), with secret
// material replaced by `sha256:` digests. `hash` is its SHA-256 in
// lowercase hex, and the follower verifies it before decoding. Blob
// size is bounded by the 4 MiB frame cap.

// Phase one: stage this generation, do not apply it yet (AC #4).
message ConfigPrepare {
  uint64 generation = 1;
  string hash = 2;
  bytes blob = 3;
}

// The follower's verdict. `accepted = false` is the SEMANTIC
// rejection that aborts the round fleet-wide (AC #5); `reason` names
// the cause without echoing configuration values. A transport
// timeout is NOT this: it evicts the node and the commit proceeds.
message ConfigPrepareAck {
  bool accepted = 1;
  string reason = 2;
}

// Phase two: apply the staged generation.
message ConfigCommit {
  uint64 generation = 1;
}

message ConfigCommitAck {
  uint64 applied_generation = 1;
  string applied_hash = 2;
}

// Drop a staged generation (another follower rejected it).
message ConfigAbort {
  uint64 generation = 1;
}

message ConfigAbortAck {}

// Convergence pull (AC #7), follower to control plane: "this is what
// I run; send me the current generation if it differs".
message ConfigPull {
  uint64 applied_generation = 1;
  string applied_hash = 2;
}

// A matching hash answers with `up_to_date = true` and no blob: the
// "delta keyed on the applied hash" is "nothing to transfer".
message ConfigPullAck {
  uint64 generation = 1;
  string hash = 2;
  bytes blob = 3;
  bool up_to_date = 4;
}

// Control-plane answer to Hello when the session is admitted.
message HelloAck {
  uint32 negotiated_version = 1;   // Highest common protocol version
  uint32 schema_version = 2;       // Control plane's schema version
  // Approximate fleet size, so the follower can scale its reconnect
  // backoff cap (Story 9.2 AC #9) without knowing the roster.
  uint32 fleet_size_hint = 3;
  // Story 9.4 AC #7: the control plane's current configuration; a
  // follower behind it pulls immediately after the handshake.
  uint64 current_generation = 4;
  string current_hash = 5;
}

// Liveness probe, either direction. Story 9.4 AC #6/#7: the follower
// reports what it runs on every beat, so a missed commit converges
// within one heartbeat interval.
message Heartbeat {
  uint64 timestamp_ms = 1;
  uint64 applied_generation = 2;
  string applied_hash = 3;
  bool break_glass = 4;
}

message HeartbeatAck {
  uint64 timestamp_ms = 1;         // Echo of the probe's timestamp
  uint32 fleet_size_hint = 2;      // Refreshed backoff-cap input
  uint64 current_generation = 3;   // Story 9.4: current version
  string current_hash = 4;
}

// Response status. UNSPECIFIED doubles as the OPAQUE refusal the
// enrollment (pre-authentication) path sends for every failure class:
// an unauthenticated peer must not learn build or protocol facts from
// refusal shapes (AC #4); the real diagnostic is logged locally. An
// older peer also decodes any status it does not know as UNSPECIFIED,
// so it cannot distinguish a newer status from an opaque refusal.
enum ClusterStatus {
  CLUSTER_STATUS_UNSPECIFIED = 0;  // Opaque refusal (pre-auth paths)
  OK = 1;
  RETRY_LATER = 2;                 // AC #10: admission queue full
  INCOMPATIBLE_VERSION = 3;        // AC #4: no protocol overlap
  SCHEMA_TOO_OLD = 4;              // AC #5: follower schema below ours
  PROTOCOL_VIOLATION = 5;          // AC #6: malformed / wrong-plane frame
  UNSUPPORTED_METHOD = 6;          // AC #4: known shape, method not in this build
}

// Transport: TLS 1.3 only, ALPN "lorica-cluster/1" negotiated on every
// connection (a peer that does not negotiate it is dropped after the
// handshake). Node names in Hello are bounded to 64 bytes with no
// control characters; longer or injected names are a
// PROTOCOL_VIOLATION.
