name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Read-only by default; the release job is the one that writes.
permissions:
  contents: read

# A newer push to a pull request makes its running pipeline moot. A push
# to main or a tag gets a group of its own, so none is ever cancelled or
# left pending behind another: each one is a build of record.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    timeout-minutes: 30
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read channel + components from rust-toolchain.toml so CI and
      # local dev always run identical rustc/clippy versions. The action
      # also runs Swatinem/rust-cache itself (`cache: true` by default):
      # no separate rust-cache step, or every job restores and saves twice.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # lorica-adcs links the system GSS-API library: libgssapi-sys runs
      # bindgen (libclang) against the MIT krb5 headers at build time.
      - name: Install the GSS-API build requirements
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # pnpm, as the e2e image: its lock file is the one dependency updates
      # refresh and the one the security overrides in pnpm-workspace.yaml
      # apply to. package-lock.json resolves without them.
      - name: Build frontend (needed by lorica-api dependency)
        run: |
          cd lorica-dashboard/frontend
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Frontend audit (the dependencies the dashboard ships)
        run: cd lorica-dashboard/frontend && pnpm audit --prod

      - name: Frontend lint (svelte-check + ESLint svelte plugin)
        run: |
          cd lorica-dashboard/frontend
          pnpm run check
          pnpm run lint

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # Same four gates as the local Docker recipe (see CONTRIBUTING.md).
      # Every member and every target, so no crate list can leave one
      # out: the lists this replaced skipped lorica-tls, which holds the
      # outbound TLS policy, and seven product crates. `clippy.toml`
      # turns that policy into lints, which only hold where clippy runs.
      - name: Clippy (every crate and target, the binary with the otel feature)
        run: cargo clippy --workspace --all-targets --features lorica/otel -- -D warnings

      # lorica-mcp is a subprocess an operator's MCP client launches and
      # reads no database. The first-party crates it may link are
      # lorica-automation-policy, pure data with serde as its only
      # dependency, and lorica-tls with its error type lorica-error, the
      # TLS policy every outbound HTTP client is built on; any other
      # lorica-* crate (lorica-config and its bundled SQLite, lorica-api)
      # or SQLite itself fails this step.
      - name: lorica-mcp links neither the management crates nor SQLite
        run: |
          linked=$(cargo tree -p lorica-mcp -e normal --prefix none | awk '{print $1}' | sort -u \
            | grep -xE 'rusqlite|libsqlite3-sys|lorica-.*' \
            | grep -vxE 'lorica-mcp|lorica-automation-policy|lorica-tls|lorica-error' || true)
          if [ -n "$linked" ]; then
            echo "FAIL: lorica-mcp links: $linked"
            exit 1
          fi

      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit 2>&1

  semgrep:
    name: Semgrep (security)
    timeout-minutes: 20
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    # Runs in parallel with `lint` to keep total CI wall time down.
    # Non-blocking so Semgrep registry flakes don't fail the pipeline:
    # the findings land in the run's `semgrep-reports` artifact, not on
    # the pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --quiet semgrep

      - name: Semgrep (p/rust + OWASP + security-audit)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          semgrep scan --metrics=off \
            --config p/rust \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/docker-compose \
            --config p/github-actions \
            --config p/command-injection \
            --config p/r2c-security-audit \
            --severity WARNING --severity ERROR \
            --exclude target/ --exclude node_modules/ \
            --exclude lorica-dashboard/frontend/dist/ \
            --exclude audit-v1.3.0/ --exclude '**/*.bindgen.rs' \
            --sarif-output=semgrep-results.sarif \
            . || true

      - name: Semgrep (trailofbits/semgrep-rules)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          # Clone Trail of Bits rules (no Semgrep-registry dependency).
          # These catch Rust, generic shell, JS, and YAML hygiene issues
          # that the official p/* rulesets do not cover.
          git clone --depth 1 https://github.com/trailofbits/semgrep-rules.git /tmp/tob-rules
          semgrep scan --metrics=off \
            --config /tmp/tob-rules/generic \
            --config /tmp/tob-rules/javascript \
            --config /tmp/tob-rules/rs \
            --config /tmp/tob-rules/yaml \
            --severity WARNING --severity ERROR \
            --exclude target/ --exclude node_modules/ \
            --exclude lorica-dashboard/frontend/dist/ \
            --exclude audit-v1.3.0/ --exclude '**/*.bindgen.rs' \
            --sarif-output=semgrep-trailofbits.sarif \
            . || true

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-reports
          path: |
            semgrep-results.sarif
            semgrep-trailofbits.sarif
          retention-days: 30

  test:
    name: Test
    timeout-minutes: 45
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # lorica-adcs links the system GSS-API library: libgssapi-sys runs
      # bindgen (libclang) against the MIT krb5 headers at build time.
      - name: Install the GSS-API build requirements
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build frontend
        run: |
          cd lorica-dashboard/frontend
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Run Rust unit tests (product crates)
        run: cargo test -p lorica-config -p lorica-waf -p lorica-api -p lorica-notify -p lorica-bench -p lorica-command -p lorica-cluster -p lorica-metrics -p lorica-acme -p lorica-challenge -p lorica-geoip -p lorica-shmem -p lorica-worker -p lorica-dashboard -p lorica-mcp -p lorica-automation-policy -p lorica-adcs
        env:
          SKIP_FRONTEND_BUILD: ""

      # The binary crate, in its own step because the feature applies to it
      # alone. Clippy compiled these tests for releases before 1.9.0 and
      # nothing ran them.
      - name: Run Rust unit tests (binary crate with the otel feature)
        run: cargo test -p lorica --features otel
        env:
          SKIP_FRONTEND_BUILD: ""

      - name: Run Rust unit tests (forked crates)
        run: cargo test -p lorica-core -p lorica-proxy -p lorica-http -p lorica-error -p lorica-tls -p lorica-lb -p lorica-pool -p lorica-cache -p lorica-header-serde -p lorica-limits -p lorica-runtime -p lorica-timeout -p lorica-ketama -p lorica-lru -p lorica-memory-cache -p TinyUFO
        env:
          SKIP_FRONTEND_BUILD: "1"

      # Upstream gates its connector, listener and TLS tests on `any_tls`,
      # which the step above never enables, so they compiled nowhere. They
      # run here, in the rustls build the binary ships, with lorica-core's
      # self-contained integration binaries. A step of its own: the same
      # features on the line above would unify into every crate built on
      # lorica-core and leave the no-TLS build untested.
      - name: Run Rust unit tests (forked crates, rustls build)
        run: cargo test -p lorica-core -p lorica-lb --features lorica-core/rustls,lorica-core/integration-tests,lorica-lb/rustls
        env:
          SKIP_FRONTEND_BUILD: "1"

      - name: Run frontend tests
        run: |
          cd lorica-dashboard/frontend
          pnpm exec vitest run

  coverage:
    name: Coverage
    timeout-minutes: 45
    needs: lint
    runs-on: ubuntu-latest
    # Reports line coverage for the product crates and uploads an lcov
    # artifact so gaps stay visible. Intentionally NOT gated on a
    # `--fail-under` threshold yet: the baseline is not established, and a
    # blind threshold would flake the pipeline. Add a floor here once a
    # baseline is agreed (do not silently drop the report if you do).
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: llvm-tools-preview
      # lorica-adcs links the system GSS-API library: libgssapi-sys runs
      # bindgen (libclang) against the MIT krb5 headers at build time.
      - name: Install the GSS-API build requirements
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libclang-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build frontend (needed by lorica-api dependency)
        run: |
          cd lorica-dashboard/frontend
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov

      - name: Collect coverage (every crate with tests)
        run: |
          # Every crate whose tests run in CI, product and forked alike:
          # a crate that is compiled as a dependency but whose own tests
          # are not run shows up at 0% and makes the total meaningless
          # (the v1.7.0 report read 52% with 14k such lines).
          cargo llvm-cov --no-report \
            -p lorica-config -p lorica-waf -p lorica-api -p lorica-notify \
            -p lorica-bench -p lorica-command -p lorica-metrics -p lorica-acme \
            -p lorica-challenge -p lorica-geoip -p lorica-shmem -p lorica-worker \
            -p lorica-dashboard -p lorica-mcp -p lorica-automation-policy -p lorica-adcs \
            -p lorica -p lorica-cluster -p lorica-tls \
            -p lorica-core -p lorica-proxy -p lorica-http -p lorica-error \
            -p lorica-lb -p lorica-pool -p lorica-cache -p lorica-header-serde \
            -p lorica-limits -p lorica-runtime -p lorica-timeout -p lorica-ketama \
            -p lorica-lru -p lorica-memory-cache -p TinyUFO

      - name: Report coverage summary
        run: |
          echo '### Coverage (product crates)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex '(tests?\.rs$|/tests/)' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --lcov --output-path lcov.info \
            --ignore-filename-regex '(tests?\.rs$|/tests/)'

      - name: Upload lcov report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30

  e2e-docker:
    name: E2E (Docker)
    needs: lint
    runs-on: ubuntu-latest
    # The tests-e2e-docker/ suite drives Lorica against real backend
    # containers across every profile run.sh enables by default (its usage
    # header lists them, adcs included). It exercises the full network stack
    # deterministically on Linux, which Docker Desktop on Windows does not -
    # so it belongs in CI rather than as a Windows-local-only gate. It is
    # heavy (each profile builds a release image, with Docker layer reuse);
    # the workflow triggers keep it to PRs against main plus main/tag pushes,
    # not every feature-branch push. run.sh exits non-zero if any phase fails
    # and its per-assertion output lands in this job log.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Run the Docker e2e suite
        run: |
          cd tests-e2e-docker
          ./run.sh --build

  adcs-harness:
    name: AD CS Kerberos harness
    needs: lint
    runs-on: ubuntu-latest
    # What Epic 13 exists to guarantee is proven only against a real MIT
    # KDC and a CES fixture: a token without the TLS channel binding is
    # refused, a forged or missing mutual-authentication token is
    # refused, a wrong password costs one AS-REQ, a KDC that never
    # answers is bounded. Those are the #[ignore]d tests of
    # lorica-adcs/tests/harness.rs and the fixture's probe client, which
    # tests-e2e-docker/adcs/run.sh builds, runs and tears down; unit
    # tests cannot see an AS-REQ, so without this job a regression there
    # would leave CI green. The E2E (Docker) job runs the adcs profile,
    # the management API end to end, on top of the same fixtures.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The harness's test container shares the cargo caches of the
      # local gate container through two external volumes, which a
      # fresh runner does not have.
      - name: Create the cargo cache volumes the harness mounts
        run: docker volume create lorica-target && docker volume create lorica-cargo-registry
      - name: Run the AD CS Kerberos harness
        run: tests-e2e-docker/adcs/run.sh

  # The oldest glibc a binary runs on is the one it was linked against, so
  # the binaries are compiled on the oldest distribution they support.
  # `ubuntu-latest` linked every release up to 1.10.3 against 2.39: Debian
  # 12, Ubuntu 22.04 and RHEL 9 could not start them, while every job here,
  # all on newer systems, passed.
  build-binaries:
    name: Build binaries
    timeout-minutes: 45
    needs: test
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - name: Install the build requirements
        run: dnf install -y --setopt=install_weak_deps=False clang-devel cmake file gcc gcc-c++ git gzip krb5-devel make pkgconf-pkg-config python3 tar xz
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build frontend
        run: |
          cd lorica-dashboard/frontend
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
          pnpm run build

      # `-p lorica` alone links lorica-mcp as a library and never builds
      # its binary, which both packages ship (Story 11.4).
      - name: Build release binaries
        run: cargo build --release -p lorica -p lorica-mcp

      - name: Verify binaries
        run: |
          file target/release/lorica target/release/lorica-mcp
          target/release/lorica --version
          # lorica-mcp has no --version. With no configuration it must
          # refuse with EX_CONFIG (78), which proves it links and runs.
          rc=0
          target/release/lorica-mcp < /dev/null || rc=$?
          if [ "$rc" -ne 78 ]; then
            echo "FAIL: lorica-mcp exited $rc, expected 78"
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: lorica-linux-x86_64
          path: |
            target/release/lorica
            target/release/lorica-mcp
          retention-days: 30

      # Here so the job holding the signing key compiles nothing from
      # crates.io. cargo-cyclonedx writes next to the manifest it describes
      # and has no output-path flag; `--output-file` was rejected and
      # `|| true` hid it, so v1.6.0 and v1.7.0 shipped without an SBOM. One
      # SBOM for the binary crate covers every workspace dependency.
      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --spec-version 1.5 \
            --manifest-path lorica/Cargo.toml --override-filename lorica-sbom
          mv lorica/lorica-sbom.json dist/lorica-sbom.cdx.json
          python3 -c "import json; d = json.load(open('dist/lorica-sbom.cdx.json')); assert d['components'], 'empty SBOM'; print(len(d['components']), 'components')"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: lorica-sbom
          path: dist/lorica-sbom.cdx.json
          retention-days: 30

  # Compiling on the oldest base proves nothing unless the result starts
  # there. These are the oldest distributions the packages support.
  run-on-oldest:
    name: Run on ${{ matrix.image }}
    timeout-minutes: 10
    needs: build-binaries
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            install: dnf install -y krb5-libs
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y libgssapi-krb5-2
          - image: debian:12
            install: apt-get update && apt-get install -y libgssapi-krb5-2
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lorica-linux-x86_64
          path: bin/
      - name: Install the runtime library the packages require
        run: ${{ matrix.install }}
      - name: Both binaries start
        run: |
          chmod +x bin/lorica bin/lorica-mcp
          bin/lorica --version
          # lorica-mcp has no --version. With no configuration it must
          # refuse with EX_CONFIG (78), which proves it links and runs.
          rc=0
          bin/lorica-mcp < /dev/null || rc=$?
          if [ "$rc" -ne 78 ]; then
            echo "FAIL: lorica-mcp exited $rc, expected 78"
            exit 1
          fi

  package:
    name: Package
    timeout-minutes: 20
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lorica-linux-x86_64
          path: target/release/

      - name: Build .deb package
        run: |
          chmod +x target/release/lorica target/release/lorica-mcp
          bash dist/build-deb.sh ./target/release/lorica ./target/release/lorica-mcp

      - name: Verify .deb package
        run: |
          # Every entry must be root/root. This job runs as the unprivileged
          # runner user, and every .deb before 1.9.0 recorded that account
          # as the owner, which dpkg applied on install.
          for deb in dist/*.deb; do
            echo "--- $deb ---"
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
            not_root=$(dpkg-deb --contents "$deb" | awk '$2 != "root/root"')
            if [ -n "$not_root" ]; then
              echo "FAIL: entries not owned by root/root in $deb:"
              echo "$not_root"
              exit 1
            fi
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: lorica-deb
          path: dist/*.deb
          retention-days: 30

      - name: Install rpm tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build .rpm package
        run: |
          chmod +x target/release/lorica target/release/lorica-mcp
          bash dist/build-rpm.sh ./target/release/lorica ./target/release/lorica-mcp

      - name: Verify .rpm package
        run: |
          for rpm in dist/*.rpm; do
            echo "--- $rpm ---"
            rpm -qpi "$rpm"
            rpm -qplv "$rpm"
            # Everything but the data directory belongs to root.
            not_root=$(rpm -qplv "$rpm" | awk '$3"/"$4 != "root/root" && $9 !~ /^\/var\/lib\/lorica(\/|$)/')
            if [ -n "$not_root" ]; then
              echo "FAIL: entries not owned by root/root in $rpm:"
              echo "$not_root"
              exit 1
            fi
          done

      # What keeps the declared requirement from drifting away from the
      # binaries: the base image above can move, the two package manifests
      # do not move with it.
      - name: The packages declare the glibc the binaries need
        run: |
          needed=$(objdump -T target/release/lorica target/release/lorica-mcp \
            | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          deb_floor=$(dpkg-deb -f dist/*.deb Depends | grep -oP 'libc6 \(>= \K[0-9.]+')
          rpm_floor=$(rpm -qpR dist/*.rpm | awk '$1 == "glibc" && $2 == ">=" {print $3}')
          echo "needed: $needed, .deb declares: $deb_floor, .rpm declares: $rpm_floor"
          for floor in "$deb_floor" "$rpm_floor"; do
            if [ -z "$floor" ] || [ "$(printf '%s\n%s\n' "$needed" "$floor" | sort -V | tail -1)" != "$floor" ]; then
              echo "FAIL: a package declares less than glibc $needed"
              exit 1
            fi
          done

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: lorica-rpm
          path: dist/*.rpm
          retention-days: 30

  test-deb-install:
    name: Test .deb install
    timeout-minutes: 15
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lorica-deb
          path: pkg/
      # The runner boots systemd, so the service really starts: active,
      # enabled and recording the certificate it serves, with no repair
      # warning on a host that never had lorica.
      - name: Install on a clean host
        run: sudo bash dist/tests/deb-upgrade.sh clean pkg/*.deb
      - name: Verify the installed files
        run: |
          test -x /usr/bin/lorica
          test -x /usr/bin/lorica-mcp
          test -f /lib/systemd/system/lorica.service
          for path in /usr/bin/lorica /usr/bin/lorica-mcp \
                      /lib/systemd/system/lorica.service /usr/share/doc/lorica; do
            owner=$(stat -c %u:%g "$path")
            if [ "$owner" != "0:0" ]; then
              echo "FAIL: $path is owned by $owner, expected 0:0"
              exit 1
            fi
          done
          lorica --version
          # Installed, never started: the unit must not launch the MCP
          # server (Story 11.4). `if`, not `!`: bash -e ignores a negated
          # command, so `! grep` could never fail the step.
          if grep -q '^Exec.*lorica-mcp' /lib/systemd/system/lorica.service; then
            echo "FAIL: the shipped unit starts lorica-mcp"
            exit 1
          fi
          echo ".deb installation verified OK"
      - name: systemd unit - hardening lint
        run: |
          # The ~@chown:EPERM softening (v1.5.13) must stay in the shipped
          # unit: without it, a cert-export configured with an owner
          # UID/GID sends chown -> SECCOMP_RET_KILL and the proxy dies with
          # SIGSYS. Deterministic gate so an accidental removal fails CI.
          grep -q '^SystemCallFilter=~@chown:EPERM' /lib/systemd/system/lorica.service \
            || { echo "FAIL: ~@chown:EPERM softening missing from the shipped unit"; exit 1; }
          # Informational: unit load check + exposure score (see lorica-systemd.md).
          sudo systemd-analyze verify /lib/systemd/system/lorica.service || true
          sudo systemd-analyze security lorica.service --no-pager || true
      - name: Regression - cert-export chown must fail soft, not SIGSYS
        run: |
          # Reproduce the v1.5.13 incident at the syscall level. Run chown
          # under the EXACT SystemCallFilter directives shipped in the unit
          # and assert the process is not killed by a signal. Before the
          # fix, chown hit SECCOMP_RET_KILL and the probe would exit
          # 128+31=159 (SIGSYS); with the fix chown returns EPERM and
          # /bin/chown exits 1.
          touch /tmp/seccomp-probe
          args=()
          while IFS= read -r line; do
            args+=(-p "$line")
          done < <(grep -E '^SystemCallFilter=' /lib/systemd/system/lorica.service)
          echo "Applying ${#args[@]} filter directives from the shipped unit"
          set +e
          sudo systemd-run --quiet --pipe --wait --collect "${args[@]}" \
            /bin/chown 1000:1000 /tmp/seccomp-probe
          rc=$?
          set -e
          echo "chown-under-shipped-seccomp exit code: $rc"
          if [ "$rc" -ge 128 ]; then
            echo "FAIL: chown was killed by a signal under the shipped filter (SIGSYS regression)"
            exit 1
          fi
          echo "OK: chown fails soft under the shipped filter (no SIGSYS)"

  # The ownership repair in the postinst only acts on a host upgraded from
  # a package built before 1.9.0, so it is tested on released ones, and
  # the script fails if the precondition does not hold. 1.8.0 is the last
  # affected release. 1.6.0 wrote the access-log.db schema every release
  # from 1.7.0 to 1.9.1 failed to open, leaving the node running with no
  # persistence: the 1.6.0 node writes audit rows before the upgrade, and
  # every upgraded node must read them back and persist new ones.
  # Whether the upgrade holds the service depends on whether an account
  # has the uid those packages recorded as owner, so both cases run: on
  # this runner, whose `runner` account is uid 1001, and in an Ubuntu
  # container booted under systemd, which has no such account, as most
  # upgraded hosts do not.
  test-deb-upgrade:
    name: Test .deb upgrade from ${{ matrix.old }}
    timeout-minutes: 30
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        old: ['1.6.0', '1.8.0']
    env:
      OLD: ${{ matrix.old }}
    steps:
      # The old package is installed as root on this runner: no job token
      # left in .git/config for it to find.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: lorica-deb
          path: pkg/
      # Installed as root, so it must be the package the release job
      # signed: its detached signature is checked against the published
      # key alone, not against whatever keys the runner trusts.
      - name: Download and verify the released ${{ matrix.old }} .deb
        run: |
          mkdir -p old
          for asset in "lorica_${OLD}_amd64.deb" "lorica_${OLD}_amd64.deb.asc"; do
            curl -fsSL --retry 3 -o "old/$asset" \
              "https://github.com/Rwx-G/Lorica/releases/download/v${OLD}/$asset"
          done
          gpg --dearmor < docs/lorica-signing-key.asc > old/lorica-signing-key.gpg
          gpgv --keyring "$PWD/old/lorica-signing-key.gpg" \
            "old/lorica_${OLD}_amd64.deb.asc" "old/lorica_${OLD}_amd64.deb"
      - name: Upgrade ${{ matrix.old }} on a host with the uid-1001 account (held)
        run: |
          new=$(ls pkg/lorica_*_amd64.deb)
          sudo bash dist/tests/deb-upgrade.sh upgrade-held "old/lorica_${OLD}_amd64.deb" "$new"
      - name: Boot Ubuntu under systemd, without a uid-1001 account
        run: |
          printf '%s\n' \
            'FROM ubuntu:24.04' \
            'RUN apt-get update -qq && apt-get install -y -qq systemd systemd-sysv ca-certificates openssl procps > /dev/null && rm -rf /var/lib/apt/lists/*' \
            'STOPSIGNAL SIGRTMIN+3' \
            'CMD ["/sbin/init"]' > Dockerfile.systemd
          docker build -q -t ubuntu-systemd -f Dockerfile.systemd .
          docker run -d --name ubuntu --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock \
            -v "$PWD:/w:ro" ubuntu-systemd
          for _ in $(seq 1 30); do
            case "$(docker exec ubuntu systemctl is-system-running 2>/dev/null)" in
              running|degraded) exit 0 ;;
            esac
            sleep 1
          done
          echo "FAIL: systemd did not come up in the container"
          exit 1
      - name: Upgrade ${{ matrix.old }} on a host without it (not held)
        run: |
          new=$(ls pkg/lorica_*_amd64.deb)
          docker exec ubuntu bash /w/dist/tests/deb-upgrade.sh upgrade \
            "/w/old/lorica_${OLD}_amd64.deb" "/w/$new"

  # The released packages' preun stops and disables the service on every
  # upgrade, so the new package must start it from posttrans. That needs
  # systemd, which a `container:` job does not boot: Fedora runs here
  # under its own init, in a privileged container on the runner. The old
  # versions are the deb job's, for the same reasons.
  test-rpm-upgrade:
    name: Test .rpm upgrade from ${{ matrix.old }}
    timeout-minutes: 30
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        old: ['1.6.0', '1.8.0']
    env:
      OLD: ${{ matrix.old }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: lorica-rpm
          path: pkg/
      - name: Download the released ${{ matrix.old }} .rpm
        run: |
          mkdir -p old
          curl -fsSL --retry 3 -o "old/lorica-${OLD}-1.x86_64.rpm" \
            "https://github.com/Rwx-G/Lorica/releases/download/v${OLD}/lorica-${OLD}-1.x86_64.rpm"
      - name: Boot Fedora under systemd
        run: |
          printf '%s\n' \
            'FROM fedora:latest' \
            'RUN dnf -y -q install systemd procps-ng openssl ca-certificates && dnf clean all' \
            'STOPSIGNAL SIGRTMIN+3' \
            'CMD ["/sbin/init"]' > Dockerfile.systemd
          docker build -q -t fedora-systemd -f Dockerfile.systemd .
          docker run -d --name fedora --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock \
            -v "$PWD:/w:ro" fedora-systemd
          for _ in $(seq 1 30); do
            case "$(docker exec fedora systemctl is-system-running 2>/dev/null)" in
              running|degraded) exit 0 ;;
            esac
            sleep 1
          done
          echo "FAIL: systemd did not come up in the container"
          exit 1
      # Installed as root, so it must be the package the release job
      # signed. The keyring is a database of its own holding the
      # published key alone, so a package signed by any key the image
      # trusts does not pass, and an unsigned one fails the required
      # signature level.
      - name: Verify the released ${{ matrix.old }} .rpm signature
        run: |
          docker exec fedora bash -c '
            set -e
            keyring=$(mktemp -d)
            rpmkeys --dbpath "$keyring" --define "_keyringpath $keyring/pubkeys" \
              --import /w/docs/lorica-signing-key.asc
            rpmkeys --dbpath "$keyring" --define "_keyringpath $keyring/pubkeys" \
              --define "_pkgverify_level signature" --checksig "$1"' \
            verify "/w/old/lorica-${OLD}-1.x86_64.rpm"
      - name: Upgrade ${{ matrix.old }}, then reinstall over itself
        run: |
          new=$(ls pkg/lorica-*.rpm)
          docker exec fedora bash /w/dist/tests/rpm-upgrade.sh upgrade \
            "/w/old/lorica-${OLD}-1.x86_64.rpm" "/w/$new"
      # Nothing in it depends on the old version: one matrix leg is enough.
      - name: Install on a clean host
        if: matrix.old == '1.8.0'
        run: |
          new=$(ls pkg/lorica-*.rpm)
          docker rm -f fedora
          docker run -d --name fedora --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock \
            -v "$PWD:/w:ro" fedora-systemd
          for _ in $(seq 1 30); do
            case "$(docker exec fedora systemctl is-system-running 2>/dev/null)" in
              running|degraded) break ;;
            esac
            sleep 1
          done
          docker exec fedora bash /w/dist/tests/rpm-upgrade.sh clean "/w/$new"

  test-rpm-install:
    name: Test .rpm install
    timeout-minutes: 15
    needs: package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lorica-rpm
          path: dist/
      # dnf, not rpm -i: the package requires krb5-libs, which dnf
      # resolves from the repositories as an operator's install does.
      # The signature is the release job's business, not this job's.
      - name: Install and verify
        run: |
          dnf install -y --nogpgcheck ./dist/*.rpm
          if ldd /usr/bin/lorica /usr/bin/lorica-mcp | grep -q 'not found'; then
            ldd /usr/bin/lorica /usr/bin/lorica-mcp
            echo "FAIL: an unresolved library"
            exit 1
          fi
          test -x /usr/bin/lorica
          test -x /usr/bin/lorica-mcp
          test -f /usr/lib/systemd/system/lorica.service
          for path in /usr/bin/lorica /usr/bin/lorica-mcp \
                      /usr/lib/systemd/system/lorica.service; do
            owner=$(stat -c %u:%g "$path")
            if [ "$owner" != "0:0" ]; then
              echo "FAIL: $path is owned by $owner, expected 0:0"
              exit 1
            fi
          done
          lorica --version
          if grep -q '^Exec.*lorica-mcp' /usr/lib/systemd/system/lorica.service; then
            echo "FAIL: the shipped unit starts lorica-mcp"
            exit 1
          fi
          echo ".rpm installation verified OK"

  # Last, so a package is only ever signed for a tag that proved its own
  # signature, after every test passed on exactly those packages.
  verify-tag:
    name: Verify tag signature
    timeout-minutes: 10
    needs: [run-on-oldest, test-deb-install, test-rpm-install, test-deb-upgrade, test-rpm-upgrade, e2e-docker, adcs-harness]
    # Only a tag push reaches this. A branch build has no tag to verify.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The annotated tag object itself is needed, not just the commit.
          fetch-depth: 0
      - name: Import the published signing key
        # The same file operators are told to import in the README to verify
        # the .deb and .rpm. If it cannot verify the tag, it is the wrong key
        # or the tag was signed by something else, and both are release blockers.
        run: gpg --import docs/lorica-signing-key.asc
      - name: The tag must carry a good signature from that key
        env:
          SIGNING_KEY: B6E37EA916841674
        run: |
          set -o pipefail
          if ! git cat-file -t "$GITHUB_REF_NAME" | grep -qx tag; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; releases carry a signed annotated tag"
            exit 1
          fi
          git verify-tag --raw "$GITHUB_REF_NAME" 2>&1 | tee verify.txt
          grep -q "VALIDSIG" verify.txt
          grep -q "$SIGNING_KEY" verify.txt
          echo "$GITHUB_REF_NAME is signed by $SIGNING_KEY"

  # The only job that holds the signing key. Nothing beside it compiles or
  # comes from a third party, and a step that fails stops the release: an
  # .rpm whose signing failed used to be published unsigned.
  release:
    name: Release
    timeout-minutes: 20
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: B6E37EA916841674
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      # A directory of their own: the checkout's dist/ holds the packaging
      # scripts, and everything in the directory is published.
      - uses: actions/download-artifact@v8
        with:
          name: lorica-linux-x86_64
          path: release-assets/
      - uses: actions/download-artifact@v8
        with:
          name: lorica-deb
          path: release-assets/
      - uses: actions/download-artifact@v8
        with:
          name: lorica-rpm
          path: release-assets/
      - uses: actions/download-artifact@v8
        with:
          name: lorica-sbom
          path: release-assets/

      - name: Install rpm tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass"

      - name: Sign the packages
        run: |
          set -euo pipefail
          for deb in release-assets/*.deb; do
            gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/gpg-pass" \
              --local-user "$SIGNING_KEY" --detach-sign --armor "$deb"
            echo "Signed: ${deb}.asc"
          done
          # rpm looks for gpg2 by default, which not every image carries.
          for rpm_file in release-assets/*.rpm; do
            rpm --define "_gpg_name $SIGNING_KEY" --define "__gpg /usr/bin/gpg" \
              --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/gpg-pass" \
              --addsign "$rpm_file"
            echo "Signed: $rpm_file"
          done

      # Against the published key alone, in keyrings of their own, so a
      # package signed by anything else the runner trusts does not pass.
      - name: Every package verifies against the published key
        run: |
          set -euo pipefail
          keyring=$(mktemp -d)
          gpg --dearmor < docs/lorica-signing-key.asc > "$keyring/published.gpg"
          for deb in release-assets/*.deb; do
            gpgv --keyring "$keyring/published.gpg" "$deb.asc" "$deb"
          done
          mkdir "$keyring/rpmdb"
          rpmkeys --dbpath "$keyring/rpmdb" --define "_keyringpath $keyring/pubkeys" \
            --import docs/lorica-signing-key.asc
          rpmkeys --dbpath "$keyring/rpmdb" --define "_keyringpath $keyring/pubkeys" \
            --define "_pkgverify_level signature" --checksig release-assets/*.rpm

      # A draft is what a failed run leaves behind and may be completed. A
      # published release is never replaced, as a release tag is never moved.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets/ -maxdepth 1 -type f)
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != true ]; then
              echo "::error::$TAG is already published, and a published release is never replaced"
              exit 1
            fi
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" "${assets[@]}" --title "Lorica $TAG" --generate-notes
          fi
