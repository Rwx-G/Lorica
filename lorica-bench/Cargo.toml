[package]
name = "lorica-bench"
version = "1.10.1"
authors = ["Rwx-G"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/Rwx-G/Lorica"
description = "SLA monitoring and load testing for Lorica reverse proxy"

[dependencies]
lorica-config = { version = "1.10.1", path = "../lorica-config" }
lorica-metrics = { version = "1.10.1", path = "../lorica-metrics" }
lorica-notify = { version = "1.10.1", path = "../lorica-notify" }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
reqwest = { workspace = true }
# The TLS policy of the probe and load-test clients (`lorica_tls::http_client`).
lorica-tls = { version = "0.1.0", path = "../lorica-tls" }
sysinfo = "0.40"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
