# The L4 phase of the e2e suite (Story 12.12 D-b). A compose project of
# its own, so its Lots never serialise against edits of
# docker-compose.yml and its teardown is independent. Driven by
# l4/run-l4.sh, which run.sh calls; see that file for how a scenario is
# added.
#
# One profile runs at a time: `streams` (worker mode) then
# `streams-single` (single process), torn down with `down -v` in
# between. Both nodes carry the alias `l4-node` on the `l4` network, so
# the client and the tools target one name whichever profile runs.
#
# Backends, clients and extra nodes are added by the scenario Lots.
#
# Lanes. The project name (`-p`), the pinned subnets and the image tag
# come from l4/lib.sh, which derives them from `L4_LANE` and
# `L4_IMAGE_TAG` and exports the `L4_*` variables below; the defaults
# here are the values with neither set. Always drive this file through
# l4/lib.sh's `l4_compose` (or run.sh, which sources it), never with a
# bare `docker compose -f`. No service publishes a host port.
name: lorica-e2e-l4

x-lorica-node: &lorica-node
  build:
    context: ..
    dockerfile: tests-e2e-docker/Dockerfile
  # One image name for both nodes: a run builds the Lorica image once,
  # and l4/build-images.sh builds it for lanes that only reuse it.
  image: lorica-e2e-l4/lorica:${L4_IMAGE_TAG:-local}
  # The entrypoint starts as root and drops to `lorica` with
  # CAP_NET_BIND_SERVICE ambient (see entrypoint-streams.sh).
  user: "0:0"
  sysctls:
    # Docker defaults this to 0 in a container's network namespace,
    # which would let any user bind a privileged port and make the
    # Story 12.2 AC #3 check pass without the capability.
    net.ipv4.ip_unprivileged_port_start: "1024"
  # Above the drain under test: the default worker_drain_timeout_s is
  # 30 s and the supervisor allows a worker the drain plus 10 s before
  # SIGKILL (Story 12.2 D-f). Docker's default of 10 s would SIGKILL a
  # drain in the middle.
  stop_grace_period: 60s

x-l4-runner: &l4-runner
  build:
    context: ./test-runner
  image: lorica-e2e-l4/runner:${L4_IMAGE_TAG:-local}
  entrypoint: ["sleep", "infinity"]

services:
  lorica-streams:
    <<: *lorica-node
    profiles: ["streams"]
    entrypoint: ["/entrypoint-streams.sh"]
    volumes:
      - l4-shared:/shared
      - streams-data:/var/lib/lorica
      # Story 12.6's GeoIP scenarios point `geoip_db_path` at it.
      - ./fixtures/GeoIP2-Country-Test.mmdb:/etc/lorica-l4/GeoIP2-Country-Test.mmdb:ro
    # Names Docker's embedded DNS does not own (the 12.3 IV4 test name)
    # are forwarded to the CoreDNS service, which the node reaches on
    # l4-dns.
    dns:
      - ${L4_DNS_IP:-10.89.53.53}
    networks:
      l4:
        aliases: ["l4-node"]
      l4-dns: {}
      # `l4-node-geo` resolves to the node's address on streams-geo only,
      # so a client reaching it there speaks from its US address.
      streams-geo:
        aliases: ["l4-node-geo"]

  lorica-streams-single:
    <<: *lorica-node
    profiles: ["streams-single"]
    entrypoint: ["/entrypoint-streams-single.sh"]
    volumes:
      - l4-shared:/shared
      - streams-single-data:/var/lib/lorica
    networks:
      l4:
        aliases: ["l4-node"]

  # Shares the worker-mode node's network and pid namespaces: `ss` sees
  # its sockets, a squatter binds in its namespace, a worker can be
  # killed. Root, to signal processes owned by `lorica`.
  streams-probe:
    <<: *l4-runner
    profiles: ["streams"]
    network_mode: "service:lorica-streams"
    pid: "service:lorica-streams"
    user: root
    # Gives the node a second address on `l4` for the chosen-source-
    # address scenario (12.3 `proxy_bind`, Story 12.12 D-e).
    cap_add:
      - NET_ADMIN
    depends_on:
      - lorica-streams
    volumes:
      - l4-shared:/shared:ro

  # The single-process node's probe, as streams-probe is the worker
  # node's (Story 12.2 Lot H: each profile has a runner in Lorica's
  # namespaces). Holds the squatter of 12.2 IV2 and signals Lorica for
  # the stop path.
  streams-single-probe:
    <<: *l4-runner
    profiles: ["streams-single"]
    network_mode: "service:lorica-streams-single"
    pid: "service:lorica-streams-single"
    user: root
    depends_on:
      - lorica-streams-single
    volumes:
      - l4-shared:/shared:ro

  # Story 12.1 AC #3, the cold rollback (Story 12.12 D-h, Lot L): the
  # released 1.10.7 (baseline/Dockerfile, D-g) on the streams-single
  # node's volumes, through that node's own entrypoint (setpriv and the
  # socat forwarder are in the baseline image too). The scenario starts it
  # while the node is stopped; its profile is its own, so the
  # `streams-single` profile never starts it. One image name for every
  # lane: it holds the signed release, not this tree.
  lorica-baseline-single:
    build:
      context: ./baseline
      additional_contexts:
        signing-key: ../docs
    image: lorica-e2e/baseline:1.10.7
    profiles: ["streams-single-baseline"]
    user: "0:0"
    entrypoint: ["sh", "/entrypoint-streams-single.sh"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "1024"
    stop_grace_period: 60s
    volumes:
      - ./entrypoint-streams-single.sh:/entrypoint-streams-single.sh:ro
      - l4-shared:/shared
      - streams-single-data:/var/lib/lorica
    networks:
      l4:
        aliases: ["l4-node"]

  # Budget nodes (Story 12.2 AC #5, Story 12.12 D-f): worker mode like
  # lorica-streams, with a fd limit low enough that the stream budget,
  # not the ephemeral ports, binds. No `l4-node` alias and a /shared of
  # their own: the scenarios address them by service name and read the
  # bootstrap password from the node itself.
  lorica-budget-4k:
    <<: *lorica-node
    profiles: ["streams"]
    entrypoint: ["/entrypoint-streams.sh"]
    ulimits:
      nofile: 4096
    volumes:
      - budget-4k-shared:/shared
      - budget-4k-data:/var/lib/lorica
    networks:
      - l4

  lorica-budget-8k:
    <<: *lorica-node
    profiles: ["streams"]
    entrypoint: ["/entrypoint-streams.sh"]
    ulimits:
      nofile: 8192
    volumes:
      - budget-8k-shared:/shared
      - budget-8k-data:/var/lib/lorica
    networks:
      - l4

  # ---- Story 12.3 backends (Story 12.12 Lot C) ----------------------

  # Three PostgreSQL backends for 12.3 IV1 and a client of the same image
  # for `psql`. Trust authentication: test containers on a private
  # network.
  pg-1: &postgres
    image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    profiles: ["streams"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - l4

  pg-2: *postgres

  pg-3: *postgres

  pg-client:
    <<: *postgres
    entrypoint: ["sleep", "infinity"]
    environment:
      PGCONNECT_TIMEOUT: "5"
      PGUSER: postgres

  # test-runner/l4/tcp_backend.py: identity line then echo, HTTP 200 on a
  # GET, SIGUSR1 closes the listener and SIGUSR2 reopens it.
  tcp-backend-1: &tcp-backend
    <<: *l4-runner
    profiles: ["streams"]
    entrypoint: ["python3", "/tests/l4/tcp_backend.py", "--name", "tcp-backend-1", "--ports", "9000"]
    networks:
      - l4

  tcp-backend-2:
    <<: *tcp-backend
    entrypoint: ["python3", "/tests/l4/tcp_backend.py", "--name", "tcp-backend-2", "--ports", "9000"]

  tcp-backend-3:
    <<: *tcp-backend
    entrypoint: ["python3", "/tests/l4/tcp_backend.py", "--name", "tcp-backend-3", "--ports", "9000"]

  # Reads a PROXY v1/v2 header first and reports the address it carried.
  tcp-backend-proxy:
    <<: *tcp-backend
    entrypoint: ["python3", "/tests/l4/tcp_backend.py", "--name", "tcp-backend-proxy", "--ports", "9000", "--proxy"]

  # One listener per port of the 12.3 port-range stream, each reporting
  # its port.
  tcp-backend-range:
    <<: *tcp-backend
    entrypoint: ["python3", "/tests/l4/tcp_backend.py", "--name", "tcp-backend-range", "--ports", "7300-7315"]

  # ---- Story 12.4 backends (Story 12.12 Lot D) ----------------------

  # test-runner/l4/tls_backend.py. `raw`: behind a passthrough stream,
  # answers the SHA-256 of the ClientHello records it read. `tls`: behind
  # an upstream-TLS stream, verifies the client certificate and reports
  # it and the SNI; its PKI is copied into /tmp/pki by the scenario.
  tls-raw-1:
    <<: *tcp-backend
    entrypoint: ["python3", "/tests/l4/tls_backend.py", "raw", "--name", "tls-raw-1"]

  tls-raw-2:
    <<: *tcp-backend
    entrypoint: ["python3", "/tests/l4/tls_backend.py", "raw", "--name", "tls-raw-2"]

  tls-backend:
    <<: *tcp-backend
    entrypoint: ["python3", "/tests/l4/tls_backend.py", "tls", "--name", "tls-backend", "--pki", "/tmp/pki"]

  # Authoritative only, no forwarding (D-p): l4/coredns/Corefile serves
  # `l4.test` from a hosts file the 12.3 IV4 scenario copies in and
  # rewrites, with a 5 s TTL.
  coredns:
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    profiles: ["streams"]
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./l4/coredns:/etc/coredns:ro
    networks:
      l4-dns:
        ipv4_address: ${L4_DNS_IP:-10.89.53.53}

  # ---- Story 12.7 backends (Story 12.12 Lot G) ----------------------

  # 12.7 IV1: a real Redis the driver freezes with `docker pause`, which
  # keeps the kernel completing handshakes into its listen backlog.
  redis:
    image: redis:7.4.12-bookworm@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    profiles: ["streams"]
    networks:
      - l4

  # test-runner/l4/smtp_banner.py: the `smtp_banner` template's two cases,
  # a server that greets with 220 and one that never writes (Resolved 4).
  smtp-banner:
    <<: *l4-runner
    profiles: ["streams"]
    entrypoint: ["python3", "/tests/l4/smtp_banner.py", "--mode", "banner", "--port", "2525"]
    networks:
      - l4

  smtp-silent:
    <<: *l4-runner
    profiles: ["streams"]
    entrypoint: ["python3", "/tests/l4/smtp_banner.py", "--mode", "silent", "--port", "2525"]
    networks:
      - l4

  # ---- Story 12.9 (Story 12.12 Lot I) --------------------------------

  # The log-sinks profiles' socat syslog collector on the runner image:
  # RFC 6587 frames appended to one file per TCP connection, since each
  # worker holds its own connection and two writers to one file could
  # interleave a frame. The 12.9 scenarios stop and start it to move
  # `lorica_log_sink_up{sink="syslog"}`.
  syslog-collector:
    <<: *l4-runner
    profiles: ["streams"]
    entrypoint:
      - "sh"
      - "-c"
      - "mkdir -p /tmp/syslog && exec socat -u TCP-LISTEN:6601,fork,reuseaddr SYSTEM:'cat >> /tmp/syslog/conn-$${SOCAT_PEERPORT}.log'"
    networks:
      - l4

  # ---- Story 12.5 services (Story 12.12 Lot E) ----------------------

  # test-runner/l4/udp_tools.py amplify: 9200 answers every datagram with
  # 10 of 1,800 bytes (12.5 IV1), 9201 with one of 4,000 bytes, past the
  # 1,920 bytes a 60-byte request earns at the default ratio.
  udp-amplifier:
    <<: *tcp-backend
    entrypoint: ["python3", "/tests/l4/udp_tools.py", "amplify", "--listen", "9200:10:1800", "--listen", "9201:1:4000"]

  # Forges the victim's address, or random ones, over a raw socket
  # (Story 12.12 D-p: NET_RAW on the spoofer only).
  udp-spoofer:
    <<: *l4-runner
    profiles: ["streams"]
    user: root
    cap_add:
      - NET_RAW
    networks:
      - l4

  # The address the spoofer forges: records what the proxy reflects to it.
  udp-victim:
    <<: *l4-runner
    profiles: ["streams"]
    networks:
      - l4

  # The second resolver of 12.5 IV2 (the first is `coredns`), same
  # Corefile, on `l4`.
  coredns-2:
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    profiles: ["streams"]
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./l4/coredns:/etc/coredns:ro
    networks:
      - l4

  # dnsperf, from the perf-tools image (Story 12.12 D-p), for 12.5 IV2.
  dns-loadgen:
    build:
      context: ./perf-tools
    image: lorica-e2e-l4/perf-tools:${L4_IMAGE_TAG:-local}
    profiles: ["streams"]
    networks:
      - l4

  # Story 12.5 AC #6: one default UDP stream fits its fd budget (7,168
  # at this limit), two do not, so the second is refused on worker_fds.
  # A budget node as Lot B's: no `l4-node` alias, its own /shared.
  lorica-budget-16k:
    <<: *lorica-node
    profiles: ["streams"]
    entrypoint: ["/entrypoint-streams.sh"]
    ulimits:
      nofile: 16384
    volumes:
      - budget-16k-shared:/shared
      - budget-16k-data:/var/lib/lorica
    networks:
      - l4

  # Has its own addresses: every source-address scenario needs a client
  # that is not the node's loopback.
  streams-client:
    <<: *l4-runner
    profiles: ["streams", "streams-single"]
    volumes:
      - l4-shared:/shared:ro
    # Story 12.6 IV3 adds source addresses on streams-geo (`ip addr add`,
    # run as root). Test environment only (Story 12.12 D-p).
    cap_add:
      - NET_ADMIN
    # Not attached to streams-geo here: the Story 12.6 scenarios connect
    # it for their own run and disconnect it after (l4/scenarios/12.6.sh).
    # Attached for the whole profile, its host name would resolve to
    # either network's address, and the scenarios that take the client's
    # address from its host name would get the US one at random.
    networks:
      - l4

  # Not a test service: runs test-runner/l4/report.py over the run's log
  # (Story 12.12 D-c). run.sh invokes it with the host user's uid so the
  # Markdown it writes into results/ belongs to that user.
  l4-report:
    build:
      context: ./test-runner
    image: lorica-e2e-l4/runner:${L4_IMAGE_TAG:-local}
    profiles: ["l4-report"]
    entrypoint: ["python3", "/tests/l4/report.py"]
    network_mode: none
    volumes:
      - ./l4/scenarios.tsv:/l4/scenarios.tsv:ro
      - ../docs/prd/epic-12-v1.11.0.md:/l4/prd.md:ro
      - ./results:/results

volumes:
  l4-shared:
  streams-data:
  streams-single-data:
  budget-4k-shared:
  budget-4k-data:
  budget-8k-shared:
  budget-8k-data:
  budget-16k-shared:
  budget-16k-data:

networks:
  l4:
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${L4_V6_SUBNET:-fd00:4c34::/64}
  # The worker node and CoreDNS only: `dns:` needs a fixed address, and
  # a fixed address needs a subnet of its own.
  l4-dns:
    ipam:
      config:
        - subnet: ${L4_DNS_SUBNET:-10.89.53.0/24}
  # The GeoIP and source-address network of Story 12.6 Lot I, which
  # attaches the node and the client to it: addresses in the GeoIP test
  # database, where 214.78.120.0/22 is US; each lane takes one /24 of it.
  streams-geo:
    ipam:
      config:
        - subnet: ${L4_GEO_SUBNET:-214.78.120.0/24}
