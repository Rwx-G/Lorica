# The NFR1 upstream of the performance phase (Story 12.12 D-i, D-l): a
# static 200 with a fixed 1 KiB body, served from memory, behind both
# Lorica versions alike. `@WORKERS@` is replaced by the size of the
# backends' cpuset when the container starts (docker-compose.perf.yml).
# Keep-alive requests are not bounded, so a proxy's upstream pool stays
# warm for the whole run instead of reconnecting every 1,000 requests.
worker_processes @WORKERS@;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log stderr warn;
daemon off;

events {
    worker_connections 16384;
}

http {
    access_log off;
    keepalive_requests 1000000;
    keepalive_timeout 600s;

    server {
        listen 80 reuseport backlog=4096;

        location / {
            default_type text/plain;
            return 200 "";
        }
    }
}
