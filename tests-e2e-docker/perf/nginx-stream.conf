# nginx `stream`, the comparator of the performance phase (Story 12.12
# D-i). Every setting below mirrors what perf/run-perf.sh gives the
# Lorica streams on the same ports, so the two proxies differ by their
# engine and nothing else:
#
# - `@WORKERS@` is the proxy cpuset's size, replaced when the container
#   starts (docker-compose.perf.yml); Lorica runs `--workers` with the
#   same number.
# - TCP listeners without `reuseport`: one socket shared by the workers,
#   as Lorica's supervisor hands one socket per TCP port to every worker.
#   UDP listeners with `reuseport`: one socket per worker, as Lorica binds
#   one per worker per UDP port; without it nginx cannot keep a UDP
#   session on one worker.
# - Connect 5 s and idle 600 s on TCP, idle 30 s on UDP; 16 KiB buffers
#   (nginx's default, Lorica's fixed per-direction buffer); no splice
#   (nginx `stream` copies, so does Lorica).
# - One access-log row per connection or session, buffered, since
#   Lorica's stream access log is written asynchronously (Resolved 16).
# - `proxy_responses` and `proxy_requests` left unset: no bound on either,
#   as the Lorica UDP stream sets `unbounded_responses` and no request
#   bound (D-j, measurement 3).
# - `worker_connections` and the fd limit cover both sides of every UDP
#   session of the hold in one worker's share.
worker_processes @WORKERS@;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log stderr warn;
daemon off;

events {
    worker_connections 65536;
}

stream {
    log_format perf '$remote_addr:$remote_port $protocol $status '
                    '$bytes_received $bytes_sent $session_time $upstream_addr';
    access_log /tmp/stream-access.log perf buffer=32k;

    proxy_connect_timeout 5s;
    proxy_timeout 600s;
    proxy_buffer_size 16k;

    # Measurement 1: TCP throughput (iperf3, both directions).
    server {
        listen 7001;
        proxy_pass perf-backend:5201;
    }

    # Measurement 2: connection setup.
    server {
        listen 7002;
        proxy_pass perf-backend:5202;
    }

    # Measurement 3: the UDP hold.
    server {
        listen 7003 udp reuseport;
        proxy_pass perf-backend:5300;
        proxy_timeout 30s;
    }
}
