[kdcdefaults]
    kdc_ports = 88
    kdc_tcp_ports = 88

[realms]
    CORP.EXAMPLE.ORG = {
        database_name = /var/lib/krb5kdc/principal
        key_stash_file = /var/lib/krb5kdc/.k5.CORP.EXAMPLE.ORG
        master_key_type = aes256-cts-hmac-sha1-96
        # AES only, as the realm Lorica's generated krb5.conf expects.
        supported_enctypes = aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal
        # Every principal requires pre-authentication, as an AD account
        # does: a wrong password then shows as PREAUTH_FAILED in the log,
        # the line the harness counts for the lockout budget (Epic 13 D15).
        default_principal_flags = +preauth
        max_life = 10h
    }

[logging]
    # On the shared volume so the Rust tests can count AS-REQs.
    kdc = FILE:/harness/kdc.log
