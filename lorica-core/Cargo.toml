[package]
name = "lorica-core"
version = "0.1.0"
authors = ["Rwx-G"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/Rwx-G/Lorica"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "http", "network", "lorica"]
exclude = ["tests/*"]
description = """
Lorica's core APIs and traits for network protocols. Forked from Pingora.
"""

# Original: Cloudflare Pingora - Copyright 2024 Cloudflare, Inc.
# See NOTICE file for attribution.

[lib]
name = "lorica_core"
path = "src/lib.rs"

[dependencies]
lorica-runtime = { version = "0.1.0", path = "../lorica-runtime" }
lorica-pool = { version = "0.1.0", path = "../lorica-pool" }
lorica-error = { version = "0.1.0", path = "../lorica-error" }
lorica-timeout = { version = "0.1.0", path = "../lorica-timeout" }
lorica-http = { version = "0.1.0", path = "../lorica-http" }
lorica-tls = { version = "0.1.0", path = "../lorica-tls", optional = true }
bstr = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-stream = { workspace = true }
futures = "0.3"
arc-swap = "1"
async-trait = { workspace = true }
httparse = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
log = { workspace = true }
h2 = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
once_cell = { workspace = true }
strum = "0.28"
strum_macros = "0.28"
libc = "0.2.70"
chrono = { version = "~0.4.31", features = ["alloc"], default-features = false }
prometheus = { version = "0.14", optional = true }
regex = "1"
percent-encoding = "2.1"
parking_lot = { version = "0.12", features = ["arc_lock"] }
socket2 = { version = ">=0.4, <1.0.0", features = ["all"] }
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
sfv = "0.16"
rand = "0.10"
ahash = { workspace = true }
unicase = "2"
brotli = "9"
openssl-probe = "0.2"
tokio-test = "0.4"
zstd = "0.14.3"
httpdate = "1"
x509-parser = { version = "0.18", optional = true }
ouroboros = { version = "0.18.4", optional = true }
lru = { workspace = true, optional = true }
daggy = "0.9"

[target.'cfg(unix)'.dependencies]
# daemonize = "0.5.0" removed in v1.3.0 (RUSTSEC-2025-0069,
# unmaintained single-maintainer crate). Production Lorica runs
# under systemd with Type=simple; the legacy --daemon flag now
# emits a warning in src/server/daemon.rs and falls through to
# foreground execution. See ROADMAP.md audit follow-ups.
nix = { version = "0.31", features = ["socket", "uio", "net", "fs", "signal", "user", "process"] }

[dev-dependencies]
h2 = { workspace = true, features = ["unstable"] }
tokio-stream = { version = "0.1", features = ["full"] }
env_logger = "0.11"
reqwest = { version = "0.12", features = ["rustls-tls-webpki-roots"], default-features = false }
rstest = "0.28"
# Types only (ServerCertVerifier, CertificateDer, DigitallySignedStruct in
# the connector tests). No provider feature: the runtime provider arrives
# through lorica-tls, which pins ring. Left on default features this entry
# unifies `aws_lc_rs` onto the shared rustls node and drags aws-lc-sys
# (~69 MB of vendored C, built through cmake) into every test build, even
# though the production binary never compiles it (upstream 5396a1fa).
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
] }

[target.'cfg(unix)'.dev-dependencies]
# The Unix-socket client of tests/test_basic.rs. hyper-util is named only
# for the `Client` type hyperlocal's `UnixClientExt` returns, and is
# already in the tree through reqwest.
hyperlocal = { version = "0.9", default-features = false, features = ["client"] }
hyper-util = { version = "0.1", features = ["client-legacy"] }
jemallocator = "0.5"

[[test]]
name = "test_basic"
required-features = ["integration-tests"]

[[test]]
name = "server_phase_fastshutdown"
required-features = ["integration-tests"]

[[test]]
name = "server_phase_gracefulshutdown"
required-features = ["integration-tests"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("openssl", "s2n"))'] }

[features]
default = []
integration-tests = []
rustls = ["lorica-tls", "any_tls", "dep:x509-parser", "ouroboros"]
any_tls = []
connection_filter = []
prometheus = ["dep:prometheus"]
