# cargo-audit configuration. Read automatically by `cargo audit` when
# run from the workspace root (no CLI flag needed - the same call the
# GitHub Actions CI job runs).
#
# The ignore list is empty. An entry needs a written rationale here
# (dependency path, runtime exposure, revisit trigger) and a mirror in
# `deny.toml`. The last four entries went in 1.9.2, when the optional
# `route53` feature stopped pulling the AWS SDK's legacy rustls 0.21 /
# hyper 0.14 client (see `lorica-acme/Cargo.toml`).

[advisories]
ignore = []
