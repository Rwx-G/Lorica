[package]
name = "lorica-stream"
version = "1.10.6"
authors = ["Romain G."]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/Rwx-G/Lorica"
description = "Stream data plane for Lorica: the worker-side stream runtime, its accept and receive loops, the connection tracker, the fd budget, bind state and the reconcile diff"

# The layer-4 data plane runs beside Pingora, not inside it: no listener
# in Pingora's set and no task on Pingora's runtimes. It depends on
# `lorica-worker` for the stream control messages, so a worker and
# single-process mode speak one type, and on `lorica-config` for the
# stream model and its end reasons. `lorica-api` reads the bind-state and
# budget types from here without depending on the binary.
[dependencies]
lorica-config = { version = "1.10.6", path = "../lorica-config" }
lorica-worker = { version = "1.10.6", path = "../lorica-worker" }
# The PROXY protocol parser and encoder (Story 12.3 D-j, D-k), shared
# with the HTTP listeners. Default features off: no TLS stack.
lorica-core = { version = "0.1.0", path = "../lorica-core", default-features = false }
# The stream-caps regions of UDP streams (Story 12.5 D-d): a worker maps
# the memfd a `caps` message carries, the supervisor creates them.
lorica-shmem = { version = "1.10.6", path = "../lorica-shmem" }
# `recvmsg` with `IP_PKTINFO` / `IPV6_PKTINFO` on wildcard UDP listen
# addresses (Story 12.5 D-g): tokio's `UdpSocket` has no ancillary API.
nix = { version = "0.31", features = ["socket", "net", "uio"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
# Puts the stream control end in non-blocking mode for `AsyncFd`; TCP
# keepalive and shutdown on the engine's sockets.
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "test-util"] }
