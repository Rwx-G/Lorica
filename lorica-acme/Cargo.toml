[package]
name = "lorica-acme"
version = "1.10.1"
authors = ["Rwx-G"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/Rwx-G/Lorica"
description = "Pure ACME / Let's Encrypt protocol core for Lorica: instant-acme driver, CSR generation, and DNS-01 provider challengers"

[dependencies]
# instant-acme drives the ACME protocol (account, order,
# authorizations, challenge readiness, finalize_csr, poll). Default
# features bring `aws-lc-rs` + `hyper-rustls`; we pin `ring` instead to
# match the rest of the workspace (`lorica-tls`, `lorica-api`,
# `lorica/rustls`) so the binary does not carry two crypto providers in
# parallel. `rcgen` (below) generates the CSR fed into `finalize_csr`.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
# The HTTP client handed to instant-acme (`Account::builder_with_http`)
# in place of its own, which verifies through the platform verifier on
# the process-wide provider. These three name the client's type and
# build its connector around a rustls configuration from
# `lorica_tls::http_client`; instant-acme already pulls all of them.
# hyper-rustls' default features would add `aws-lc-rs`.
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false }
bytes = "1"
rcgen = "0.14"
reqwest = { workspace = true, features = ["json"] }
# The TLS policy of the ACME client and of the DNS provider clients
# (`lorica_tls::http_client`).
lorica-tls = { version = "0.1.0", path = "../lorica-tls" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"
base64 = "0.23"
tracing = "0.1"
parking_lot = "0.12"
async-trait = { workspace = true }
thiserror = "2"
tokio = { workspace = true, features = ["time"] }
# Route53 is opt-in: the AWS SDK is a large dep graph that deployments not
# using ACME DNS-01 via Route53 (the great majority) should not compile.
# Enable via `lorica-api`'s `route53` feature.
#
# Both crates must stay on the SDK's default HTTPS client (rustls 0.23).
# `aws-sdk-route53`'s default `rustls` feature selects the legacy client
# instead, which drags in the rustls 0.21 / webpki 0.101 / hyper 0.14
# stack; that is why its default features are off.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls"], optional = true }
aws-sdk-route53 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"], optional = true }

[features]
default = []
route53 = ["dep:aws-config", "dep:aws-sdk-route53"]

[dev-dependencies]
# `net` and `io-util` for the TLS server `tests/tls_policy.rs` runs.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
# HTTP mock server for unit-testing the Cloudflare + OVH DNS challengers
# without hitting the real providers (v1.5.0 backlog #9). Scoped to dev so
# the runtime binary does not pick up the dep.
wiremock = "0.6"
