        Metadata only. No PEM body of any kind crosses this path, and
        key material crosses no path on this listener at all: the
        single-certificate endpoint, which does return the public
        certificate PEM, is deliberately not mounted here.


        For a credential carrying a scope a grant bounds, only the
        certificates whose domain and every SAN are inside its
        `allowed_hostnames`, and the window pages over those.


        Required scope: `certificates:read`.
      operationId: automationListCertificates
      x-required-scope: certificates:read
