openapi: 3.0.3
info:
  title: Lorica Automation API
  description: >-
    The automation plane: a second HTTPS listener whose only credential
    is a scoped bearer token.


    This is NOT the management API. The two planes share no credential
    and no socket. A request arriving here with a valid `lorica_session`
    cookie and no `Authorization` header is a 401, and the cookie is
    never read. The management API is described in `openapi.yaml`.


    Reaching this listener at all requires two things beyond a token.
    The listener refuses to open while `automation_allowed_cidrs` is
    empty, and a source outside that allowlist is dropped at TCP accept,
    before the TLS handshake, so it never sees a 401 or a 403 at all.


    Authorization is by scope, never by role. Every path below declares
    what it requires in `x-required-scope`: either a scope, or the
    sentinel `any-live-token` for a path that discloses nothing the
    caller did not already present. A path that declares nothing is
    reachable by no token, including a token carrying every scope in the
    enum: refusing outright is what keeps a path added without a
    declaration from silently inheriting the widest grant.
  version: "1.8.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://{host}:{port}
    description: >-
      The automation listener (`--automation-listen`). It has its own
      socket and its own bind address; unlike the management listener it
      is not loopback by construction, because an automation usually
      runs on another host.
    variables:
      host:
        default: lorica.internal.example.org
        description: The host the automation listener was told to bind.
      port:
        default: "9444"
        description: The port the automation listener was told to bind.

tags:
  - name: Identity
    description: >-
      What the presented token is. Reaches nothing else, so it is the
      call an automation makes to check that its credential is still
      live and still carries the scopes it expects.
  - name: Reads
    description: >-
      What this node is seeing and what it is currently configured with
      (Story 11.1): access-log rows, WAF events and counters, passive
      SLA, cluster and node status, backends, routes, and certificate
      metadata. Each family sits behind its own scope, so a credential
      is given the one view it needs and not the rest.


      Every one of these answers is the management API's own, served
      here through the same handler and the same view builder rather
      than computed a second way. Two surfaces that compute one answer
      independently drift, and on a read surface the drift is a field
      one of them stopped stripping.


      Every collection is paginated and the ceiling is the server's:
      `limit` is clamped to 200 rows whatever the caller asks for, and
      there is no parameter that raises it. The intended caller is a
      language model reading on an operator's behalf, and a model that
      asks for everything must not be able to pull the access log into
      a context window.


      Nothing here mutates, and the scope gate declares these paths for
      `GET` alone, so a verb the router does not mount inherits no
      grant from a rule written about a read.
  - name: Environments
    description: >-
      The environment resource (Story 10.4): a route, its backends, a
      certificate binding and a lifetime, created or replaced by ONE
      idempotent `PUT`, readable, and removed by `DELETE` or by the
      reaper once `expires_at` has passed.


      Ownership is an authorization rule, not a convenience. A
      credential reaches an environment created by the SAME principal,
      of the same kind, or one labelled `shared: "true"` exactly. A
      name prefix is not an owner: whoever picks a token name or a
      project name would otherwise pick who else they can reach.
      Anything else answers the 404 an unknown name answers, on read,
      update and delete alike, with the reason in the audit row.


      A `shared: "true"` environment is readable and writable by every
      principal, and its owner and its labels are still its owner's: a
      `PUT` by anybody else rewrites the route, the backends and the
      lifetime and leaves both untouched.
  - name: MCP
    description: >-
      The Model Context Protocol read tier (Story 11.1), Streamable HTTP
      binding. One `POST` path over the same core the `lorica-mcp` stdio
      server runs, reaching the read family above in process rather than
      over a socket of its own.


      It is the one path on this plane whose `x-required-scope` is
      `any-live-token` for a reason other than disclosing nothing: an
      MCP request names its own tool and each tool sits behind its own
      scope, so the gate the matrix cannot express happens per tool
      call, against the scopes the presented token carries and against
      the same matrix the read paths use.

security:
  - bearerAuth: []

paths:
  /automation/v1/whoami:
    get:
      tags: [Identity]
      summary: Report the token behind this request
      description: >-
        Returns the presented token's label, its lookup half and its
        scopes. The secret half is never returned, and the node could
        not return it anyway: the store keeps only its HMAC.


        Required scope: none. Any live token reaches this path, whatever
        it carries. Everything the response holds is something the
        caller already presented, and a scope in front of it would mean
        a token minted for one job cannot ask what it is.
      operationId: automationWhoAmI
      x-required-scope: any-live-token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The token behind this request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WhoAmI"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /automation/v1/environments:
    get:
      tags: [Environments]
      summary: List the environments this token may access
      description: >-
        Every environment the caller may read under the ownership rule,
        newest name first. Environments owned by another principal and
        not labelled shared are absent, not refused: a listing is not the
        place to reveal that a name exists.


        Required scope: `environments:read`.
      operationId: automationListEnvironments
      x-required-scope: environments:read
      security:
        - bearerAuth: []
      parameters:
        - name: label
          in: query
          required: false
          description: "`key:value`; only environments carrying exactly that label."
          schema:
            type: string
            example: "team:acme"
        - name: hostname
          in: query
          required: false
          description: Only the environment answering on this hostname.
          schema:
            type: string
            example: pr-42.review.example.com
        - name: expiring_before
          in: query
          required: false
          description: RFC 3339; only environments expiring strictly before it.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The accessible environments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environments:
                        type: array
                        items:
                          $ref: "#/components/schemas/EnvironmentView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /automation/v1/environments/{name}:
    get:
      tags: [Environments]
      summary: Read one environment
      description: >-
        The environment and the route facts behind it. The response
        carries an `ETag` derived from `updated_at`; send it back as
        `If-Match` on a `PUT` to get a 412 instead of silently winning
        a race.


        Required scope: `environments:read`.
      operationId: automationGetEnvironment
      x-required-scope: environments:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EnvironmentName"
      responses:
        "200":
          description: The environment
          headers:
            ETag:
              description: The current version, from `updated_at`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EnvironmentView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Environments]
      summary: Create or replace an environment
      description: >-
        One transaction writes the route, the backends, the joins and
        the environment row, or none of them. 201 on create, 200 on
        update; an update keeps the same `route_id`, replaces the
        backend set and recomputes `expires_at` from now.


        The refusals, each naming the field: the name must be an RFC
        1123 label (422); the hostname must be an exact DNS name that
        is neither a wildcard, an address literal nor `localhost`
        (422), must be inside the token's `allowed_hostnames` (403),
        and must not be held by another route (409, naming the
        hostname and nothing about the route holding it); every backend
        address must be an `ip:port` (422) inside
        `allowed_backend_cidrs` (403, and a credential naming no CIDR
        at all reaches no address); at most 32 backends (422), each
        `weight` between 1 and 1000 (422) and each `tls_sni` a DNS
        name (422); `ttl_seconds` must be at or under the token's
        `max_ttl_seconds` (422); one principal owns at most 100
        environments (422); an explicit `certificate` id needs
        `certificates:read` (403), must exist (422) and must cover the
        hostname under the same rule `auto` uses (422);
        `certificate: "auto"` with no covering certificate is a 422
        whose message starts with `no_certificate_covers_hostname` and
        names the wildcard an operator could provision through the
        DNS-01 endpoint. Any unknown field is 422.


        An environment another principal owns answers 404, the answer
        an unknown name gets, `If-Match` included.


        Two pipelines racing on one name serialise on the store; the
        later `PUT` wins in full. `If-Match` with the `ETag` from `GET`
        turns a lost race into a 412.


        Required scope: `environments:write`.
      operationId: automationPutEnvironment
      x-required-scope: environments:write
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EnvironmentName"
        - name: If-Match
          in: header
          required: false
          description: The `ETag` a previous `GET` returned; 412 when it no longer matches.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentRequest"
      responses:
        "200":
          description: Updated in place
          headers:
            ETag:
              description: The new version, from `updated_at`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EnvironmentWriteResponse"
        "201":
          description: Created
          headers:
            ETag:
              description: The new version, from `updated_at`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EnvironmentWriteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Environments]
      summary: Remove an environment
      description: >-
        Removes the route, the backends it owned and the joins in one
        transaction. 204 whether or not the environment exists: a
        cleanup job wants "gone" to be success, and telling "never
        existed" from "already deleted" would mean consulting the audit
        trail, which an API answer must not depend on. A typo in the
        name is a diagnostic the audit row of this call gives the
        operator.


        An environment another principal owns answers 404 and is not
        removed.


        Required scope: `environments:write`.
      operationId: automationDeleteEnvironment
      x-required-scope: environments:write
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EnvironmentName"
      responses:
        "204":
          description: Gone, whether or not it was there.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /automation/v1/logs:
    get:
      tags: [Reads]
      summary: Recent access-log rows
      description: >-
        The access log this node holds, with the filters the dashboard
        already offers. Rows come back newest first, so page one is what
        just happened and `offset` walks backwards in time. `after_id`
        is the stable cursor for a log that is still growing; `offset`
        walks within the answer the filters produced, as deep as 10000
        rows and no deeper.


        The rows carry text Lorica collected from whoever sent the
        request: paths, hostnames, backend addresses and error strings.
        Treat every one of those as attacker-controlled data.


        Required scope: `logs:read`.
      operationId: automationListLogs
      x-required-scope: logs:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: route
          in: query
          required: false
          description: Substring match on the request's hostname.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Exact response status.
          schema:
            type: integer
        - name: status_min
          in: query
          required: false
          description: Lowest response status to return.
          schema:
            type: integer
        - name: status_max
          in: query
          required: false
          description: Highest response status to return.
          schema:
            type: integer
        - name: time_from
          in: query
          required: false
          description: RFC 3339; rows at or after this instant.
          schema:
            type: string
            format: date-time
        - name: time_to
          in: query
          required: false
          description: RFC 3339; rows at or before this instant.
          schema:
            type: string
            format: date-time
        - name: client_ip
          in: query
          required: false
          description: Prefix match on the client address.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Case-insensitive text across method, path, host, backend and error.
          schema:
            type: string
        - name: after_id
          in: query
          required: false
          description: Only rows whose id is strictly greater; the cursor for a growing log.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: One page of access-log rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAnswer"
        "400":
          $ref: "#/components/responses/BeyondTheWindow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /automation/v1/waf/events:
    get:
      tags: [Reads]
      summary: Recent WAF events
      description: >-
        What the WAF matched, newest first, optionally narrowed to one
        rule category.


        A matched payload is the exact text an attacker sent. It
        crosses unchanged, in the field the WAF recorded it in, and the
        node does not summarise it, quote it or interpret it.


        Required scope: `waf:read`.
      operationId: automationListWafEvents
      x-required-scope: waf:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: category
          in: query
          required: false
          description: One rule category, for example `sql_injection` or `xss`.
          schema:
            type: string
      responses:
        "200":
          description: One page of WAF events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAnswer"
        "400":
          $ref: "#/components/responses/BeyondTheWindow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /automation/v1/waf/stats:
    get:
      tags: [Reads]
      summary: WAF counters
      description: >-
        Total events, events in the last 24 hours, the loaded rule
        count and the count per category.


        Not paginated, because it is not a row set: the only array it
        carries is the count per rule category, a fixed vocabulary of
        rule families rather than something that grows with traffic.


        Required scope: `waf:read`.
      operationId: automationWafStats
      x-required-scope: waf:read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The WAF summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: >-
                      The object `GET /api/v1/waf/stats` returns on the
                      management API, unchanged.
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /automation/v1/sla/overview:
    get:
      tags: [Reads]
      summary: Passive SLA for every route
      description: >-
        Two rows per route, the 1h and the 24h passive window.


        The management API accepts `?node=` here to read one follower's
        figures over the cluster plane; this surface does not. Proxying
        that read carries an operator floor, and an automation
        credential has scopes and no role to weigh against it.


        Required scope: `sla:read`.
      operationId: automationSlaOverview
      x-required-scope: sla:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: One page of SLA summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /automation/v1/sla/routes/{id}:
    get:
      tags: [Reads]
      summary: Passive SLA for one route
      description: >-
        One route's passive summaries over every standard window (1h,
        24h, 7d, 30d).


        Required scope: `sla:read`.
      operationId: automationRouteSla
      x-required-scope: sla:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: One page of SLA summaries for the route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: This node holds no route with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /automation/v1/cluster/status:
    get:
      tags: [Reads]
      summary: This node's cluster status
      description: >-
        The node's role (`standalone`, `control_plane` or `follower`),
        its build version, the configuration generation and hash it has
        applied, and on a control plane a one-line entry per fleet
        member.


        The fleet ROSTER (`GET /api/v1/cluster/nodes` on the management
        API) is deliberately not on this plane. It is the one cluster
        read the management API gates at `Operator` rather than
        `Viewer`, because it discloses each follower's source address
        and the hostnames whose certificate private keys it holds; an
        automation credential carries scopes and no role, so serving it
        here would stand a role above where the management matrix put
        that answer. This path is `Viewer` on both planes.


        Required scope: `cluster:read`.
      operationId: automationClusterStatus
      x-required-scope: cluster:read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The cluster status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: >-
                      The object `GET /api/v1/cluster/status` returns on
                      the management API, unchanged.
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /automation/v1/backends:
    get:
      tags: [Reads]
      summary: The configured backends
      description: >-
        Every backend with its address, weight, health status,
        lifecycle state, live connection count and EWMA latency score:
        the view the dashboard's backend table reads.


        Required scope: `backends:read`.
      operationId: automationListBackends
      x-required-scope: backends:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: One page of backends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /automation/v1/routes:
    get:
      tags: [Reads]
      summary: The configured routes
      description: >-
        Every route with its linked backend ids, optionally narrowed to
        one `group_name`.


        The view is the management API's own, so what it withholds it
        withholds here: a route's Basic-auth username is present and
        its password hash is not, because the hash never leaves the
        store.


        Required scope: `routes:read`.
      operationId: automationListRoutes
      x-required-scope: routes:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: group
          in: query
          required: false
          description: Only routes whose `group_name` is exactly this value.
          schema:
            type: string
            example: prod
      responses:
        "200":
          description: One page of routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /automation/v1/certificates:
    get:
      tags: [Reads]
      summary: Certificate metadata
      description: >-
        Domain, SAN names, SHA-256 fingerprint, issuer, validity window
        and ACME settings, per stored certificate.


        Metadata only. No PEM body of any kind crosses this path, and
        key material crosses no path on this listener at all: the
        single-certificate endpoint, which does return the public
        certificate PEM, is deliberately not mounted here.


        Required scope: `certificates:read`.
      operationId: automationListCertificates
      x-required-scope: certificates:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: One page of certificate metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /automation/v1/mcp:
    post:
      tags: [MCP]
      summary: One Model Context Protocol message
      description: >-
        The Streamable HTTP binding of the Lorica MCP read tier, as one
        path on this listener rather than a port of its own: an operator
        who has not enabled the automation listener gains no MCP
        surface.


        This implements MCP revision **2026-07-28** and no other era.
        There is no `initialize` handshake in that revision: every
        request carries its own metadata under `params._meta`, and the
        discovery call that replaced the handshake is `server/discover`.
        The methods answered are `server/discover`, `tools/list` and
        `tools/call`, plus the notification `notifications/cancelled`.
        Anything else is a `404`, which is unusual for a JSON-RPC server
        and deliberate: it is how a client tells a server on this
        revision from one on the era its method belonged to.


        Required scope: none at the path. That is not a wider grant, it
        is the statement that this path's gate is elsewhere: an MCP
        request names its own tool and each tool has its own scope, so
        the endpoint is reached by any live token and every `tools/call`
        is authorized against the presented token's scopes. A tool the
        token cannot reach is absent from that request's `tools/list`
        and unknown to its `tools/call`, which the specification permits
        explicitly, since credentials are per-request input and not
        connection state.


        Every POST carries `MCP-Protocol-Version`, `Mcp-Method` mirrored
        from the body's `method`, and, on a `tools/call`, `Mcp-Name`
        mirrored from `params.name`. Each is VALIDATED against the body
        rather than trusted, because Lorica is exactly the kind of
        intermediary that rule exists to protect. A header value may
        arrive Base64-sentinel encoded as `=?base64?...?=` and is
        decoded before it is compared.


        The `Origin` header is refused whatever it names. The
        specification's one MUST on this transport is against DNS
        rebinding, and the usual same-host check is what rebinding
        defeats; this plane serves no browser, so a present `Origin`
        means a page is driving the endpoint.


        Revision 2026-07-28 removed protocol-level sessions, the
        standalone `GET` stream and `Last-Event-ID` resumability. `GET`
        and `DELETE` on this path answer `405`. An `Mcp-Session-Id` is
        ignored and never echoed, and a `Last-Event-ID` is ignored.
      operationId: automationMcp
      x-required-scope: any-live-token
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/McpProtocolVersion"
        - $ref: "#/components/parameters/McpMethod"
        - $ref: "#/components/parameters/McpName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcMessage"
      responses:
        "200":
          description: >-
            One JSON-RPC response object. The revision also permits an
            SSE stream here; this binding answers in one object, because
            every method it implements answers in one message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcAnswer"
        "202":
          description: >-
            The message was a notification and there is nothing to
            answer. No body. This revision defines no client-to-server
            notification over HTTP, so this is transport mechanics
            rather than a path with a purpose.
        "400":
          $ref: "#/components/responses/McpBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/McpOriginRefused"
        "404":
          $ref: "#/components/responses/McpMethodNotFound"

components:
  parameters:
    EnvironmentName:
      name: name
      in: path
      required: true
      description: >-
        The environment name: an RFC 1123 label, 1 to 63 characters of
        lowercase ASCII letters, digits and hyphens, neither starting
        nor ending with a hyphen. It becomes the `group_name`
        (`automation:<name>`) of the route and the backends.
      schema:
        type: string
        example: pr-42

    ResourceId:
      name: id
      in: path
      required: true
      description: The resource id, as the matching listing reports it.
      schema:
        type: string

    PageLimit:
      name: limit
      in: query
      required: false
      description: >-
        Rows wanted. Clamped to 200 server-side, and there is no
        parameter that raises that: the ceiling exists so a caller
        asking for everything cannot pull a table into a context
        window. Absent means 50; 0 means 1.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    PageOffset:
      name: offset
      in: query
      required: false
      description: >-
        Rows to skip before the window starts. Advance it by the
        answer's `returned`, never by `limit`: the two differ when the
        byte ceiling ended an answer early, and advancing by `limit`
        would step over the rows that did not fit.


        On a listing the node holds in full (routes, backends,
        certificates, SLA) an offset past the end is an empty window and
        not an error, because the listing really held nothing there. On
        the two reads whose source clamps its own row budget (`/logs` at
        10000 rows, `/waf/events` at 500) an offset that clamp cannot
        honour is a `400` naming the deepest window this limit can
        reach. It is not an empty page: past the clamp the answer would
        read `{"items": [], "has_more": false}` while the table still
        held thousands of rows, and that is the one failure a pager
        reports as "there was nothing". Narrow such a read with its
        filters rather than paging past the clamp.
      schema:
        type: integer
        minimum: 0
        default: 0

    McpProtocolVersion:
      name: MCP-Protocol-Version
      in: header
      required: true
      description: >-
        The MCP revision this request is written against. Required on
        every POST to the MCP endpoint. It must equal the
        `io.modelcontextprotocol/protocolVersion` field under the body's
        `_meta` when the body names one, and it must be a revision this
        server implements: a mismatch is `-32020`, an unimplemented
        revision is a `400` naming the versions that are supported.
      schema:
        type: string
        example: "2026-07-28"

    McpMethod:
      name: Mcp-Method
      in: header
      required: true
      description: >-
        The body's `method`, mirrored. Validated rather than trusted:
        an intermediary routing on the header while the body asks for
        something else is the failure this rule exists for.


        The value may be Base64-sentinel encoded as `=?base64?...?=`,
        and is decoded before it is compared. A server that compared
        the raw header instead would accept any mismatch wearing a
        sentinel, which makes the check optional for anyone who read
        the specification.
      schema:
        type: string
        example: tools/call

    McpName:
      name: Mcp-Name
      in: header
      required: false
      description: >-
        The body's `params.name`, mirrored. Required on a `tools/call`
        and refused on anything else, since nothing else has a
        counterpart for it to equal. Same Base64 sentinel and same
        decode-before-compare rule as `Mcp-Method`.


        It is also what the audit row records as the tool the caller
        said this request was for, inside the `asserted[...]` clause.
      schema:
        type: string
        example: lorica_logs

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <credential>`, where the credential is
        either a static token, `<public_id>.<secret>` (Story 10.3), or
        a GitLab ID token, the JWT a job receives through `id_tokens:`
        (Story 10.5). The listener picks the mode by the shape of the
        value and nothing else; every refusal on either path answers the
        same 401 body, so a caller cannot learn which mode was tried.
        The precise reason is in the audit row, which an operator can
        read.


        An ID token is accepted when a SuperAdmin has registered an
        issuer entry on the management API
        (`POST /api/v1/automation/oidc-issuers`) whose `audience` the job
        named in `id_tokens.<NAME>.aud` and whose `bound_claims` all hold.
        It is verified RS256-only against the issuer's published keys,
        with `iss`, `aud`, `exp`, `nbf` and `iat` checked, and its `jti`
        is remembered until `exp` so it cannot be presented twice.


        A static token is created on the MANAGEMENT api, with
        `POST /api/v1/automation/tokens`, never through this listener.
        The secret half is shown once, at creation, and is not
        recoverable afterwards: the store keeps only its HMAC, so a lost
        token is re-minted, not read back.


        Store it in a GitLab CI/CD variable marked both masked and
        protected, and read it from the environment in the job. Never
        pass it in argv: a command line is visible to every process on
        the host, is echoed into job logs by any shell tracing, and ends
        up in the runner's shell history. `curl -H "Authorization:
        Bearer $LORICA_AUTOMATION_TOKEN"` is argv too; prefer
        `curl -H @<file>` or a client that reads the variable itself.


        Revocation is immediate and needs no invalidation step: nothing
        about a token is cached, so a revoked or expired token fails on
        its very next request.

  schemas:
    WhoAmI:
      type: object
      description: The verified credential behind the request, as the node holds it.
      required: [name, public_id, kind, scopes]
      properties:
        name:
          type: string
          description: >-
            The token's operator-facing label, or the ID token's
            `project_path`.
          example: gitlab-staging-deploy
        public_id:
          type: string
          description: >-
            The id an operator withdraws: the token's lookup half, or the
            issuer entry's id for an ID token. The only identifier that
            appears in server-side logs.
          example: 4f9a1c7e2b6d8051
        kind:
          type: string
          enum: [static_token, oidc_project]
          description: Which credential authenticated the request.
        scopes:
          type: array
          description: Everything this credential may do.
          items:
            $ref: "#/components/schemas/AutomationScope"
          example: ["environments:read", "routes:read"]
        pipeline:
          $ref: "#/components/schemas/PipelineIdentity"

    PipelineIdentity:
      type: object
      description: >-
        The CI job behind a GitLab ID token, as the issuer signed it
        (Story 10.5). Absent on a static token.
      required: [project_path]
      properties:
        project_path:
          type: string
          example: acme/web
        ref:
          type: string
          nullable: true
        pipeline_id:
          type: string
          nullable: true
        job_id:
          type: string
          nullable: true
        user_login:
          type: string
          nullable: true
          example: user01

    AutomationScope:
      type: string
      description: One grant on the automation plane.
      enum:
        - environments:write
        - environments:read
        - routes:read
        - certificates:read
        - logs:read
        - waf:read
        - sla:read
        - cluster:read
        - backends:read

    EnvironmentRequest:
      type: object
      description: >-
        What a pipeline declares. Unknown fields are refused (422), so
        a field from a later version is noticed on the first call.
      required: [hostname, backends, certificate, ttl_seconds]
      additionalProperties: false
      properties:
        hostname:
          type: string
          description: The exact hostname; no wildcard, no address literal, not `localhost`.
          example: pr-42.review.example.com
        backends:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/EnvironmentBackendRequest"
        certificate:
          type: string
          description: >-
            `auto` binds the certificate covering the hostname (exact
            name over wildcard, then latest `not_after`), re-resolved at
            every snapshot build. Anything else is an explicit
            certificate id and needs `certificates:read`.
          example: auto
        waf_enabled:
          type: boolean
          default: false
        force_https:
          type: boolean
          default: false
        path_prefix:
          type: string
          default: "/"
        ttl_seconds:
          type: integer
          minimum: 1
          description: The lifetime, at or under the token's `max_ttl_seconds`; recomputed from now on every `PUT`.
          example: 7200
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            At most 16 entries of at most 128 bytes each side.
            `shared: "true"` opens the environment to every principal,
            and only its owner may rewrite it.
          example: { team: acme, shared: "true" }

    EnvironmentBackendRequest:
      type: object
      required: [address]
      additionalProperties: false
      properties:
        address:
          type: string
          description: "`ip:port`. A name is refused: it cannot be checked against `allowed_backend_cidrs`."
          example: "10.0.12.34:8080"
        tls_upstream:
          type: boolean
          default: false
        tls_sni:
          type: string
          nullable: true
          description: The SNI presented to a TLS upstream; an RFC 1123 DNS name, no wildcard and no address literal.
        weight:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1

    EnvironmentWriteResponse:
      type: object
      required: [name, url, route_id, backend_ids, certificate_id, certificate_not_after, expires_at, applied_generation]
      properties:
        name:
          type: string
        url:
          type: string
          description: "`https://<hostname><path_prefix>`."
          example: https://pr-42.review.example.com/
        route_id:
          type: string
          description: The route the environment owns; stable across updates.
        backend_ids:
          type: array
          items:
            type: string
        certificate_id:
          type: string
        certificate_not_after:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        applied_generation:
          type: integer
          format: int64
          description: >-
            The fleet configuration generation the control plane had
            published when the response was built; 0 on a standalone
            node. The write starts a replication round that publishes
            the next generation, so a strict pipeline polls
            `GET /api/v1/cluster/status` until `applied_config_generation`
            exceeds this value. Never the hash: two converged nodes
            legitimately report different hashes.

    EnvironmentView:
      type: object
      required: [name, hostname, path_prefix, url, route_id, backend_ids, certificate_mode, labels, owner, expires_at, created_at, updated_at]
      properties:
        name:
          type: string
        hostname:
          type: string
        path_prefix:
          type: string
        url:
          type: string
        route_id:
          type: string
        backend_ids:
          type: array
          items:
            type: string
        certificate_id:
          type: string
          nullable: true
          description: The certificate currently bound to the route.
        certificate_mode:
          type: object
          description: "`{mode: auto}` or `{mode: explicit, certificate_id: ...}`."
          properties:
            mode:
              type: string
              enum: [auto, explicit]
            certificate_id:
              type: string
        labels:
          type: object
          additionalProperties:
            type: string
        owner:
          type: object
          required: [kind, principal]
          properties:
            kind:
              type: string
              enum: [static_token, oidc_project]
            principal:
              type: string
              description: The token name for a static token.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: The source of the `ETag`.
        last_pipeline:
          type: string
          nullable: true
        pipeline:
          $ref: "#/components/schemas/PipelineIdentity"

    PagedAnswer:
      type: object
      description: >-
        One window over a collection. The items are the management
        API's own records, serialised by the management API's own view
        builder and passed through untouched, which is what keeps the
        two surfaces from describing one record two ways. Their fields
        are therefore documented in `openapi.yaml`, against the
        management path each read wraps, rather than restated here
        where a second copy would drift.
      required: [data]
      properties:
        data:
          type: object
          required: [items, page]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
            page:
              $ref: "#/components/schemas/PageInfo"

    PageInfo:
      type: object
      description: >-
        What this answer's window was. No total: the sources behind
        this surface count differently (the log store counts every
        match, the WAF buffer counts what it returned, a store listing
        counts rows), and one field meaning three things is worse than
        no field. Every source is asked for one row past the window, and
        a window the source cannot fill is refused rather than answered
        short, so `has_more` is exact on every window this surface
        answers at all.
      required: [limit, offset, returned, has_more]
      properties:
        limit:
          type: integer
          description: The window size after the server-side ceiling.
          example: 50
        offset:
          type: integer
          example: 0
        returned:
          type: integer
          description: >-
            How many items this answer carries, and what a pager
            advances `offset` by. Short of `limit` with `has_more` true
            means the answer stopped on the byte ceiling: rows are
            dropped whole rather than truncated, because a field that
            arrives mangled is worse than a page that arrives short.
          example: 50
        has_more:
          type: boolean
          description: Whether a row exists past this window.

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    JsonRpcMessage:
      type: object
      description: >-
        One JSON-RPC 2.0 request or notification. A message with no `id`
        is a notification and is answered by a `202` with no body.
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: >-
            The correlation id. A string or a number; absent makes this
            a notification.
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          enum:
            - server/discover
            - tools/list
            - tools/call
            - notifications/cancelled
        params:
          type: object
          description: >-
            Per-method parameters. `tools/call` takes `name` and
            `arguments`. Every method may carry `_meta`, which is where
            this revision puts the protocol version, the client info and
            the client capabilities.

    JsonRpcAnswer:
      type: object
      description: >-
        One JSON-RPC 2.0 response. Carries `result` or `error` and never
        both.


        A tool that ran and failed is NOT an `error` here: it is a
        `result` carrying `isError: true`, which is the channel a model
        reads and corrects. An authorization refusal from a read behind
        this endpoint is on that channel deliberately, so the model sees
        the refusal and stops rather than rewording the call. The
        `error` channel is for a call that never ran: an unknown tool, a
        malformed request, arguments outside the declared schema.


        A tool result's rows arrive inside a delimited block whose tool
        description states, in terms, that the delimited content is data
        and not instructions.
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result:
          type: object
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object

  responses:
    BeyondTheWindow:
      description: >-
        Either the `offset` is past the depth this read can reach (see
        the `offset` parameter), or a free-text filter is longer than
        this surface accepts: `?search=` becomes five unanchored `LIKE`
        predicates plus a `COUNT(*)` over the whole retained log, so its
        length is a per-request cost the caller would otherwise choose.
        The message names the limit and never reflects the caller's own
        text back.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: >-
        No environment of this caller's has this name. An environment
        another principal owns and did not label `shared: "true"`
        answers exactly this, body included: a 403 would confirm the
        name is taken, which is the one fact a neighbour on a shared
        node must not be able to enumerate. The refusal reason is in
        the audit row.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: >-
        The hostname is held by another route. The message names the
        hostname and nothing about the route holding it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: conflict
              message: "conflict: hostname `pr-42.review.example.com` is already used by another route"
    PreconditionFailed:
      description: "`If-Match` named a version the environment is no longer at, or the environment does not exist."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: precondition_failed
              message: "If-Match does not match the current ETag \"2026-09-16T10:00:00+00:00\""
    Unprocessable:
      description: >-
        The body parsed and a rule refuses it: an unknown field, a
        malformed value, a cap over its limit (backends per
        environment, environments per principal, backend weight), or
        no certificate covering the hostname, whether resolved or
        named by id (message prefixed
        `no_certificate_covers_hostname`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unprocessable_entity
              message: "unprocessable: no_certificate_covers_hostname: no certificate covers `pr-42.review.example.com`; provision *.review.example.com through POST /api/v1/acme/provision-dns (DNS-01), or name an explicit certificate id"
    Unauthorized:
      description: >-
        The credential was not accepted. Missing, malformed, unknown,
        wrong secret, revoked and expired all answer alike, with the
        same body and the same
        `WWW-Authenticate: Bearer realm="lorica-automation"` challenge:
        telling a caller that their token is known but revoked would
        confirm the id for them. An operator distinguishes the cases in
        the audit log, which they can read and a caller cannot.


        Retrying with the same token will not help. Present a different
        one.
      headers:
        WWW-Authenticate:
          description: The bearer challenge naming the automation realm.
          schema:
            type: string
            example: Bearer realm="lorica-automation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthorized
              message: a valid automation bearer token is required
    Forbidden:
      description: >-
        The credential WAS accepted and the grant is not there: the
        token does not carry the scope this path requires, its
        `allowed_hostnames` or `allowed_backend_cidrs` do not cover
        what the body asks for, or the issuer entry binds the caller to
        one environment name. The distinction from a 401 is the
        whole point of answering two codes: a 401 says re-present a
        credential, a 403 says the credential is real and the grant is
        missing, which is the one sentence that leads to the right fix.
        An automation that retries a 403, or an operator who re-mints a
        token that was never the problem, has read the wrong code.


        The message names the missing scope. That is not a disclosure:
        the caller holds the token and can read its own scopes from
        `whoami`; what they cannot do is guess which scope this path
        wanted.


        The same code answers a path that declares no scope at all, for
        every token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: forbidden
              message: this token does not carry the environments:read scope

    McpBadRequest:
      description: >-
        The transport refused the POST before the protocol core saw it.


        Code `-32020` `HeaderMismatch` for a mirrored header that does
        not equal its body counterpart, a required one missing, or a
        value carrying characters that cannot be read as text and
        therefore cannot be compared. A different code, with
        `error.data.name` set to `UnsupportedProtocolVersionError` and
        `error.data.supportedVersions` listing what this server speaks,
        for a revision it does not implement. `-32700` for a body that
        is not JSON and `-32600` for JSON that is not a JSON-RPC
        message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonRpcAnswer"
          example:
            jsonrpc: "2.0"
            id: 4
            error:
              code: -32020
              message: "`mcp-name` does not equal the body's `params.name`"

    McpOriginRefused:
      description: >-
        An `Origin` header was present. This endpoint serves no browser
        origin, so every one is refused: the specification's one MUST on
        this transport is against DNS rebinding, and a present `Origin`
        on a machine-facing API behind a bearer token means a page is
        driving it.


        The body carries no `id`: the request was not read far enough to
        have one, and inventing one would answer a correlation nobody
        made.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonRpcAnswer"

    McpMethodNotFound:
      description: >-
        The method is not one this server implements. A `404` and not a
        `-32601` inside a `200`, which is unusual for a JSON-RPC server
        and is how a client tells a server on revision 2026-07-28 from
        one on the era the method belonged to: `initialize` answers this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonRpcAnswer"
          example:
            jsonrpc: "2.0"
            id: 1
            error:
              code: -32601
              message: >-
                this server implements server/discover, tools/list and
                tools/call, and accepts notifications/cancelled
