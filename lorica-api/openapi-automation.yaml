  /automation/v1/routes/{id}:
    put:
      tags: [Writes]
      summary: Update one route
      description: >-
        `PUT /api/v1/routes/{id}` on the management API, run as the
        token: a patch of the fields sent and nothing else, with a
        `route.update` audit row naming the token. A route an
        environment owns answers 409 naming the environment, exactly as
        there. The route named, on its current hostname and aliases, and
