  /automation/v1/certificates/{id}/renew:
    post:
      tags: [Writes]
      summary: Renew one ACME certificate
      description: >-
        `POST /api/v1/certificates/{id}/renew` on the management API,
        run as the token: an ACME order for a row the node already
        holds, renewed in place under the same id so every route bound
        to it keeps serving, with a `certificate.renew` audit row naming
        the token. A certificate that was uploaded rather than issued
        answers 400 exactly as there, because there is nothing to renew
        it against, and no path on this listener takes the replacement.


        No body. Nothing about the certificate is an argument, its key
        least of all.


        A token renews one certificate at a time and not twice in a
        row: 409 while an order for this certificate is open, on any
        path; 429 with a `Retry-After` when the certificate was issued
        less than 48 hours ago, read off its own `not_before`; 429 while
        the background renewal loop holds it in a CA rate-limit
        cooldown. Each order spends the CA's per-name budget and rotates
        the node's bot-protection HMAC, and the per-token call budget
        counts calls, not orders. An operator's session on the
        management path is bounded by none of it.


        With `?dry_run=true`, which needs `certificates:read` (403), the
        metadata of the certificate that would be renewed, after the
        ACME-only refusal and the budget, and no order made: see
        `DryRun`.


        Required scope: `certificates:write`.
      operationId: automationRenewCertificate
      x-required-scope: certificates:write
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: Renewed in place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementAnswer"
        "400":
          $ref: "#/components/responses/ManagementRefusal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ManagementRefusal"
        "409":
          description: A renewal of this certificate is in flight, on this path, the management path or the background loop. One order per certificate at a time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The certificate was issued less than 48 hours ago, or the CA's rate limit refused an order for it and the cooldown has not ended, or this credential has spent its write window (see `WriteBudget`). `Retry-After` carries the seconds to wait; the message says which of the three it is, and names the certificate for the first two.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until a renewal of this certificate is accepted again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The ACME order failed; the message says why, and the stored certificate is untouched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /automation/v1/settings:
    put:
      tags: [Admin]
      summary: Change operational settings
      description: >-
        `PUT /api/v1/settings` on the management API, run as the token
        and bounded by the admin tier's allowlist: a key outside
        `SettingsPatch` is refused (403) with the key named, before any
        value is read or validated, and a value outside the bound
        `SettingsPatch` publishes for its key, or lowering a retention
        below its stored value, is refused (422) with the key and the
        bound named. The keys it accepts then go through the dashboard's
        own validators, trigger the same reload, and land a
        `settings.update` audit row naming the token whose target lists
        each key the write changed as `key:old->new`. A write that
        changes no stored value writes nothing, reloads nothing and
        lands no row.


        The answer is the allowlisted part of the settings document
        after the write, and nothing else of it: the scope that writes
        these keys reads back these keys. There is no `GET` on this
        path; the settings document is not readable on this plane.


        With `?dry_run=true`, the same part before and after the patch,
        and nothing written. The dry run needs no scope beside
        `settings:write`, because it shows only what that scope may
        write: see `DryRun`.


        Required scope: `settings:write`.
      operationId: automationUpdateSettings
      x-required-scope: settings:write
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated; the allowlisted settings as they now stand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementAnswer"
        "400":
          $ref: "#/components/responses/ManagementRefusal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            A value outside the bound `SettingsPatch` publishes for its
            key, a retention lowered below its stored value, or a value
            of the wrong type. The message names the key and, for a
            bound, the bound. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/WriteBudget"

  /automation/v1/mcp:
    post:
      tags: [MCP]
      summary: One Model Context Protocol message
      description: >-
        The Streamable HTTP binding of the Lorica MCP read tier, as one
        path on this listener rather than a port of its own: an operator
        who has not enabled the automation listener gains no MCP
        surface.


        This implements MCP revision **2026-07-28** and no other era.
        There is no `initialize` handshake in that revision: every
        request carries its own metadata under `params._meta`, and the
        discovery call that replaced the handshake is `server/discover`.
        The methods answered are `server/discover`, `tools/list` and
        `tools/call`, plus the notification `notifications/cancelled`.
        Anything else is a `404`, which is unusual for a JSON-RPC server
        and deliberate: it is how a client tells a server on this
        revision from one on the era its method belonged to.


        Required scope: none at the path. That is not a wider grant, it
        is the statement that this path's gate is elsewhere: an MCP
        request names its own tool and each tool has its own scope, so
        the endpoint is reached by any live token and every `tools/call`
        is authorized against the presented token's scopes. A tool the
        token cannot reach is absent from that request's `tools/list`
        and unknown to its `tools/call`, which the specification permits
        explicitly, since credentials are per-request input and not
        connection state.


        One process serves one MCP tier, and this path builds one
        server per request: a token whose scopes span two tiers (a read
        scope the config tier does not tolerate beside a config write,
        for instance) is refused with a `403` naming the offending
        scopes, before any tool is listed or called. The stdio binary
        refuses the same token at startup, through the same check.


        Every POST carries `MCP-Protocol-Version`, `Mcp-Method` mirrored
        from the body's `method`, and, on a `tools/call`, `Mcp-Name`
        mirrored from `params.name`. Each is VALIDATED against the body
        rather than trusted, because Lorica is exactly the kind of
        intermediary that rule exists to protect. A header value may
        arrive Base64-sentinel encoded as `=?base64?...?=` and is
        decoded before it is compared.


        The `Origin` header is refused whatever it names. The
        specification's one MUST on this transport is against DNS
        rebinding, and the usual same-host check is what rebinding
        defeats; this plane serves no browser, so a present `Origin`
        means a page is driving the endpoint.


        Revision 2026-07-28 removed protocol-level sessions, the
        standalone `GET` stream and `Last-Event-ID` resumability. `GET`
        and `DELETE` on this path answer `405`. An `Mcp-Session-Id` is
        ignored and never echoed, and a `Last-Event-ID` is ignored.
      operationId: automationMcp
      x-required-scope: any-live-token
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/McpProtocolVersion"
        - $ref: "#/components/parameters/McpMethod"
        - $ref: "#/components/parameters/McpName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcMessage"
      responses:
        "200":
          description: >-
            One JSON-RPC response object. The revision also permits an
            SSE stream here; this binding answers in one object, because
            every method it implements answers in one message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcAnswer"
        "202":
          description: >-
            The message was a notification and there is nothing to
            answer. No body. This revision defines no client-to-server
            notification over HTTP, so this is transport mechanics
            rather than a path with a purpose.
        "400":
          $ref: "#/components/responses/McpBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/McpForbidden"
        "404":
          $ref: "#/components/responses/McpMethodNotFound"

components:
  parameters:
    EnvironmentName:
      name: name
      in: path
      required: true
      description: >-
        The environment name: an RFC 1123 label, 1 to 63 characters of
        lowercase ASCII letters, digits and hyphens, neither starting
        nor ending with a hyphen. It becomes the `group_name`
        (`automation:<name>`) of the route and the backends.
      schema:
        type: string
        example: pr-42

    ResourceId:
      name: id
      in: path
      required: true
      description: The resource id, as the matching listing reports it.
      schema:
        type: string

    PageLimit:
      name: limit
      in: query
      required: false
      description: >-
        Rows wanted. Clamped to 200 server-side, and there is no
        parameter that raises that: the ceiling exists so a caller
        asking for everything cannot pull a table into a context
        window. Absent means 50; 0 means 1.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    PageOffset:
      name: offset
      in: query
      required: false
      description: >-
        Rows to skip before the window starts. Advance it by the
        answer's `returned`, never by `limit`: the two differ when the
        byte ceiling ended an answer early, and advancing by `limit`
        would step over the rows that did not fit.


        On a listing the node holds in full (routes, backends,
        certificates, SLA) an offset past the end is an empty window and
        not an error, because the listing really held nothing there. On
        the two reads whose source clamps its own row budget (`/logs` at
        10000 rows, `/waf/events` at 500) an offset that clamp cannot
        honour is a `400` naming the deepest window this limit can
        reach. It is not an empty page: past the clamp the answer would
        read `{"items": [], "has_more": false}` while the table still
        held thousands of rows, and that is the one failure a pager
        reports as "there was nothing". Narrow such a read with its
        filters rather than paging past the clamp.
      schema:
        type: integer
        minimum: 0
        default: 0

    DryRun:
      name: dry_run
      in: query
      required: false
      description: >-
        `true` runs the write's own validators, computes the change it
        would make against the configuration as it stands, and writes
        nothing: no row, no reload signal, no management audit row. The
        request row is written as for any request, with `?dry_run`
        beside the verb. The answer is `200` with
        `{"data": {"dry_run": true, "operation": "create" | "update" |
        "delete" | "renew", "before": <view or null>, "after": <view or
        null>, "changes": {<field>: {"from", "to"}} or null}}`: a
        create's `after` is the row it would insert, less the id and the
        clock the apply would mint; an update's `before` and `after` are
        the views either side of the patch, with `changes` naming the
        fields that differ; a delete's and a renewal's `before` is the
        row that would go or be renewed. What only the store refuses (a
        duplicate hostname, a backend id that names nothing) is refused
        by the apply and not by the dry run. The token's grants are
        checked first either way (403), so a dry run never shows a change
        the apply would refuse on the grant. A dry run answers the full
        row it would change, so it needs the read scope of that row
        beside the write scope: `routes:read` for a route or a
        certificate binding, `backends:read` for a backend,
        `certificates:read` for a renewal (403 naming the scope). The
        settings write is the exception, and it is one by construction:
        its dry run answers only the allowlisted settings that
        `settings:write` itself writes, so it needs no scope beside it.


        The query is strict: a key that is not `dry_run` is a 400, so
        `?dryrun=true` or `?dry-run=true` typed by hand is refused rather
        than applied. `dry_run` itself takes `true` or `false` and
        nothing else.


        This is the preview the MCP config tier's `*_preview` tools call
        (Story 11.2 AC #3). It is an affordance and not a control: the
        protocol offers no way to make a client call it first.
      schema:
        type: boolean
        default: false

    McpProtocolVersion:
      name: MCP-Protocol-Version
      in: header
      required: true
      description: >-
        The MCP revision this request is written against. Required on
        every POST to the MCP endpoint. It must equal the
        `io.modelcontextprotocol/protocolVersion` field under the body's
        `_meta` when the body names one, and it must be a revision this
        server implements: a mismatch is `-32020`, an unimplemented
        revision is a `400` naming the versions that are supported.
      schema:
        type: string
        example: "2026-07-28"

    McpMethod:
      name: Mcp-Method
      in: header
      required: true
      description: >-
        The body's `method`, mirrored. Validated rather than trusted:
        an intermediary routing on the header while the body asks for
        something else is the failure this rule exists for.


        The value may be Base64-sentinel encoded as `=?base64?...?=`,
        and is decoded before it is compared. A server that compared
        the raw header instead would accept any mismatch wearing a
        sentinel, which makes the check optional for anyone who read
        the specification.
      schema:
        type: string
        example: tools/call

    McpName:
      name: Mcp-Name
      in: header
      required: false
      description: >-
        The body's `params.name`, mirrored. Required on a `tools/call`
        and refused on anything else, since nothing else has a
        counterpart for it to equal. Same Base64 sentinel and same
        decode-before-compare rule as `Mcp-Method`.


        It is also what the audit row records as the tool the caller
        said this request was for, inside the `asserted[...]` clause.
      schema:
        type: string
        example: lorica_logs

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <credential>`, where the credential is
        either a static token, `<public_id>.<secret>` (Story 10.3), or
        a GitLab ID token, the JWT a job receives through `id_tokens:`
        (Story 10.5). The listener picks the mode by the shape of the
        value and nothing else; every refusal on either path answers the
        same 401 body, so a caller cannot learn which mode was tried.
        The precise reason is in the audit row, which an operator can
        read.


        An ID token is accepted when a SuperAdmin has registered an
        issuer entry on the management API
        (`POST /api/v1/automation/oidc-issuers`) whose `audience` the job
        named in `id_tokens.<NAME>.aud` and whose `bound_claims` all hold.
        It is verified RS256-only against the issuer's published keys,
        with `iss`, `aud`, `exp`, `nbf` and `iat` checked, and its `jti`
        is remembered until `exp` so it cannot be presented twice.


        A static token is created on the MANAGEMENT api, with
        `POST /api/v1/automation/tokens`, never through this listener.
        The secret half is shown once, at creation, and is not
        recoverable afterwards: the store keeps only its HMAC, so a lost
        token is re-minted, not read back.


        Store it in a GitLab CI/CD variable marked both masked and
        protected, and read it from the environment in the job. Never
        pass it in argv: a command line is visible to every process on
        the host, is echoed into job logs by any shell tracing, and ends
        up in the runner's shell history. `curl -H "Authorization:
        Bearer $LORICA_AUTOMATION_TOKEN"` is argv too; prefer
        `curl -H @<file>` or a client that reads the variable itself.


        Revocation is immediate and needs no invalidation step: nothing
        about a token is cached, so a revoked or expired token fails on
        its very next request.

  schemas:
    WhoAmI:
      type: object
      description: The verified credential behind the request, as the node holds it.
      required: [name, public_id, kind, scopes]
      properties:
        name:
          type: string
          description: >-
            The token's operator-facing label, or the ID token's
            `project_path`.
          example: gitlab-staging-deploy
        public_id:
          type: string
          description: >-
            The id an operator withdraws: the token's lookup half, or the
            issuer entry's id for an ID token. The only identifier that
            appears in server-side logs.
          example: 4f9a1c7e2b6d8051
        kind:
          type: string
          enum: [static_token, oidc_project]
          description: Which credential authenticated the request.
        scopes:
          type: array
          description: Everything this credential may do.
          items:
            $ref: "#/components/schemas/AutomationScope"
          example: ["environments:read", "routes:read"]
        pipeline:
          $ref: "#/components/schemas/PipelineIdentity"

    PipelineIdentity:
      type: object
      description: >-
        The CI job behind a GitLab ID token, as the issuer signed it
        (Story 10.5). Absent on a static token.
      required: [project_path]
      properties:
        project_path:
          type: string
          example: acme/web
        ref:
          type: string
          nullable: true
        pipeline_id:
          type: string
          nullable: true
        job_id:
          type: string
          nullable: true
        user_login:
          type: string
          nullable: true
          example: user01

    AutomationScope:
      type: string
      description: >-
        One grant on the automation plane. The three write grants after
        `backends:read` arrived with the MCP config tier (Story 11.2)
        and reach the write surface above; `settings:write` arrived with
        the admin tier (Story 11.3) and reaches the allowlisted settings
        and nothing else; the environment grants reach the environment
        resource and nothing else.
      enum:
        - environments:write
        - environments:read
        - routes:read
        - certificates:read
        - logs:read
        - waf:read
        - sla:read
        - cluster:read
        - backends:read
        - routes:write
        - backends:write
        - certificates:write
        - settings:write

    ManagementRouteCreate:
      type: object
      description: >-
        The body `POST /api/v1/routes` accepts on the management API,
        unchanged: `CreateRouteRequest` in `openapi.yaml`. It is not
        restated here, where a second copy would drift; the field names
        this path accepts are pinned in Rust against the struct the
        handler deserialises by `tests/openapi_contract.rs`, so a field
        the management model grows reaches this plane by a decision and
        not by default. `managed_by` is refused (422) as it is there.
      additionalProperties: true

    ManagementRouteUpdate:
      type: object
      description: >-
        The body `PUT /api/v1/routes/{id}` accepts on the management
        API, unchanged: `UpdateRouteRequest` in `openapi.yaml`. Every
        field optional; a field absent leaves the route's value alone.
        Pinned the same way as `ManagementRouteCreate`.
      additionalProperties: true

    ManagementBackendCreate:
      type: object
      description: >-
        The body `POST /api/v1/backends` accepts on the management API,
        unchanged: `CreateBackendRequest` in `openapi.yaml`, pinned the
        same way as `ManagementRouteCreate`. On this plane `address`
        must be an `ip:port` inside the token's `allowed_backend_cidrs`.
      additionalProperties: true

    ManagementBackendUpdate:
      type: object
      description: >-
        The body `PUT /api/v1/backends/{id}` accepts on the management
        API, unchanged: `UpdateBackendRequest` in `openapi.yaml`, pinned
        the same way as `ManagementRouteCreate`.
      additionalProperties: true

    BindCertificateRequest:
      type: object
      description: >-
        The one field a certificate binding takes. Unknown fields are
        refused (422): there is no field here that could carry a
        certificate body or a key, and one that arrives is an error
        rather than something ignored.
      required: [certificate_id]
      additionalProperties: false
      properties:
        certificate_id:
          type: string
          description: >-
            A stored certificate's id, as `GET /automation/v1/certificates`
            reports it. The empty string unbinds.
          example: 6f1c2b7e-3a44-4d0e-9a2b-1f5c8d7e9a01

    SettingsPatch:
      type: object
      description: >-
        The global settings the admin tier may change, and no other,
        each within the bound its `minimum` and `maximum` publish; the
        three retentions may also only be raised from their stored
        value. Each field means what it means on `PUT /api/v1/settings`
        in `openapi.yaml`, is optional, and is validated by the same
        function after the tier's bound; a field absent leaves the
        stored value alone. A key not listed here is refused (403) with
        the key named, before any value is read: the list is
        `SETTINGS_ALLOWLIST` in `lorica-automation-policy/src/settings.rs`,
        where each entry carries the reason it is in and its bound, and
        `tests/openapi_contract.rs` pins this schema, bounds included,
        against it.
      additionalProperties: false
      properties:
        access_log_retention:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          description: Raise-only. 0 (unlimited) is refused, and so is anything above ten times the shipped default.
        waf_event_retention:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          description: Raise-only. 0 (unlimited) is refused, and so is anything above ten times the shipped default.
        sla_purge_retention_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Raise-only.
        cert_warning_days:
          type: integer
          minimum: 14
          maximum: 365
        cert_critical_days:
          type: integer
          minimum: 3
          maximum: 365
          description: Below `cert_warning_days`, as on the dashboard.
        waf_ban_threshold:
          type: integer
          minimum: 3
          maximum: 100
        waf_ban_duration_s:
          type: integer
          minimum: 60
          maximum: 86400
        default_health_check_interval_s:
          type: integer
          minimum: 5
          maximum: 60
        health_max_concurrent_probes:
          type: integer
          minimum: 16
          maximum: 512

    ManagementAnswer:
      type: object
      description: >-
        The object the wrapped management path answers, passed through
        untouched under `data`: a route as `RouteResponse`, a backend as
        `BackendResponse`, or the renewal's `{renewed, old_cert_id,
        new_cert_id, domain}`, each documented in `openapi.yaml` against
        the management path rather than restated here. None of them
        carries key material or a credential; the route view withholds
        the Basic-auth hash there and therefore here.
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true

    EnvironmentRequest:
      type: object
      description: >-
        What a pipeline declares. Unknown fields are refused (422), so
        a field from a later version is noticed on the first call.
      required: [hostname, backends, certificate, ttl_seconds]
      additionalProperties: false
      properties:
        hostname:
          type: string
          description: The exact hostname; no wildcard, no address literal, not `localhost`.
          example: pr-42.review.example.com
        backends:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/EnvironmentBackendRequest"
        certificate:
          type: string
          description: >-
            `auto` binds the certificate covering the hostname (exact
            name over wildcard, then latest `not_after`), re-resolved at
            every snapshot build. Anything else is an explicit
            certificate id and needs `certificates:read`.
          example: auto
        waf_enabled:
          type: boolean
          default: false
        force_https:
          type: boolean
          default: false
        path_prefix:
          type: string
          default: "/"
        ttl_seconds:
          type: integer
          minimum: 1
          description: The lifetime, at or under the token's `max_ttl_seconds`; recomputed from now on every `PUT`.
          example: 7200
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            At most 16 entries of at most 128 bytes each side.
            `shared: "true"` opens the environment to every principal,
            and only its owner may rewrite it.
          example: { team: acme, shared: "true" }

    EnvironmentBackendRequest:
      type: object
      required: [address]
      additionalProperties: false
      properties:
        address:
          type: string
          description: "`ip:port`. A name is refused: it cannot be checked against `allowed_backend_cidrs`."
          example: "10.0.12.34:8080"
        tls_upstream:
          type: boolean
          default: false
        tls_sni:
          type: string
          nullable: true
          description: The SNI presented to a TLS upstream; an RFC 1123 DNS name, no wildcard and no address literal.
        weight:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1

    EnvironmentWriteResponse:
      type: object
      required: [name, url, route_id, backend_ids, certificate_id, certificate_not_after, expires_at, protections_inherited_from, applied_generation]
      properties:
        name:
          type: string
        url:
          type: string
          description: "`https://<hostname><path_prefix>`."
          example: https://pr-42.review.example.com/
        route_id:
          type: string
          description: The route the environment owns; stable across updates.
        backend_ids:
          type: array
          items:
            type: string
        certificate_id:
          type: string
        certificate_not_after:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        protections_inherited_from:
          type: array
          items:
            type: string
          description: >-
            The ids of the routes that served this hostname before the
            environment took it (a wildcard or the catch-all) whose
            protections the environment's route inherited, because its
            own profile was weaker on at least one of them. Empty when
            it displaced no protected route. The inherited values are
            not answered.
        applied_generation:
          type: integer
          format: int64
          description: >-
            The fleet configuration generation the control plane had
            published when the response was built; 0 on a standalone
            node. The write starts a replication round that publishes
            the next generation, so a strict pipeline polls
            `GET /api/v1/cluster/status` until `applied_config_generation`
            exceeds this value. Never the hash: two converged nodes
            legitimately report different hashes.

    EnvironmentView:
      type: object
      required: [name, hostname, path_prefix, url, route_id, backend_ids, certificate_mode, labels, owner, expires_at, created_at, updated_at]
      properties:
        name:
          type: string
        hostname:
          type: string
        path_prefix:
          type: string
        url:
          type: string
        route_id:
          type: string
        backend_ids:
          type: array
          items:
            type: string
        certificate_id:
          type: string
          nullable: true
          description: The certificate currently bound to the route.
        certificate_mode:
          type: object
          description: "`{mode: auto}` or `{mode: explicit, certificate_id: ...}`."
          properties:
            mode:
              type: string
              enum: [auto, explicit]
            certificate_id:
              type: string
        labels:
          type: object
          additionalProperties:
            type: string
        owner:
          type: object
          required: [kind, principal]
          properties:
            kind:
              type: string
              enum: [static_token, oidc_project]
            principal:
              type: string
              description: The token name for a static token.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: The source of the `ETag`.
        last_pipeline:
          type: string
          nullable: true
        pipeline:
          $ref: "#/components/schemas/PipelineIdentity"

    PagedAnswer:
      type: object
      description: >-
        One window over a collection. The items are the management
        API's own records, serialised by the management API's own view
        builder and passed through untouched, which is what keeps the
        two surfaces from describing one record two ways. Their fields
        are therefore documented in `openapi.yaml`, against the
        management path each read wraps, rather than restated here
        where a second copy would drift.
      required: [data]
      properties:
        data:
          type: object
          required: [items, page]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
            page:
              $ref: "#/components/schemas/PageInfo"

    PageInfo:
      type: object
      description: >-
        What this answer's window was. No total: the sources behind
        this surface count differently (the log store counts every
        match, the WAF buffer counts what it returned, a store listing
        counts rows), and one field meaning three things is worse than
        no field. Every source is asked for one row past the window, and
        a window the source cannot fill is refused rather than answered
        short, so `has_more` is exact on every window this surface
        answers at all.
      required: [limit, offset, returned, has_more]
      properties:
        limit:
          type: integer
          description: The window size after the server-side ceiling.
          example: 50
        offset:
          type: integer
          example: 0
        returned:
          type: integer
          description: >-
            How many items this answer carries, and what a pager
            advances `offset` by. Short of `limit` with `has_more` true
            means the answer stopped on the byte ceiling: rows are
            dropped whole rather than truncated, because a field that
            arrives mangled is worse than a page that arrives short.
          example: 50
        has_more:
          type: boolean
          description: Whether a row exists past this window.
        next_cursor:
          type: integer
          format: int64
          nullable: true
          description: >-
            On `/logs` alone, and always there: what to send as
            `before_id` for the next window, the id of the last row this
            answer returned, or null when `has_more` is false. Absent on
            every other read.

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    JsonRpcMessage:
      type: object
      description: >-
        One JSON-RPC 2.0 request or notification. A message with no `id`
        is a notification and is answered by a `202` with no body.
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: >-
            The correlation id. A string or a number; absent makes this
            a notification.
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          enum:
            - server/discover
            - tools/list
            - tools/call
            - notifications/cancelled
        params:
          type: object
          description: >-
            Per-method parameters. `tools/call` takes `name` and
            `arguments`. Every method may carry `_meta`, which is where
            this revision puts the protocol version, the client info and
            the client capabilities.

    JsonRpcAnswer:
      type: object
      description: >-
        One JSON-RPC 2.0 response. Carries `result` or `error` and never
        both.


        A tool that ran and failed is NOT an `error` here: it is a
        `result` carrying `isError: true`, which is the channel a model
        reads and corrects. An authorization refusal from a read behind
        this endpoint is on that channel deliberately, so the model sees
        the refusal and stops rather than rewording the call. The
        `error` channel is for a call that never ran: an unknown tool, a
        malformed request, arguments outside the declared schema.


        A tool result's rows arrive inside a delimited block whose tool
        description states, in terms, that the delimited content is data
        and not instructions.
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result:
          type: object
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object

  responses:
    BeyondTheWindow:
      description: >-
        Either the `offset` is past the depth this read can reach (see
        the `offset` parameter), or a free-text filter is longer than
        this surface accepts: `?search=` becomes five unanchored `LIKE`
        predicates plus a `COUNT(*)` over the whole retained log, so its
        length is a per-request cost the caller would otherwise choose.
        The message names the limit and never reflects the caller's own
        text back.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: >-
        No environment of this caller's has this name. An environment
        another principal owns and did not label `shared: "true"`
        answers exactly this, body included: a 403 would confirm the
        name is taken, which is the one fact a neighbour on a shared
        node must not be able to enumerate. The refusal reason is in
        the audit row.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: >-
        The hostname is held by another route. The message names the
        hostname and nothing about the route holding it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: conflict
              message: "conflict: hostname `pr-42.review.example.com` is already used by another route"
    PreconditionFailed:
      description: "`If-Match` named a version the environment is no longer at, or the environment does not exist."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: precondition_failed
              message: "If-Match does not match the current ETag \"2026-09-16T10:00:00+00:00\""
    Unprocessable:
      description: >-
        The body parsed and a rule refuses it: an unknown field, a
        malformed value, a cap over its limit (backends per
        environment, environments per principal, backend weight), or
        no certificate covering the hostname, whether resolved or
        named by id (message prefixed
        `no_certificate_covers_hostname`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unprocessable_entity
              message: "unprocessable: no_certificate_covers_hostname: no certificate covers `pr-42.review.example.com`; provision *.review.example.com through POST /api/v1/acme/provision-dns (DNS-01), or name an explicit certificate id"
    WriteBudget:
      description: >-
        This credential has spent its write window: the plane accepts a
        bounded number of writes per credential per minute, the
        dashboard's own figures (settings writes on their own window,
        every other write on a shared one), and a request the scope gate
        refuses spends nothing. `Retry-After` carries the seconds until
        the window rolls over.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until this credential's window rolls over.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ManagementRefusal:
      description: >-
        The management handler refused the write, and the answer is that
        handler's own, unchanged: the same status and the same message
        the dashboard would have shown, naming the field. A 400 is a
        value the handler could not read or a bound it refuses on the
        paths that predate the 400/422 split; a 404 names no row with
        that id; a 409 on a route create is a hostname another route
        holds; a 422 is a rule that refuses the body on its merits,
        `managed_by` on input included. Nothing was written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ManagedRow:
      description: >-
        The row belongs to an automation environment and an in-place
        edit of it would be overwritten by that environment's next
        `PUT`. The message names the environment and says to update it
        through its pipeline instead. The same 409 the management API
        answers, from the same check.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: conflict
              message: "conflict: cannot update this route: it is managed by the automation API for environment `pr-42`. Update the environment through the pipeline instead."
    Unauthorized:
      description: >-
        The credential was not accepted. Missing, malformed, unknown,
        wrong secret, revoked and expired all answer alike, with the
        same body and the same
        `WWW-Authenticate: Bearer realm="lorica-automation"` challenge:
        telling a caller that their token is known but revoked would
        confirm the id for them. An operator distinguishes the cases in
        the audit log, which they can read and a caller cannot.


        Retrying with the same token will not help. Present a different
        one.
      headers:
        WWW-Authenticate:
          description: The bearer challenge naming the automation realm.
          schema:
            type: string
            example: Bearer realm="lorica-automation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthorized
              message: a valid automation bearer token is required
    Forbidden:
      description: >-
        The credential WAS accepted and the grant is not there: the
        token does not carry the scope this path requires, its
        `allowed_hostnames` or `allowed_backend_cidrs` do not cover
        what the body asks for, or the issuer entry binds the caller to
        one environment name. The distinction from a 401 is the
        whole point of answering two codes: a 401 says re-present a
        credential, a 403 says the credential is real and the grant is
        missing, which is the one sentence that leads to the right fix.
        An automation that retries a 403, or an operator who re-mints a
        token that was never the problem, has read the wrong code.


        The message names the missing scope. That is not a disclosure:
        the caller holds the token and can read its own scopes from
        `whoami`; what they cannot do is guess which scope this path
        wanted.


        The same code answers a path that declares no scope at all, for
        every token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: forbidden
              message: this token does not carry the environments:read scope

    McpBadRequest:
      description: >-
        The transport refused the POST before the protocol core saw it.


        Code `-32020` `HeaderMismatch` for a mirrored header that does
        not equal its body counterpart, a required one missing, or a
        value carrying characters that cannot be read as text and
        therefore cannot be compared. A different code, with
        `error.data.name` set to `UnsupportedProtocolVersionError` and
        `error.data.supportedVersions` listing what this server speaks,
        for a revision it does not implement. `-32700` for a body that
        is not JSON and `-32600` for JSON that is not a JSON-RPC
        message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonRpcAnswer"
          example:
            jsonrpc: "2.0"
            id: 4
            error:
              code: -32020
              message: "`mcp-name` does not equal the body's `params.name`"

    McpForbidden:
      description: >-
        Either of two refusals, each a JSON-RPC error.


        An `Origin` header was present. This endpoint serves no browser
        origin, so every one is refused: the specification's one MUST on
        this transport is against DNS rebinding, and a present `Origin`
        on a machine-facing API behind a bearer token means a page is
        driving it. The body carries no `id`: the request was not read
        far enough to have one, and inventing one would answer a
        correlation nobody made.


        Or the presented token's scopes span two MCP tiers, so no server
        is built for it. The body carries the request's `id` and a
        message naming the scopes that put the token in two tiers; the
        audit row reads `automation.request.forbidden:spans_tiers`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonRpcAnswer"

    McpMethodNotFound:
      description: >-
        The method is not one this server implements. A `404` and not a
        `-32601` inside a `200`, which is unusual for a JSON-RPC server
        and is how a client tells a server on revision 2026-07-28 from
        one on the era the method belonged to: `initialize` answers this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonRpcAnswer"
          example:
            jsonrpc: "2.0"
            id: 1
            error:
              code: -32601
              message: >-
                this server implements server/discover, tools/list and
                tools/call, and accepts notifications/cancelled
