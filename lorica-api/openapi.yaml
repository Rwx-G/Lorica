  /api/v1/metrics:
    get:
      tags: [System]
      summary: Prometheus metrics, behind the dashboard session (Viewer+)
      description: >-
        The same text `/metrics` serves, on a path the session cookie
        (scoped to `/api`) reaches: an operator's browser reads it here,
        a scraper uses `/metrics` with the bearer token.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sla/overview:
    get:
      tags: [SLA]
      summary: Get SLA overview across all routes
      description: >-
        With `?node=<node_id>` on a control plane (Story 9.7 AC #5),
        ONE follower's overview, computed on that follower over its
        cluster session and served unchanged. Operator floor when a node
        is named; 409 when the node holds no session. There is no fleet
        aggregate: a fleet percentile is not a function of per-node
        percentiles.
      parameters:
        - $ref: "#/components/parameters/SlaNode"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: SLA overview data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

