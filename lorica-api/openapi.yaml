  # ---------------------------------------------------------------------------
  # Probes
  # ---------------------------------------------------------------------------
  /api/v1/ai-crawlers/custom:
    get:
      tags: [AICrawlers]
      summary: List custom AI / LLM crawler entries
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Custom crawler list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      entries:
                        type: array
                        items:
                          $ref: "#/components/schemas/CustomCrawler"
                      built_in_count:
                        type: integer
                        example: 16
                      max_count:
                        type: integer
                        example: 256
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [AICrawlers]
      summary: Create a custom AI crawler entry
      description: >
        Server-side validation: the regex is compiled with size +
        DFA caps; a pattern that matches any baseline browser /
        search-bot UA is rejected (HTTP 400). IpRanges CIDR lists
        are capped at 64 and validated; Rdns suffixes must be
        non-empty and dot-prefixed.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomCrawlerRequest"
      responses:
        "201":
          description: Crawler created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CustomCrawler"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ai-crawlers/custom/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Custom crawler row id
        schema:
          type: integer
          format: int64
    put:
      tags: [AICrawlers]
      summary: Update a custom AI crawler entry
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomCrawlerRequest"
      responses:
        "200":
          description: Crawler updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CustomCrawler"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [AICrawlers]
      summary: Delete a custom AI crawler entry
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Crawler deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
                        format: int64
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ai-crawlers/builtin:
    get:
      tags: [AICrawlers]
      summary: List the built-in AI crawler descriptors
      description: >
        Returns the 16 built-in crawler descriptors (name, UA
        pattern, verification kind, vendor source). Mirrors the
        authoritative registry in the lorica binary crate.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Built-in descriptor list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [entries]
                    properties:
                      entries:
                        type: array
                        items:
                          $ref: "#/components/schemas/BuiltinCrawler"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ai-crawlers/test:
    get:
      tags: [AICrawlers]
      summary: Classify a User-Agent against the merged registry
      description: >
        Read-only classification of a UA against the merged
        registry (16 built-ins overlaid with enabled custom rows,
        custom wins on name conflict; first match returned). Does
        NOT consult rDNS or vendor IP ranges. would_apply_policy
        reflects the route's ai_bot_policy (off when the route is
        not found or has no policy).
      security:
        - sessionCookie: []
      parameters:
        - name: ua
          in: query
          required: true
          description: URL-encoded User-Agent string to classify
          schema:
            type: string
        - name: route_id
          in: query
          required: true
          description: Route whose ai_bot_policy decides would_apply_policy
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Classification result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [matched_crawler, verification_kind, would_apply_policy, note]
                    properties:
                      matched_crawler:
                        type: string
                        nullable: true
                        example: GPTBot
                      verification_kind:
                        type: string
                        nullable: true
                        enum: [rdns, ip_ranges, ua_only]
                      would_apply_policy:
                        type: string
                        enum: [off, deny, log]
                      note:
                        type: string
                        example: "Matched GPTBot via ip_ranges; route policy Deny"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ai-crawlers/robots-preview:
    get:
      tags: [AICrawlers]
      summary: Preview the auto-served robots.txt body for a route
      description: >
        Returns the body that the proxy's check_robots_txt would
        emit for the route, regardless of the route's
        serve_robots_txt flag. When the route policy is Off the
        allow-all fallback is returned; otherwise one Disallow
        block per active crawler name (16 built-ins + enabled
        custom names, deduped).
      security:
        - sessionCookie: []
      parameters:
        - name: route_id
          in: query
          required: true
          description: Route whose merged registry + policy shapes the body
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: robots.txt preview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [body, route_id, generated_at]
                    properties:
                      body:
                        type: string
                      route_id:
                        type: string
                      generated_at:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ai-crawlers/stats:
    get:
      tags: [AICrawlers]
      summary: Top-5 AI crawlers in the in-process 5-minute window
      description: >
        Top 5 crawlers by hit count for a route within an
        in-process 5-minute sliding window, with per-action
        breakdown. WORKERS-MODE LIMITATION: the buffer is
        per-process; in multi-worker mode the authoritative
        cross-process source is the Prometheus lorica_ai_bot_total
        counter via /metrics. Only window=5m is accepted.
      security:
        - sessionCookie: []
      parameters:
        - name: route_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: window
          in: query
          required: false
          description: Only "5m" is accepted; any other value returns HTTP 400
          schema:
            type: string
            enum: ["5m"]
            default: "5m"
      responses:
        "200":
          description: Top-5 stats
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [window, route_id, top_5]
                    properties:
                      window:
                        type: string
                        example: "5m"
                      route_id:
                        type: string
                      top_5:
                        type: array
                        items:
                          type: object
                          required: [crawler, count, action_breakdown]
                          properties:
                            crawler:
                              type: string
                            count:
                              type: integer
                              format: int64
                            action_breakdown:
                              type: object
                              properties:
                                deny:
                                  type: integer
                                  format: int64
                                log:
                                  type: integer
                                  format: int64
                                spoofed:
                                  type: integer
                                  format: int64
                                ua_only_match:
                                  type: integer
                                  format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

