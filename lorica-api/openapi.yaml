openapi: 3.0.3
info:
  title: Lorica API
  description: REST API for Lorica reverse proxy management
  version: "1.7.4"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:9443
    description: Management port (localhost only)

tags:
  - name: Auth
    description: Authentication and session management
  - name: Settings
    description: Global settings
  - name: Routes
    description: Proxy route management
  - name: Backends
    description: Backend server management
  - name: Certificates
    description: TLS certificate management
  - name: ACME
    description: ACME certificate provisioning
  - name: Cache
    description: Cache management and statistics
  - name: Bans
    description: IP ban management
  - name: WAF
    description: Web Application Firewall
  - name: SLA
    description: SLA monitoring and reporting
  - name: Probes
    description: Health probe management
  - name: LoadTest
    description: Load testing
  - name: Logs
    description: Log access and streaming
  - name: System
    description: System status and metrics
  - name: Config
    description: Configuration import/export
  - name: Notifications
    description: Notification channel management
  - name: Preferences
    description: User preferences
  - name: DnsProviders
    description: DNS provider credentials for ACME DNS-01 challenges
  - name: Validation
    description: Pre-flight validation helpers (mTLS PEM, forward-auth health check)
  - name: Audit
    description: Admin audit log (tamper-evident hash chain)
  - name: Cluster
    description: Fleet registry, join tokens and node lifecycle (control plane), fleet status and leave (follower)
  - name: Capture
    description: Traffic-capture rules (Story 10.1); a rule records real request and response bodies, so every operation names its role floor
  - name: AutomationTokens
    description: >-
      Administration of the credentials the automation plane accepts (Story 10.3).
      These are management-plane operations on purpose: a token able to mint tokens
      would outlive its own revocation, so the automation listener serves none of them.
  - name: AutomationOidcIssuers
    description: >-
      The trust configuration behind a GitLab ID token on the automation plane
      (Story 10.5). One entry is one authorisation policy: an issuer, an audience,
      the claims that must match exactly, and the same grant a static token carries.
      Management-plane only, for the same reason as tokens: an entry decides who
      needs no secret at all to act on this node.

paths:
  # ---------------------------------------------------------------------------
  # Auth (public)
  # ---------------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                username:
                  type: string
                  description: >-
                    Optional backwards-compat shim (pre-1.6.0 clients
                    sent `{password}` only); defaults to `admin`.
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie (HttpOnly, SameSite=Strict)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      role:
                        $ref: "#/components/schemas/Role"
                      must_change_password:
                        type: boolean
                      session_expires_at:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Identity and role behind the current session
      responses:
        "200":
          description: Session identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      role:
                        $ref: "#/components/schemas/Role"
                      session_expires_at:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate session and logout
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ---------------------------------------------------------------------------
  # Metrics (public)
  # ---------------------------------------------------------------------------
  /metrics:
    get:
      tags: [System]
      summary: Prometheus-compatible metrics endpoint
      responses:
        "200":
          description: Metrics in Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string

  # ---------------------------------------------------------------------------
  # ACME challenge (public)
  # ---------------------------------------------------------------------------
  /.well-known/acme-challenge/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [ACME]
      summary: Serve ACME HTTP-01 challenge response
      responses:
        "200":
          description: Challenge token value
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Auth - password change (protected)
  # ---------------------------------------------------------------------------
  /api/v1/auth/password:
    put:
      tags: [Auth]
      summary: Change admin password
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  description: >-
                    Validated against the configured policy
                    (password_min_length, default 14, plus character
                    classes when password_require_complexity is on).
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Users (SuperAdmin only, Story 8.3)
  # ---------------------------------------------------------------------------
  /api/v1/users:
    get:
      tags: [Users]
      summary: List user accounts (SuperAdmin)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Create a user account (SuperAdmin)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                  description: 3-32 chars, lowercase alphanumeric plus '._-', starting alphanumeric.
                password:
                  type: string
                  description: Validated against the password policy.
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Users]
      summary: Fetch one user account (SuperAdmin)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update password / role / disabled flag (SuperAdmin)
      description: >-
        Any role change, disable, or password reset invalidates every
        session of the target user immediately. Demoting or disabling
        the last enabled super admin is rejected.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: >-
                    New password (policy-validated); sets
                    must_change_password on the target.
                role:
                  $ref: "#/components/schemas/Role"
                disabled:
                  type: boolean
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      summary: Delete a user account (SuperAdmin)
      description: >-
        Deleting your own account or the last enabled super admin is
        rejected.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Settings
  # ---------------------------------------------------------------------------
  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Get global settings
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Settings]
      summary: Update global settings
      description: |
        Updates global settings. All fields are optional - only provided fields
        are changed. The `trusted_proxies` field accepts an array of CIDR ranges
        or IP addresses. X-Forwarded-For is only trusted when the direct TCP
        client IP matches a trusted proxy entry. Empty array = trust no XFF.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trusted_proxies:
                  type: array
                  items:
                    type: string
                  description: CIDR ranges or IPs of trusted reverse proxies
                  example: ["192.168.0.0/16", "10.0.0.0/8"]
                waf_whitelist_ips:
                  type: array
                  items:
                    type: string
                  description: IPs or CIDRs that bypass WAF, rate limiting, IP blocklist, and auto-ban
                  example: ["203.0.113.50", "10.0.0.0/8"]
                connection_deny_cidrs:
                  type: array
                  items:
                    type: string
                  description: IPs or CIDRs dropped at TCP accept time, before TLS handshake. Evaluated after the allow list; deny always wins.
                  example: ["198.51.100.0/24"]
                connection_allow_cidrs:
                  type: array
                  items:
                    type: string
                  description: When non-empty, only listed IPs are accepted at TCP accept (default-deny mode). Leave empty for default-allow.
                  example: ["10.0.0.0/8", "192.168.0.0/16"]
                automation_allowed_cidrs:
                  type: array
                  items:
                    type: string
                  description: Source networks allowed to reach the automation API listener (--automation-listen). Always default-deny; the listener refuses to open while this is empty.
                  example: ["10.0.0.0/8", "192.0.2.10"]
                syslog_access_enabled:
                  type: boolean
                  default: true
                  description: Ship access-log rows to the syslog sink (Story 9.8). Only meaningful while `syslog_endpoint` is set.
                syslog_waf_enabled:
                  type: boolean
                  default: true
                  description: Ship WAF events to the syslog sink.
                syslog_audit_enabled:
                  type: boolean
                  default: true
                  description: Ship audit entries to the syslog sink.
                syslog_capture_enabled:
                  type: boolean
                  default: true
                  description: Ship traffic capture records (Story 10.2) to the syslog sink. Its own toggle since backlog #50 closed; it used to follow `syslog_access_enabled`.
                otlp_logs_enabled:
                  type: boolean
                  default: false
                  description: Export logs as OTLP log records to the `otlp_endpoint` collector (needs a binary built with `--features otel`).
                otlp_logs_access_enabled:
                  type: boolean
                  default: true
                  description: Ship access-log rows on the OTLP logs lane (backlog #50). Only meaningful while `otlp_logs_enabled` is set.
                otlp_logs_waf_enabled:
                  type: boolean
                  default: true
                  description: Ship WAF events on the OTLP logs lane.
                otlp_logs_audit_enabled:
                  type: boolean
                  default: true
                  description: Ship audit entries on the OTLP logs lane.
                otlp_logs_capture_enabled:
                  type: boolean
                  default: true
                  description: Ship traffic capture records on the OTLP logs lane.
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/settings/schema:
    get:
      tags: [Settings]
      summary: Get global-settings field bounds
      description: |
        Machine-readable constraints for every operator-tunable global
        settings field (Story 8.10 AC #7). Keyed by field name; each
        value carries a `type` (`integer`, `number`, `boolean`,
        `string`, or `enum`), optional `min` / `max`, a `default`, and,
        for enum fields, the `choices` array. The dashboard renders
        input constraints from this payload instead of hardcoding them.
        Numeric bounds are the same values the `PUT /api/v1/settings`
        validator enforces. Read-only metadata, Viewer+ like
        `GET /api/v1/settings`.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Settings field schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/SettingsFieldSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Routes
  # ---------------------------------------------------------------------------
  /api/v1/routes:
    get:
      tags: [Routes]
      summary: List all routes
      security:
        - sessionCookie: []
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      routes:
                        type: array
                        items:
                          $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Routes]
      summary: Create a new route
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteRequest"
      responses:
        "201":
          description: Route created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Route"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/routes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Routes]
      summary: Get route by ID
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Route details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Routes]
      summary: Update route
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRouteRequest"
      responses:
        "200":
          description: Route updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The route is managed by the automation API; update its environment through the pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Routes]
      summary: Delete route
      description: >-
        A route the automation API manages is deletable: its environment
        row cascades away with it and the pipeline's next PUT recreates
        the environment. The audit row names the environment.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Route deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Capture rules (Story 10.1)
  # ---------------------------------------------------------------------------
  /api/v1/capture/rules:
    get:
      tags: [Capture]
      summary: List the capture rules on this node (Operator+)
      description: >-
        The listing sits one role below reading a single rule: an on-call
        operator has to see WHICH recorders are armed without being able to
        read the paths, headers and source ranges any of them matches.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Every capture rule, oldest id first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rules:
                        type: array
                        items:
                          $ref: "#/components/schemas/CaptureRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Capture]
      summary: Arm a new capture rule (SuperAdmin)
      description: >-
        `expires_at` is materialised server-side from `limits.ttl_seconds`
        and cannot be supplied; neither can the two capture counters. The
        body is `deny_unknown_fields`, so sending any of them is a 422.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureRuleRequest"
      responses:
        "201":
          description: Capture rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CaptureRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/capture/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Capture]
      summary: Read one capture rule (SuperAdmin)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The capture rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CaptureRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Capture]
      summary: Replace one capture rule (SuperAdmin)
      description: >-
        A full replace, not a patch. `created_at`, `created_by` and both
        capture counters are kept from the stored row, and `expires_at` is
        recomputed as `created_at` plus the submitted `limits.ttl_seconds`,
        so no sequence of edits carries a rule past the seven-day retention
        ceiling from when it was created.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureRuleRequest"
      responses:
        "200":
          description: The replaced capture rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CaptureRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Capture]
      summary: Delete one capture rule (SuperAdmin)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Capture rule deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/capture/rules/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Capture]
      summary: Stop one capture rule (Operator+)
      description: >-
        Deliberately one role below creating a rule. Arming a recorder
        decides that production bodies get written to disk; stopping one
        only decides that they stop, and an operator paged about a capture
        filling a disk must be able to end it without waking a SuperAdmin.
        Idempotent: disabling an already-disabled rule is a 200.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The rule, now disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CaptureRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/capture/recent:
    get:
      tags: [Capture]
      summary: The last capture records this process emitted (Operator+)
      description: >-
        A bounded in-memory ring of the last 50 records, newest first, with
        each body cut at 4 KiB of its JSON string form and marked
        (`body_elided`, `body_elided_total`). The full record is one
        download away while it is still in the ring. The ring is per
        process: under `--workers` each worker fills its own and the
        supervisor serving this API holds an empty one, so a `--workers`
        node answers 503 and names the sinks that do carry the records,
        rather than showing an empty ring on a node that is capturing.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The ring, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      captures:
                        type: array
                        items:
                          $ref: "#/components/schemas/RecentCapture"
                      capacity:
                        type: integer
                        description: How many records the ring keeps before evicting the oldest.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/capture/recent/{request_id}:
    parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
        description: The record's `request_id`, the same value as its access-log row.
      - name: rule_id
        in: query
        required: false
        schema:
          type: string
        description: >-
          Narrow to the record one rule produced. Two rules admitting the
          same exchange produce two records with the same `request_id`;
          absent, the newest of them is returned.
    get:
      tags: [Capture]
      summary: Download one full capture record (Operator+)
      description: >-
        The record exactly as the sinks received it, as an attachment named
        `<timestamp>-<request_id>.json`, the name the directory sink writes.
        404 once the ring has evicted the record; 503 under `--workers`, as
        for the listing.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The capture record
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="<timestamp>-<request_id>.json"
          content:
            application/json:
              schema:
                type: object
                description: The capture record. See docs/capture.md for every field.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------------------
  # Automation tokens (Story 10.3 AC #6)
  # ---------------------------------------------------------------------------
  /api/v1/automation/tokens:
    get:
      tags: [AutomationTokens]
      summary: List the automation tokens on this node (SuperAdmin)
      description: >-
        Safe to render: no row carries the secret or its HMAC. `last_used_at`
        and `revoked_at` are always present so a stale or withdrawn credential
        is visible without a second request.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Every automation token, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tokens:
                        type: array
                        items:
                          $ref: "#/components/schemas/AutomationToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [AutomationTokens]
      summary: Mint an automation token (SuperAdmin); the token is shown once
      description: >-
        The answer is the ONLY place the full `<public_id>.<secret>` string ever
        appears. The node stores HMAC-SHA256 of the secret half and nothing else,
        so no later read can produce it again and there is no recovery path: an
        operator who loses it mints a new token. Hand it to the automation through
        a file, standard input or a secret store, never on a command line.


        The body is `deny_unknown_fields`, so the server-owned facts (`public_id`,
        `secret_hmac`, `created_by`, `last_used_at`, `revoked_at`) are refused on
        input. Every other rule belongs to the model's validator and is a 422
        naming the offending field.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationTokenRequest"
      responses:
        "201":
          description: Token minted (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - type: object
                        properties:
                          token:
                            type: string
                            description: The full token. Never stored, never logged, never returned again.
                      - $ref: "#/components/schemas/AutomationToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/automation/tokens/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [AutomationTokens]
      summary: Revoke an automation token (SuperAdmin)
      description: >-
        Revocation, not deletion: `revoked_at` is stamped and the row stays, so
        after an incident the audit trail still names the credential, who minted
        it and when it was last presented. Nothing caches the token, so the
        listener refuses it on its very next request.


        Revoking twice is a 200 and keeps the first stamp; moving it forward
        would rewrite when the credential actually stopped working. A `public_id`
        naming no row is a 404, because a typo must not read as a revocation.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The token, now revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AutomationToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # OIDC issuer entries (Story 10.5 AC #1)
  # ---------------------------------------------------------------------------
  /api/v1/automation/oidc-issuers:
    get:
      tags: [AutomationOidcIssuers]
      summary: List the OIDC issuer entries on this node (SuperAdmin)
      description: >-
        Every entry, oldest first, which is the order the bearer gate tries
        them in for a token naming their audience. Nothing here is secret, but
        everything here is authority: the listing says which identity provider
        this node believes and which claims unlock it.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Every issuer entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      issuers:
                        type: array
                        items:
                          $ref: "#/components/schemas/OidcIssuer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [AutomationOidcIssuers]
      summary: Register an OIDC issuer entry (SuperAdmin)
      description: >-
        `issuer` and `jwks_url` must be `https`; `jwks_url` defaults to
        `<issuer>/oauth/discovery/keys`, which is where GitLab publishes its
        signing keys. `bound_claims` is an exact-match map over `project_path`,
        `namespace_path`, `ref_protected`, `environment_protected` and
        `deployment_tier`; a `*` glob is accepted in `project_path` ONLY, because
        the other four are booleans and enums whose whole value is being exact.
        Several entries may share an issuer and an audience with different bound
        claims; the first whose claims all hold accepts a token.


        The body is `deny_unknown_fields`, so the server-owned facts (`id`,
        `created_by`, `created_at`) are refused on input. Every other rule belongs
        to the model's validator and is a 422 naming the offending field.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcIssuerRequest"
      responses:
        "201":
          description: Entry registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OidcIssuer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/automation/oidc-issuers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [AutomationOidcIssuers]
      summary: Remove an OIDC issuer entry (SuperAdmin)
      description: >-
        A real delete, unlike a token revocation: the row holds no credential
        whose history matters, and the audit row keeps everything the entry
        said. The bearer gate reads the entries for a token's audience from the
        store on every request and caches nothing, so the very next ID token
        this entry would have accepted is refused. An unknown id is a 404, so a
        typo cannot read as a removal.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Entry removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

