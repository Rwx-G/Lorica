  # Logs export
  # ---------------------------------------------------------------------------
  /api/v1/logs/export:
    get:
      tags: [Logs]
      summary: Export the persistent access log buffer (CSV / JSONL)
      description: |
        Streams the current access-log persistent ring buffer in
        the requested format. Honours the same `route` / `status`
        / `since` / `until` filters as `GET /api/v1/logs`.
      security:
        - sessionCookie: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, jsonl]
            default: jsonl
      responses:
        "200":
          description: Log payload as a downloadable file
          content:
            application/json:
              schema:
                type: string
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # ACME DNS-01 manual : pre-confirm DNS propagation check
  # ---------------------------------------------------------------------------
  /api/v1/acme/provision-dns-manual/check:
    post:
      tags: [ACME]
      summary: Verify the operator-published TXT record is visible
      description: |
        Queries the public DNS for the `_acme-challenge.<domain>`
        TXT record and reports whether the expected token is
        present. Used by the dashboard to gate the "Confirm"
        button so the operator does not finalise the ACME flow
        before propagation lands.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        "200":
          description: Probe outcome
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Certificate ACME renewal
  # ---------------------------------------------------------------------------
  /api/v1/certificates/{id}/renew:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Certificates]
      summary: Force an ACME renewal for one certificate
      description: |
        Triggers an immediate ACME renewal for the named cert
        regardless of its remaining validity. Honours the cert's
        recorded ACME method (HTTP-01 / DNS-01) and provider id.
        Returns the new cert id on success ; the old row is
        replaced atomically.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Renewal succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  cert_id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Renewal failed (ACME server error, DNS, etc.)

  # ---------------------------------------------------------------------------
  # Admin audit log (Story 8.9)
  # ---------------------------------------------------------------------------
  /api/v1/audit:
    get:
      tags: [Audit]
      summary: List admin audit-log entries
      description: |
        Returns the tamper-evident admin audit log (Story 8.9).
        Operator+ role floor, enforced by the authorize middleware.

        On a control plane the table also holds the rows other nodes
        fanned in (Story 9.9). Each row carries `node_id` and
        `origin_id`; an empty `node_id` is this node's own row, and
        `origin_id` is the id the origin node assigned, which is what
        matches an aggregated row against that node's own copy.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: operator
          schema: { type: string }
          description: Exact operator-username match.
        - in: query
          name: action
          schema: { type: string }
          description: Action prefix, e.g. `cluster.` matches `cluster.node.enroll`.
        - in: query
          name: from
          schema: { type: string }
          description: Inclusive RFC 3339 lower bound.
        - in: query
          name: to
          schema: { type: string }
          description: Inclusive RFC 3339 upper bound.
        - in: query
          name: limit
          schema: { type: integer }
          description: Page size (default 100, capped at 1000).
        - in: query
          name: before_id
          schema: { type: integer }
          description: Cursor; rows with an id strictly below this one.
        - in: query
          name: node
          schema: { type: string }
          description: >-
            Restrict to one node's rows (Story 9.9 AC #5). The EMPTY string
            is a real filter and selects this node's own rows; omitting the
            parameter returns every node's.
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/verify:
    get:
      tags: [Audit]
      summary: Verify the audit-log hash chain
      description: |
        Recomputes the audit-log hash chain and reports whether the
        trail is intact (Story 8.9). SuperAdmin-only, enforced by the
        authorize middleware.

        Reports PER NODE (Story 9.9 AC #3). An aggregated table holds
        one chain per node, so a single verdict over the whole table
        would be meaningless: it would chain one node's row to
        another's and break at the first interleave. The top-level
        `verified` is the conjunction of every chain's, so a caller
        reading only that field still gets a correct answer.

        What this proves is the internal consistency of what each node
        sent, and nothing about authenticity. The hash is unkeyed, so a
        compromised follower can stream a self-consistent forged chain
        and this reports it clean, and a principal with write access to
        the control plane can rewrite one node's rows and recompute
        that chain forward. The control plane's copy is strictly weaker
        than each origin node's. The authoritative anchor is each
        node's own `lorica::audit` tracing event shipped to a WORM sink
        (Story 9.8): comparing the aggregated `chain_hash` against the
        externally captured one is what a rewrite cannot survive, and
        is why the fan-in stores both hashes verbatim rather than
        recomputing them.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: node
          schema: { type: string }
          description: >-
            Verify one chain. The EMPTY string is this node's own; omitting
            the parameter verifies every chain in the table and reports each
            separately.
      responses:
        "200":
          description: Verification outcome, one entry per chain
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified:
                        type: boolean
                        description: True only when every chain verified.
                      nodes:
                        type: array
                        items:
                          $ref: "#/components/schemas/NodeVerifyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/cluster/status:
    get:
      tags: [Cluster]
      summary: This node's fleet role and connection state (Viewer+)
      description: >-
        Story 9.3 AC #14. `role` is `standalone`, `control_plane` or
        `follower`. A control plane returns the roster in `fleet`; a
        follower returns its node id, the control plane it dials and its
        connection state. `applied_config_generation` is 0 until Story 9.4.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Cluster status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClusterStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/cluster/tokens:
    get:
      tags: [Cluster]
      summary: List join tokens (SuperAdmin; secrets never stored)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Tokens, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/JoinToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This node is not a control plane
    post:
      tags: [Cluster]
      summary: Mint a join token (SuperAdmin); the token is shown once
      description: >-
        Story 9.3 AC #1/#2/#5. The token pins the control plane's current
        leaf SPKI. Minting opens the enrollment listener until the last
        live token is burned, revoked or expires. Pass the token to the
        joining node through `--token-file`, `--token-stdin` or
        `LORICA_JOIN_TOKEN`, never on a command line.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  type: integer
                  description: Lifetime in seconds (default 3600, max 86400).
                node_name:
                  type: string
                  description: When set, only a node presenting exactly this name may redeem.
                source_cidr:
                  type: string
                  description: When set, only a connection from this CIDR may redeem.
      responses:
        "201":
          description: Token minted (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: The full token. Never stored, never logged.
                      public_id:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                      bound_node_name:
                        type: string
                        nullable: true
                      bound_source_cidr:
                        type: string
                        nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This node is not a control plane
  /api/v1/cluster/tokens/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Cluster]
      summary: Withdraw an unused join token (SuperAdmin)
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Token revoked; the enrollment window closes if it was the last live token
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No unused token with this public id
        "409":
          description: This node is not a control plane
  /api/v1/cluster/nodes:
    get:
      tags: [Cluster]
      summary: The fleet roster with live session facts (Operator+)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Enrolled nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClusterNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This node is not a control plane
  /api/v1/cluster/nodes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Cluster]
      summary: One enrolled node (Operator+)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The node
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClusterNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This node is not a control plane
    delete:
      tags: [Cluster]
      summary: Revoke a node (SuperAdmin)
      description: >-
        Story 9.3 AC #7. The node's certificate serials go on the CRL, the
        operational acceptor is rebuilt, and the node's live session is
        ended synchronously. The registry row stays, marked `revoked`.
        Idempotent: revoking an already revoked node answers 200 and
        re-runs the CRL rebuild and the session kill, so a first attempt
        that failed half-way (500) can simply be retried.

        Revocation cuts the node's access. It does not take back the
        certificate private keys the node already holds (Story 9.5), so
        the response names them in `certificates_to_reissue`: each must
        be re-issued, because the revoked node keeps its copy. The same
        list is in the `cluster.node.revoke` audit row. On a retry the
        list is empty (a revoked node is entitled to nothing).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Node revoked (or already revoked; the refresh ran again)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      node_id:
                        type: string
                      name:
                        type: string
                      newly_revoked:
                        type: boolean
                        description: False on a retry.
                      session_ended:
                        type: boolean
                      certificates_to_reissue:
                        type: array
                        items:
                          type: string
                        description: >-
                          Certificate ids whose private key the node was
                          entitled to at the moment of revocation.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Node not found
        "409":
          description: This node is not a control plane
  /api/v1/cluster/nodes/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Cluster]
      summary: Activate a pending node (SuperAdmin)
      description: >-
        Story 9.3 AC #5. A `pending` node holds a certificate but receives
        no configuration and no certificates until activated.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The activated node
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClusterNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The node is not pending, or this node is not a control plane
  /api/v1/cluster/leave:
    post:
      tags: [Cluster]
      summary: Leave the fleet (SuperAdmin, follower only)
      description: >-
        Story 9.3 AC #13. Tells the control plane over the live session
        (which revokes, audits and alerts on its side), then wipes this
        node's fleet identity and audits locally. When the control plane
        could not be reached, `control_plane_notified` is `false` and the
        operator must revoke the node on the control plane.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Left the fleet
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      node_id:
                        type: string
                      control_plane_notified:
                        type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This node is not a follower
  /api/v1/cluster/replication:
    get:
      tags: [Cluster]
      summary: Last configuration replication round (Operator+, control plane)
      description: >-
        Story 9.4 AC #8. The completion channel is a report, not a blocking
        response: a mutation answers as soon as it is committed locally, and
        the fleet outcome lands here. `in_flight` names the generation being
        replicated right now. In `last`, a node under `evicted` failed its
        Prepare on transport and the commit proceeded without it (it converges
        by pull); a node under `rejected` refused the blob semantically, which
        aborts the round fleet-wide; `split_fleet` is true when some nodes
        committed and others did not, which the next heartbeat reconciles.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Replication status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReplicationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This node is not a control plane
  /api/v1/cluster/drift:
    get:
      tags: [Cluster]
      summary: Nodes whose applied configuration differs (Operator+, control plane)
      description: >-
        Story 9.4 AC #12. Every `active` node is compared to the control
        plane's current generation and hash, using the live session's report
        when connected and the persisted registry columns otherwise. `age_s`
        is how long the divergence has been observed. Drift alerts are
        suppressed per node by an exponential backoff (1 minute doubling to 1
        hour) so a flapping node cannot consume the notification budget.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Drift report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DriftReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This node is not a control plane
  /api/v1/cluster/bans:
    get:
      tags: [Cluster]
      summary: Every node's live bans, as last reported (Operator+, control plane)
      description: >-
        Story 9.6 AC #10, the visibility half. A snapshot of what each node
        last reported, not a history: bans are in-memory state on each node,
        so this is lossy across a node restart by construction. Each row is
        stamped with the `node_id` the mutual-TLS session proved.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: node
          schema: { type: string }
          description: Restrict to one node id.
      responses:
        "200":
          description: The fleet's live bans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FleetBanRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This node is not a control plane
    post:
      tags: [Cluster]
      summary: Ban a client across the whole fleet (SuperAdmin, control plane)
      description: >-
        Story 9.6 AC #10. Fleet-wide by definition and NOT need-to-know: the
        operator decided this client should reach nothing, so the ban goes to
        every active node rather than to a resolved subset. Best effort, like
        every push on this plane: a node that was down when the ban was issued
        does NOT receive it later, because a ban has no convergence path the
        way configuration and certificate keys do. Automatic per-node auto-ban
        is deliberately not replicated, since one node's reflex to its own
        traffic would otherwise become a fleet-wide outage for that client.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_ip, duration_s]
              properties:
                client_ip:
                  type: string
                  description: The client address; must parse as an IP address.
                  example: "192.0.2.10"
                duration_s:
                  type: integer
                  description: How long the ban lasts, 1 to 86400 seconds.
                  example: 3600
      responses:
        "200":
          description: Which nodes took the ban
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FleetBanResult"
        "400":
          description: client_ip is not an address, or duration_s is out of range
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This node is not a control plane
  /api/v1/cluster/logs:
    get:
      tags: [Cluster]
      summary: The fleet's access logs (Operator+, control plane)
      description: >-
        Story 9.6 AC #9. Rows fanned in from every node, newest first, each
        stamped with the `node_id` the mutual-TLS session proved rather than
        any identity the payload carried. Paginated by CURSOR with no total:
        a `COUNT(*)` per page on an aggregated table is a full scan under the
        store lock, which would stall the ingest writer. Pass the previous
        page's `next_cursor` as `before_id`; a `null` `next_cursor` means the
        last page.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: node
          schema: { type: string }
          description: Restrict to one node id.
        - in: query
          name: route
          schema: { type: string }
          description: Substring match on the request host.
        - in: query
          name: from
          schema: { type: string }
          description: Inclusive lower bound on the origin timestamp, RFC 3339.
        - in: query
          name: to
          schema: { type: string }
          description: Inclusive upper bound on the origin timestamp, RFC 3339.
        - in: query
          name: before_id
          schema: { type: integer }
          description: Cursor; return rows with an id strictly below this one.
        - in: query
          name: limit
          schema: { type: integer }
          description: Rows per page (default 100, max 1000).
      responses:
        "200":
          description: One page of fanned-in access rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FleetLogPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This node is not a control plane
  /api/v1/cluster/waf-events:
    get:
      tags: [Cluster]
      summary: The fleet's WAF events (Operator+, control plane)
      description: >-
        Story 9.6 AC #9. The WAF counterpart of `/api/v1/cluster/logs`, with
        the same cursor pagination and the same rule that `node_id` comes from
        the session. `route` matches the event's route hostname.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: node
          schema: { type: string }
        - in: query
          name: route
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
          description: >-
            Exact WAF rule category, matching the values the single-node
            `/api/v1/waf/events` endpoint accepts. WAF-only: the access-log
            endpoint has no such column and ignores it.
        - in: query
          name: from
          schema: { type: string }
        - in: query
          name: to
          schema: { type: string }
        - in: query
          name: before_id
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: One page of fanned-in WAF events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FleetWafPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This node is not a control plane
  /api/v1/cluster/break-glass:
    get:
      tags: [Cluster]
      summary: The current break-glass window (SuperAdmin, follower only)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Break-glass state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BreakGlass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This node is not a follower
    post:
      tags: [Cluster]
      summary: Open a break-glass window (SuperAdmin, follower only)
      description: >-
        Story 9.4 AC #11. A follower normally answers `409` to every
        configuration mutation: the control plane owns the configuration.
        Break-glass re-enables local mutations for a bounded window (max
        86400 seconds) so an operator can act on an edge while the control
        plane is unreachable. It is audited locally, bannered in
        `cluster status` and the dashboard, and reported to the control plane
        in every heartbeat. When the window ends the follower pulls the
        current generation and applies it, so local edits are reconciled
        away.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration_s]
              properties:
                duration_s:
                  type: integer
                  minimum: 1
                  maximum: 86400
      responses:
        "200":
          description: Window open
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BreakGlass"
        "400":
          description: duration_s out of range
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This node is not a follower
    delete:
      tags: [Cluster]
      summary: Close the break-glass window now (SuperAdmin, follower only)
      description: >-
        Ends the window immediately; the follower reconciles with the control
        plane's current generation.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Window closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BreakGlass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This node is not a follower

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lorica_session

  parameters:
    SlaNode:
      name: node
      in: query
      required: false
      schema:
        type: string
      description: >-
        A follower's node id, on a control plane: the figures are then
        that node's own (Story 9.7 AC #5). Absent or empty: this node.
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ClusterNode:
      type: object
      description: One enrolled node (Story 9.3 AC #9) plus its live session facts. Fingerprints and serials are public values.
      properties:
        node_id:
          type: string
        name:
          type: string
        cert_fingerprint:
          type: string
          description: Lowercase-hex SHA-256 of the current certificate DER.
        cert_serial:
          type: string
        prev_cert_fingerprint:
          type: string
          nullable: true
        prev_cert_serial:
          type: string
          nullable: true
        address:
          type: string
        version:
          type: string
        schema_version:
          type: integer
        status:
          type: string
          enum: [pending, active, revoked]
        enrolled_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        applied_config_generation:
          type: integer
        applied_config_hash:
          type: string
        cert_not_after:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        connected:
          type: boolean
        session_peer:
          type: string
          nullable: true
        session_last_seen_unix:
          type: integer
          nullable: true
        drifted:
          type: boolean
          description: >-
            The control plane's own drift verdict for this node, formed
            the same way `/cluster/drift` forms it: generation and hash,
            from the live session when there is one and from the
            registry row otherwise. Read it rather than recomputing it
            from the registry fields, which answers a different question
            (backlog #71).
        applied_generation:
          type: integer
          description: The generation the verdict above was formed against.
        applied_hash:
          type: string
          description: The hash the verdict above was formed against.
        from_live_session:
          type: boolean
          description: >-
            Whether that generation and hash came from the node's live
            session or from the registry row, which a timer writes and
            which can therefore lag a node that has already converged.
        selected_for_hostnames:
          type: array
          description: >-
            Hostnames whose route selectors name this node, and whose
            certificate private keys it therefore receives (Story 9.5 D15).
            Fleet-wide routes are excluded: they apply to every node and
            would bury the entries an approval decision turns on.
          items:
            type: string
        certificate_ids:
          type: array
          description: >-
            The certificates whose private key this node receives, resolved by
            the stated inverse of the push path's own resolver. Deliberately
            NOT derivable from `selected_for_hostnames`: that field omits
            fleet-wide routes, which entitle every Active node, so deriving
            from it reports no key material on a node holding every fleet-wide
            certificate. Empty on a node that is not Active.
          items:
            type: string
        resources:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/NodeResources"
    NodeVerifyResult:
      type: object
      description: One audit chain's verdict (Story 9.9 AC #3).
      properties:
        node_id:
          type: string
          description: The chain's node; empty is this node's own.
        verified:
          type: boolean
        total_rows:
          type: integer
        first_break_id:
          type: integer
          description: >-
            The AGGREGATED row id of the earliest row that failed to
            recompute, so an operator can find it. Absent when verified.
        first_break_reason:
          type: string
          enum: [prev_hash_mismatch, chain_hash_mismatch]
    NodeResources:
      type: object
      description: >-
        What a node last reported it is using, sampled on its heartbeat
        (Story 9.7 AC #3). Session state: it is absent from a node that has
        sent no reading on its current session, and re-learned within one
        interval after a reconnect rather than restored from a store, because
        a figure from before a restart would look live while describing a
        process that no longer runs. Used and total are both sent so the
        dashboard never guesses a denominator; a zero total means the node
        could not read that figure.
      properties:
        cpu_percent:
          type: integer
          description: Whole percent, 0 to 100, as the node rounded it.
        memory_used_bytes:
          type: integer
        memory_total_bytes:
          type: integer
        disk_used_bytes:
          type: integer
          description: The filesystem holding the node's data directory, not its root.
        disk_total_bytes:
          type: integer
    JoinToken:
      type: object
      description: A join token's public facts. The secret half is never stored (only its HMAC), so it can never be listed.
      properties:
        public_id:
          type: string
        state:
          type: string
          enum: [unused, burned, revoked]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_by:
          type: string
        bound_node_name:
          type: string
          nullable: true
        bound_source_cidr:
          type: string
          nullable: true
        burned_at:
          type: string
          format: date-time
          nullable: true
        burned_by_node_id:
          type: string
          nullable: true
    ClusterStatus:
      type: object
      description: This node's fleet role (Story 9.3 AC #14).
      properties:
        role:
          type: string
          enum: [standalone, control_plane, follower]
        build_version:
          type: string
        node_id:
          type: string
          nullable: true
        node_name:
          type: string
          nullable: true
        control_plane:
          type: string
          nullable: true
        connection_state:
          type: string
          nullable: true
          enum: [connected, disconnected]
        session_generation:
          type: integer
          nullable: true
        applied_config_generation:
          type: integer
        applied_config_hash:
          type: string
          description: Canonical hash of the applied configuration (Story 9.4).
        break_glass_until:
          type: string
          format: date-time
          nullable: true
          description: End of the follower's break-glass window (Story 9.4 AC #11); null when closed.
        fleet:
          type: array
          items:
            type: object
            properties:
              node_id:
                type: string
              name:
                type: string
              status:
                type: string
                enum: [pending, active, revoked]
              connected:
                type: boolean
              last_seen_at:
                type: string
                format: date-time
                nullable: true
              version:
                type: string
              applied_config_generation:
                type: integer
    NodeOutcome:
      type: object
      description: A per-node replication failure with its reason (Story 9.4).
      properties:
        node_id:
          type: string
        reason:
          type: string
    ReplicationRound:
      type: object
      description: One completed configuration replication round (Story 9.4 AC #5/#6/#8).
      properties:
        generation:
          type: integer
        hash:
          type: string
        targets:
          type: array
          items:
            type: string
        prepared:
          type: array
          items:
            type: string
        evicted:
          type: array
          description: Transport failure on Prepare; the commit proceeded without these nodes.
          items:
            $ref: "#/components/schemas/NodeOutcome"
        rejected:
          type: array
          description: Semantic rejection; a single one aborts the round fleet-wide.
          items:
            $ref: "#/components/schemas/NodeOutcome"
        committed:
          type: array
          items:
            type: string
        commit_failed:
          type: array
          items:
            $ref: "#/components/schemas/NodeOutcome"
        skipped_quarantined:
          type: array
          items:
            type: string
        skipped_break_glass:
          type: array
          items:
            type: string
        aborted:
          type: boolean
        split_fleet:
          type: boolean
          description: Some nodes committed and others did not; reconciled by the next heartbeat.
    ReplicationStatus:
      type: object
      description: Payload of `GET /api/v1/cluster/replication` (Story 9.4 AC #8).
      properties:
        current_generation:
          type: integer
        current_hash:
          type: string
        in_flight:
          type: integer
          nullable: true
        policy_state_reset_by_restart:
          type: boolean
          description: >-
            True when `last` is null only because this control-plane
            process has not run a round yet. Replication policy state
            (eviction streaks, quarantine, the last report) is a
            within-process circuit breaker and is not persisted, so a
            restart releases every quarantined node and forgets a fleet
            that converged weeks ago.
        last:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReplicationRound"
    DriftEntry:
      type: object
      description: One node whose applied configuration differs (Story 9.4 AC #12).
      properties:
        node_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [pending, active, revoked]
        connected:
          type: boolean
        applied_generation:
          type: integer
        applied_hash:
          type: string
        break_glass:
          type: boolean
        quarantined:
          type: boolean
        since:
          type: string
          format: date-time
          nullable: true
        age_s:
          type: integer
          nullable: true
    FleetBanRow:
      type: object
      description: One node's view of one banned client (Story 9.6 AC #10).
      properties:
        node_id:
          type: string
          description: The node reporting it, stamped from the session.
        client_ip: { type: string }
        remaining_s:
          type: integer
          description: Seconds left when the snapshot was taken.
        reason: { type: string }
        observed_at:
          type: string
          description: When the control plane recorded this snapshot, RFC 3339.
    FleetBanResult:
      type: object
      description: Payload of `POST /api/v1/cluster/bans` (Story 9.6 AC #10).
      properties:
        applied:
          type: array
          description: Node ids now enforcing the ban.
          items: { type: string }
        unreachable:
          type: array
          description: >-
            Node ids that did not answer. They do NOT receive the ban later.
          items: { type: string }
    FleetAccessRow:
      type: object
      description: One fanned-in access-log row (Story 9.6).
      properties:
        id:
          type: integer
          description: Cursor for pagination; the fan-in store's own rowid.
        node_id:
          type: string
          description: >-
            The node the row came from, stamped by the control plane from the
            mutual-TLS session, never taken from the payload.
        timestamp: { type: string }
        method: { type: string }
        path: { type: string }
        host: { type: string }
        status: { type: integer }
        latency_ms: { type: integer }
        backend: { type: string }
        error: { type: string }
        client_ip: { type: string }
        request_id: { type: string }
    FleetWafRow:
      type: object
      description: One fanned-in WAF event (Story 9.6).
      properties:
        id: { type: integer }
        node_id: { type: string }
        rule_id: { type: integer }
        description: { type: string }
        category: { type: string }
        severity: { type: integer }
        matched_field: { type: string }
        matched_value: { type: string }
        timestamp: { type: string }
        client_ip: { type: string }
        route_hostname: { type: string }
        action: { type: string }
    FleetLogPage:
      type: object
      description: >-
        One page of fanned-in access rows. There is no total, deliberately:
        a `COUNT(*)` per page on an aggregated table is a full scan under the
        store lock.
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FleetAccessRow"
        next_cursor:
          type: integer
          nullable: true
          description: Pass as `before_id`; `null` on the last page.
    FleetWafPage:
      type: object
      description: One page of fanned-in WAF events.
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FleetWafRow"
        next_cursor:
          type: integer
          nullable: true
    DriftReport:
      type: object
      description: Payload of `GET /api/v1/cluster/drift` (Story 9.4 AC #12).
      properties:
        current_generation:
          type: integer
        current_hash:
          type: string
        drifted:
          type: array
          items:
            $ref: "#/components/schemas/DriftEntry"
        in_sync:
          type: integer
        quarantined:
          type: array
          items:
            type: string
    BreakGlass:
      type: object
      description: A follower's break-glass window (Story 9.4 AC #11).
      properties:
        active:
          type: boolean
        until:
          type: string
          format: date-time
          nullable: true
        remaining_s:
          type: integer
          nullable: true
    User:
      type: object
      description: A dashboard / API user account (password hash never serialized).
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        must_change_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
        disabled:
          type: boolean
        created_by:
          type: string
          nullable: true

    Role:
      type: string
      description: >-
        RBAC role of a user account (Story 8.3). viewer is read-only
        with secrets scrubbed; operator has full CRUD except settings
        writes and user management; super_admin has full access.
      enum: [super_admin, operator, viewer]

    CustomVerification:
      type: object
      description: >
        Tagged union (discriminator "kind"). rdns carries suffixes,
        ip_ranges carries cidrs, ua_only carries no payload.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [rdns, ip_ranges, ua_only]
        suffixes:
          type: array
          description: Present when kind=rdns; each entry dot-prefixed (e.g. ".crawl.commoncrawl.org")
          items:
            type: string
        cidrs:
          type: array
          description: Present when kind=ip_ranges; max 64 CIDR strings
          items:
            type: string
    CustomCrawlerRequest:
      type: object
      required: [name, user_agent_pattern, verification]
      properties:
        name:
          type: string
          maxLength: 64
        user_agent_pattern:
          type: string
          description: Regex source; compiled case-insensitive with size + DFA caps
        verification:
          $ref: "#/components/schemas/CustomVerification"
        enabled:
          type: boolean
          default: true
    CustomCrawler:
      type: object
      required: [id, name, user_agent_pattern, verification, enabled, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        user_agent_pattern:
          type: string
        verification:
          $ref: "#/components/schemas/CustomVerification"
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BuiltinCrawler:
      type: object
      required: [name, user_agent_pattern, verification_kind, source]
      properties:
        name:
          type: string
          example: GPTBot
        user_agent_pattern:
          type: string
          example: "(?i)\\bGPTBot\\b"
        verification_kind:
          type: string
          enum: [rdns, ip_ranges, ua_only]
        source:
          type: string
          example: OpenAI
    Route:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        path_prefix:
          type: string
        backends:
          type: array
          items:
            type: string
            format: uuid
        certificate_id:
          type: string
          format: uuid
          nullable: true
        load_balancing:
          type: string
          enum: [round_robin, consistent_hash, random, peak_ewma]
        waf_enabled:
          type: boolean
        enabled:
          type: boolean
        redirect_to:
          type: string
          nullable: true
          description: If set, respond with 301 redirect to this URL instead of proxying. Original path is appended.
        return_status:
          type: integer
          nullable: true
          description: If set, respond with this HTTP status code directly without proxying.
        path_rules:
          type: array
          items:
            $ref: '#/components/schemas/PathRule'
          description: Ordered list of sub-path overrides. First matching rule wins.
        managed_by:
          $ref: "#/components/schemas/ManagedBy"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ManagedBy:
      type: object
      description: >-
        Present only on a row the automation API owns (Story 10.4 AC #8).
        The management API answers 409 to an in-place update of such a
        row, and to a delete of a managed backend; a managed route may be
        deleted, which removes its environment with it. The field is
        server-owned: sending it on a request body is a 422.
      required: [kind, environment]
      properties:
        kind:
          type: string
          enum: [automation]
        environment:
          type: string
          description: The automation environment name that owns the row.

    CreateRouteRequest:
      type: object
      required: [hostname]
      properties:
        hostname:
          type: string
        path_prefix:
          type: string
          default: "/"
        backend_ids:
          type: array
          items:
            type: string
            format: uuid
        certificate_id:
          type: string
          format: uuid
        load_balancing:
          type: string
          enum: [round_robin, consistent_hash, random, peak_ewma]
          default: round_robin
        redirect_to:
          type: string
          description: If set, respond with 301 redirect to this URL instead of proxying.
        return_status:
          type: integer
          description: If set, respond with this HTTP status code directly.
        path_rules:
          type: array
          items:
            $ref: '#/components/schemas/PathRule'

    UpdateRouteRequest:
      type: object
      properties:
        hostname:
          type: string
        path_prefix:
          type: string
        backend_ids:
          type: array
          items:
            type: string
            format: uuid
        certificate_id:
          type: string
          format: uuid
        load_balancing:
          type: string
          enum: [round_robin, consistent_hash, random, peak_ewma]
        enabled:
          type: boolean
        redirect_to:
          type: string
          description: If set, respond with 301 redirect to this URL instead of proxying.
        return_status:
          type: integer
          description: If set, respond with this HTTP status code directly.
        path_rules:
          type: array
          items:
            $ref: '#/components/schemas/PathRule'

    PathRule:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Path to match (e.g. /admin, /api/v1/)
        match_type:
          type: string
          enum: [prefix, exact]
          default: prefix
        backend_ids:
          type: array
          items:
            type: string
            format: uuid
        cache_enabled:
          type: boolean
        cache_ttl_s:
          type: integer
        response_headers:
          type: object
          additionalProperties:
            type: string
        response_headers_remove:
          type: array
          items:
            type: string
        rate_limit_rps:
          type: integer
        rate_limit_burst:
          type: integer
        redirect_to:
          type: string
        return_status:
          type: integer

    CaptureMatch:
      type: object
      description: Which requests a rule considers. Every populated field narrows; an empty block considers every request on the route.
      properties:
        source_cidrs:
          type: array
          description: Client source addresses as CIDRs or bare IPs. Empty means any.
          items:
            type: string
        methods:
          type: array
          description: Uppercase HTTP methods. Empty means any.
          items:
            type: string
        path_prefix:
          type: string
          nullable: true
        path_regex:
          type: string
          nullable: true
          description: Regex over the request path, at most 4096 bytes of source.
        headers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              match_type:
                type: string
                enum: [exact, prefix, regex]
              value:
                type: string

    CaptureEmit:
      type: object
      description: >-
        Which of the considered requests are written out. Exactly one
        shape is legal: `always: true` alone, or at least one of the other
        three with `always` false.
      properties:
        always:
          type: boolean
        status:
          type: array
          items:
            oneOf:
              - type: string
                enum: [client_error, server_error, client_aborted]
              - type: object
                properties:
                  exact:
                    type: integer
        min_latency_ms:
          type: integer
          nullable: true
        upstream_error:
          type: boolean

    CaptureScope:
      type: object
      description: How much of a captured exchange is kept. Headers and the request line are always kept.
      properties:
        request_body:
          type: boolean
        response_body:
          type: boolean
        request_body_max_bytes:
          type: integer
          description: Non-zero, at most 4194304.
        response_body_max_bytes:
          type: integer
          description: Non-zero, at most 4194304.

    CaptureLimits:
      type: object
      description: What stops a rule - a total, a rate, and a clock.
      properties:
        max_captures:
          type: integer
          description: Non-zero, at most 10000.
        rate_per_minute:
          type: integer
          description: Non-zero, at most 10000. Zero is refused rather than read as unlimited.
        ttl_seconds:
          type: integer
          description: Non-zero, at most 604800 (seven days). Becomes the absolute `expires_at`.

    CaptureOutput:
      type: object
      description: >-
        Where captures land beyond the structured log, the export lanes and
        the recent-captures ring, which every record reaches. `dir` absent
        means no file is written; present, one file per capture under a
        directory that must already exist, pruned oldest-first to
        `max_dir_bytes` when set.
      properties:
        dir:
          type: string
          nullable: true
        max_dir_bytes:
          type: integer
          nullable: true

    CaptureRedaction:
      type: object
      description: >-
        Names redacted IN ADDITION to the always-redacted set the capture
        writer applies. An empty block still produces a redacted capture.
      properties:
        headers:
          type: array
          items:
            type: string
        query:
          type: array
          items:
            type: string

    CaptureRuleRequest:
      type: object
      description: >-
        Body for creating or replacing a capture rule. Unknown fields are
        refused, which is what makes `expires_at`, `captures_emitted` and
        `captures_dropped` server-owned rather than merely ignored.
      required: [name, route_id]
      properties:
        name:
          type: string
        route_id:
          type: string
          description: Must name an existing route; a route that does not exist is a 422 on this field.
        enabled:
          type: boolean
          default: true
        match:
          $ref: "#/components/schemas/CaptureMatch"
        emit:
          $ref: "#/components/schemas/CaptureEmit"
        capture:
          $ref: "#/components/schemas/CaptureScope"
        limits:
          $ref: "#/components/schemas/CaptureLimits"
        output:
          $ref: "#/components/schemas/CaptureOutput"
        redact:
          $ref: "#/components/schemas/CaptureRedaction"

    CaptureRule:
      type: object
      description: One traffic-capture rule, always bound to exactly one route.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        route_id:
          type: string
        enabled:
          type: boolean
        match:
          $ref: "#/components/schemas/CaptureMatch"
        emit:
          $ref: "#/components/schemas/CaptureEmit"
        capture:
          $ref: "#/components/schemas/CaptureScope"
        limits:
          $ref: "#/components/schemas/CaptureLimits"
        output:
          $ref: "#/components/schemas/CaptureOutput"
        redact:
          $ref: "#/components/schemas/CaptureRedaction"
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Absolute UTC instant, so every node in a fleet stops the rule at the same moment.
        captures_emitted:
          type: integer
          readOnly: true
          description: This node's process counter. Read-only; refused on input.
        captures_dropped:
          type: integer
          readOnly: true
          description: This node's process counter. Read-only; refused on input.

    RecentCaptureHalf:
      type: object
      description: >-
        One direction of a capture record as the ring lists it. The record's
        own fields (`docs/capture.md`) plus the two elision markers the
        listing adds.
      properties:
        method:
          type: string
          description: Request half only.
        uri:
          type: string
          description: Request half only; named query parameters masked.
        version:
          type: string
          description: Request half only.
        status:
          type: integer
          description: Response half only; the status written downstream.
        headers:
          type: array
          description: Ordered `[name, value]` pairs; duplicates kept; credentials replaced by `<redacted:N bytes>`.
          items:
            type: array
            items:
              type: string
        body:
          type: string
          nullable: true
          description: The kept bytes in `body_encoding`, cut at 4 KiB in the listing when `body_elided`.
        body_encoding:
          type: string
          nullable: true
          enum: [utf8, base64]
        body_bytes_total:
          type: integer
          description: Bytes the body carried on the wire.
        truncated:
          type: boolean
          description: Whether the record's body is a prefix of what was sent (the rule's cap).
        body_skipped:
          type: string
          nullable: true
          enum: [streaming, budget, disabled]
        body_elided:
          type: boolean
          description: Whether the listing cut `body`. Absent when `body` is null.
        body_elided_total:
          type: integer
          description: Length of the stored `body` string before the cut. Present only when `body_elided`.

    RecentCapture:
      type: object
      description: One capture record as the ring lists it; the download returns the same record with whole bodies.
      properties:
        kind:
          type: string
          enum: [capture]
        rule_id:
          type: string
        rule_name:
          type: string
        route_id:
          type: string
        request_id:
          type: string
          description: The access-log row's `request_id`; the join key and the download key.
        timestamp:
          type: string
          format: date-time
        client_ip:
          type: string
        is_xff:
          type: boolean
        backend:
          type: string
        latency_ms:
          type: integer
        error:
          type: string
          nullable: true
        request:
          $ref: "#/components/schemas/RecentCaptureHalf"
        response:
          $ref: "#/components/schemas/RecentCaptureHalf"

    AutomationScope:
      type: string
      description: >-
        What an automation token may do. The enum is closed and these four are
        the whole surface for 1.8.0; an unknown string is refused rather than
        dropped, so a token written against a newer Lorica fails loudly instead
        of silently losing a grant.
      enum:
        - environments:write
        - environments:read
        - routes:read
        - certificates:read

    AutomationTokenRequest:
      type: object
      description: >-
        Body for minting an automation token. Unknown fields are refused, which
        is what makes the server-owned facts server-owned rather than ignored.
      required: [name, scopes, allowed_hostnames]
      properties:
        name:
          type: string
          description: Operator-facing label.
        scopes:
          type: array
          description: At least one; a token that grants nothing can do nothing.
          items:
            $ref: "#/components/schemas/AutomationScope"
        allowed_hostnames:
          type: array
          description: >-
            At least one. An exact name (`api.example.com`) or a single leading
            wildcard (`*.preview.example.com`), read with TLS wildcard semantics:
            one label. A bare `*` is refused.
          items:
            type: string
        allowed_backend_cidrs:
          type: array
          description: "CIDRs (or bare addresses) this token may point a hostname at. At least one: there is no node-wide default backend policy, and an empty list would be read as every address."
          minItems: 1
          items:
            type: string
        max_ttl_seconds:
          type: integer
          description: Ceiling on the lifetime any environment this token creates may request. Defaults to seven days; the model caps it at thirty.
        expires_at:
          type: string
          format: date-time
          description: Absolute instant the token stops being accepted. Mutually exclusive with `lifetime_days`.
        lifetime_days:
          type: integer
          description: Lifetime from now, in days. Mutually exclusive with `expires_at`. Defaults to 365 when neither is sent.

    AutomationToken:
      type: object
      description: >-
        One automation token's public facts. There is deliberately no field for
        the secret and none for its HMAC: the secret exists once, in the answer
        that minted it, and the HMAC is the node's private means of recognising
        it.
      properties:
        public_id:
          type: string
          description: The lookup half, and the id a revocation names.
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AutomationScope"
        allowed_hostnames:
          type: array
          items:
            type: string
        allowed_backend_cidrs:
          type: array
          items:
            type: string
        max_ttl_seconds:
          type: integer
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the token was last accepted, or null if never presented.
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When an operator withdrew it, or null while it stands.

    OidcIssuerRequest:
      type: object
      description: >-
        Body for registering an OIDC issuer entry. Unknown fields are refused,
        which is what makes the server-owned facts server-owned rather than
        ignored.
      required: [issuer, audience, allowed_hostnames, scopes]
      properties:
        issuer:
          type: string
          description: The GitLab instance URL, which is the token's `iss`. Must be `https`.
        audience:
          type: string
          description: The value the job puts in `id_tokens.<NAME>.aud`. Identifies this Lorica instance.
        jwks_url:
          type: string
          description: Where the signing keys are fetched from. Must be `https`. Defaults to `<issuer>/oauth/discovery/keys`.
        ca_pem:
          type: string
          nullable: true
          description: >-
            One or more PEM certificates that become the ONLY trust anchors for
            this entry's JWKS fetch, replacing the node's own roots for it.
            Omit it on a public GitLab, or on a self-hosted one whose CA the
            node already trusts. At least one certificate must parse, and the
            whole field is capped at 64 KiB. It is never returned: `GET`
            answers with `ca_fingerprint`.
        bound_claims:
          type: object
          additionalProperties:
            type: string
          description: >-
            Claims that must match exactly, keyed by `project_path`,
            `namespace_path`, `ref_protected`, `environment_protected` or
            `deployment_tier`. A `*` glob is accepted in `project_path` only;
            the two `_protected` claims take exactly `true` or `false`.
        allowed_hostnames:
          type: array
          description: At least one; the same one-label wildcard rule as a static token.
          items:
            type: string
        allowed_backend_cidrs:
          type: array
          description: "CIDRs a token from this entry may point a hostname at. At least one: there is no node-wide default backend policy, and an empty list would be read as every address."
          minItems: 1
          items:
            type: string
        max_ttl_seconds:
          type: integer
          description: Ceiling on the lifetime any environment a token from this entry creates may request. Defaults to seven days; the model caps it at thirty.
        scopes:
          type: array
          description: At least one; an entry that grants nothing can do nothing.
          items:
            $ref: "#/components/schemas/AutomationScope"

    OidcIssuer:
      type: object
      description: >-
        One OIDC issuer entry as the API answers it. There is no secret in it,
        and the pinned CA is reported as a fingerprint rather than as the PEM.
      properties:
        id:
          type: string
          format: uuid
          description: The id a removal names.
        issuer:
          type: string
        audience:
          type: string
        jwks_url:
          type: string
        ca_fingerprint:
          type: string
          nullable: true
          description: >-
            Lowercase-hex SHA-256 of the first pinned certificate's DER, which
            is what `openssl x509 -fingerprint -sha256` prints, so an operator
            can confirm which CA is pinned without the PEM leaving the node.
            Null when the entry fetches on the node's own trust roots. The
            `ca_pem` itself is never returned.
        bound_claims:
          type: object
          additionalProperties:
            type: string
        allowed_hostnames:
          type: array
          items:
            type: string
        allowed_backend_cidrs:
          type: array
          items:
            type: string
        max_ttl_seconds:
          type: integer
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AutomationScope"
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    Backend:
      type: object
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
        weight:
          type: integer
        health_status:
          type: string
          enum: [healthy, degraded, down]
        health_check_enabled:
          type: boolean
        health_check_interval_s:
          type: integer
        tls_upstream:
          type: boolean
        managed_by:
          $ref: "#/components/schemas/ManagedBy"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateBackendRequest:
      type: object
      required: [address]
      properties:
        address:
          type: string
        weight:
          type: integer
          default: 100
        health_check_enabled:
          type: boolean
          default: true
        health_check_interval_s:
          type: integer
          default: 10
        tls_upstream:
          type: boolean
          default: false

    UpdateBackendRequest:
      type: object
      properties:
        address:
          type: string
        weight:
          type: integer
        health_check_enabled:
          type: boolean
        health_check_interval_s:
          type: integer
        tls_upstream:
          type: boolean

    Certificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        san_domains:
          type: array
          items:
            type: string
        fingerprint:
          type: string
        issuer:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        is_acme:
          type: boolean
        acme_auto_renew:
          type: boolean
        acme_method:
          type: string
          description: "ACME provisioning method: http01, dns01-cloudflare, dns01-route53, dns01-ovh, dns01-manual"
          nullable: true
        created_at:
          type: string
          format: date-time

    CertificateDetail:
      allOf:
        - $ref: "#/components/schemas/Certificate"
        - type: object
          properties:
            cert_pem:
              type: string
            associated_routes:
              type: array
              items:
                type: string
                format: uuid

    CreateCertificateRequest:
      type: object
      required: [domain, cert_pem, key_pem]
      properties:
        domain:
          type: string
        cert_pem:
          type: string
        key_pem:
          type: string

    Status:
      type: object
      properties:
        routes_count:
          type: integer
        backends_count:
          type: integer
        backends_healthy:
          type: integer
        backends_degraded:
          type: integer
        backends_down:
          type: integer
        certificates_count:
          type: integer
        certificates_expiring_soon:
          type: integer

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string

    SettingsFieldSchema:
      type: object
      description: |
        Constraints for a single operator-tunable global settings field
        (Story 8.10 AC #7). Numeric fields carry `min` and, when the
        validator enforces an upper bound, `max`. Enum fields carry
        `choices`. Every field carries its `default`.
      properties:
        type:
          type: string
          enum: [integer, number, boolean, string, enum]
        min:
          type: number
          description: Inclusive lower bound (numeric fields only).
        max:
          type: number
          description: Inclusive upper bound; omitted when the server enforces no ceiling.
        default:
          description: Default value from GlobalSettings::default.
        choices:
          type: array
          items:
            type: string
          description: Allowed values (enum fields only).
      required: [type]

    # v1.5.1 audit L-14 : richer schemas for the
    # Notification + Preference endpoints that previously
    # surfaced as `type: object` (no fields). External
    # consumers (curl users, generated SDKs, third-party
    # docs) now have the actual contract.

    NotificationConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [email, webhook, slack]
        enabled:
          type: boolean
        config:
          type: string
          description: |
            Channel-specific JSON blob (encrypted at rest when
            the store has an encryption key). For Email :
            `{"smtp_host", "smtp_port"?, "smtp_username"?,
            "smtp_password"?, "smtp_encryption"?, "from_address",
            "to_address"}`. `smtp_encryption` is one of
            `"starttls"` (plaintext then STARTTLS upgrade,
            default, typical port 587), `"tls"` (implicit TLS /
            SMTPS, typical port 465), `"none"` (plaintext SMTP,
            typical port 25 - LAN MTA relays only ; never use
            over an untrusted network). When `smtp_port` is unset,
            the sender falls back to 587 / 465 / 25 respectively
            so the happy path is zero-config once the encryption
            mode is picked. Pre-v1.5.2 stored configs (no
            `smtp_encryption` field) deserialise to `"starttls"`
            for backwards compat. Unknown encryption values are
            rejected with a serde error (v1.5.2 SMTP encryption
            feature). For Webhook / Slack :
            `{"url", "auth_header"?}`. Channel secrets
            (`smtp_password`, `url`, `auth_header`) are scrubbed
            to `**REDACTED**` when this struct surfaces through
            `GET /api/v1/config/export`, and to `********` on JSON
            read paths (`GET /api/v1/notifications`) that do not
            require the live credential (v1.5.1 audit H-1 + L-5,
            v1.5.2 audit M-1 closes the JSON-vs-export asymmetry).
            On `PUT /api/v1/notifications/:id`, sending the
            `********` sentinel for any of these fields preserves
            the previously stored value.
        alert_types:
          type: array
          items:
            type: string
          description: Alert categories this destination subscribes to (`cert_expiring`, `backend_down`, `waf_alert`, `config_changed`, `sla_breached`, `sla_recovered`, `ip_banned`, `cluster_node_left`, `cluster_config_refused`, `cluster_drift`).

    CreateNotificationRequest:
      type: object
      required: [channel, config]
      properties:
        channel:
          type: string
          enum: [email, webhook, slack]
        enabled:
          type: boolean
          default: true
        config:
          type: string
          description: Channel-specific JSON blob (see `NotificationConfig.config`).
        alert_types:
          type: array
          items:
            type: string

    UpdateNotificationRequest:
      type: object
      properties:
        enabled:
          type: boolean
        config:
          type: string
        alert_types:
          type: array
          items:
            type: string

    UserPreference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        preference_key:
          type: string
          description: Stable key (e.g. `self_signed_cert`).
        value:
          type: string
          enum: [never, always, once]
          description: Tri-state preference value.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdatePreferenceRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          enum: [never, always, once]

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but the session role is insufficient
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: The body parsed but a model rule refuses its content
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: >-
        The resource exists in the product but not in this process; the
        message names where to read it instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
