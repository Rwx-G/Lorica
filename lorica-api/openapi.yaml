  # ---------------------------------------------------------------------------
  # Validation helpers (v1.5.1 audit M-14 backfill)
  # ---------------------------------------------------------------------------
  /api/v1/validate/mtls-pem:
    post:
      tags: [Validation]
      summary: Pre-flight check on a PEM-encoded mTLS CA bundle
      description: |
        Parses the supplied PEM and reports the leaf + chain cert
        details (subject, SANs, validity dates) so the operator
        can confirm a CA / client cert is well-formed before
        wiring it into a route's mTLS config.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pem]
              properties:
                pem:
                  type: string
                  description: One or more `-----BEGIN CERTIFICATE-----` blocks.
      responses:
        "200":
          description: Parse outcome
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/validate/forward-auth:
    post:
      tags: [Validation]
      summary: Pre-flight check on a forward-auth endpoint
      description: |
        Issues a probe request to the operator-supplied URL and
        reports the response shape (status code, latency, returned
        headers) so the operator can confirm the endpoint is
        reachable and emits the expected forward-auth contract
        before binding it to a route.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Probe outcome
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

