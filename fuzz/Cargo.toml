[package]
name = "lorica-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lorica-waf = { path = "../lorica-waf" }
lorica-config = { path = "../lorica-config" }
lorica-tls = { path = "../lorica-tls" }
lorica-core = { path = "../lorica-core", default-features = false }
lorica-stream = { path = "../lorica-stream" }
# rustls' own ClientHello for `fuzz_client_hello`'s round trip, on the
# `ring` provider the workspace pins (audit M-6).
rustls = { version = "0.23.12", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"

[[bin]]
name = "fuzz_waf_evaluate"
path = "fuzz_targets/fuzz_waf_evaluate.rs"
doc = false

[[bin]]
name = "fuzz_api_input"
path = "fuzz_targets/fuzz_api_input.rs"
doc = false

[[bin]]
name = "fuzz_ocsp_response"
path = "fuzz_targets/fuzz_ocsp_response.rs"
doc = false

[[bin]]
name = "fuzz_proxy_protocol"
path = "fuzz_targets/fuzz_proxy_protocol.rs"
doc = false

[[bin]]
name = "fuzz_client_hello"
path = "fuzz_targets/fuzz_client_hello.rs"
doc = false
