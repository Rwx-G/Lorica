[package]
name = "lorica-notify"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
lorica-metrics = { version = "1.5.13", path = "../lorica-metrics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
# Floor pinned to 0.11.22: RUSTSEC-2026-0141 (CVSS 9.1, inverted
# boolean silently disabling TLS hostname verification) affected
# 0.10.1 through 0.11.21. Lorica uses `tokio1-rustls-tls`, not the
# vulnerable `boring-tls` backend, so the path is inactive here, but
# the floor blocks any resolve below the fix as defense in depth.
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
thiserror = "2"
parking_lot = "0.12"
