[package]
name = "lorica-lb"
version = "0.1.0"
authors = ["Rwx-G"]
# Original author: Yuchen Wu <yuchen@cloudflare.com> (Cloudflare Pingora)
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/Rwx-G/Lorica"
categories = ["network-programming"]
keywords = ["proxy", "lorica"]
description = """
Common load balancing features for Lorica proxy. Forked from Pingora.
"""

[lib]
name = "lorica_lb"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
lorica-http = { version = "0.1.0", path = "../lorica-http" }
lorica-error = { version = "0.1.0", path = "../lorica-error" }
lorica-core = { version = "0.1.0", path = "../lorica-core", default-features = false }
lorica-ketama = { version = "0.1.0", path = "../lorica-ketama" }
lorica-runtime = { version = "0.1.0", path = "../lorica-runtime" }
arc-swap = "1"
fnv = "1"
rand = "0.8"
tokio = { workspace = true }
futures = "0.3"
log = { workspace = true }
http = { workspace = true }
derivative.workspace = true

[dev-dependencies]
# The tests install the ring provider explicitly
# (`rustls::crypto::ring::default_provider()`), so the aws_lc_rs default
# is not only unused here, it unifies onto the rustls node the whole
# workspace shares and drags aws-lc-sys (~69 MB of vendored C, built
# through cmake) into every `cargo test`. Same entry, same reason, as the
# one fixed in lorica-core (upstream 5396a1fa).
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }

[features]
default = []
rustls = ["lorica-core/rustls", "any_tls"]
any_tls = []
v2 = ["lorica-ketama/v2"]
